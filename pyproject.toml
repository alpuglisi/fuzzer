[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzlab"
version = "0.0.0"
description = "Lab-only, modular injection security-testing toolkit and research platform"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary — lab/research use only" }

# Runtime dependencies for the Phase 0 foundations. Bounded (compatible-release
# lower bound + next-major cap) rather than exact-pinned; the reproducible
# environment that matters for labels is the containerized target lab, whose
# PHP/Apache/MySQL/libxml versions are pinned in lab/ (decision D7).
dependencies = [
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "jsonschema>=4.20,<5",
    # Lab-generator foundation (component LAB, `fuzzlab/labgen/`): manifests
    # and the safety matrix are hand-authored YAML for readability; PyYAML is
    # imported directly by fuzzlab/labgen/schema.py and verdict.py (PA-0005 —
    # every runtime-imported library must be a declared dependency).
    "PyYAML>=6.0,<7",
    # Covering-array expansion for the lab generator (T-LAB0.3,
    # fuzzlab/labgen/resolver.py). Exact-pinned, not a range: a covertable
    # release can change its array output (sort/tie-break behavior is not a
    # documented stability guarantee), and this project treats a covertable
    # version bump as a manifest_version bump (docs/LAB_PHASE_0_PLAN.md
    # T-LAB0.3) rather than something that should float in silently.
    "covertable==3.2.0",
    # Module-composition emitter templates (T-LAB0.4, fuzzlab/labgen/modules/,
    # fuzzlab/labgen/emitters/php_current/): each source/transform/sink/complexity
    # fragment is a small Jinja2 template, imported directly (PA-0005) rather than
    # only via the `web` extra it was previously declared under.
    "jinja2>=3.1,<4",
    # Credential store (D12): OS keyring + encrypted-file headless fallback.
    # The headless encrypted-file backend is implemented on `cryptography`
    # (Fernet), not PyCrypto; declared explicitly since we import it directly.
    "keyring>=24,<26",
    "keyrings.alt>=5,<6",
    "cryptography>=42,<51",
    # Intercepting proxy (#11): the parsed path is a sans-I/O h11 view over raw bytes.
    "h11>=0.14,<1",
    # Mutation engine (#9): SQL-AST parsing for semantics-preserving operators and the
    # AST-equivalence semantics check. Its use is skip-guarded where the build is absent;
    # the string-level operators need no dependency.
    "sqlglot>=20,<30",
    # Note: JWT `exp` is read by decoding the payload directly (base64url); we never
    # verify or trust the token, only time its refresh, so no JWT/crypto dependency.
]

[project.optional-dependencies]
# JavaScript-rendering crawl (spider/fetcher dynamic mode).
browser = ["playwright>=1.40,<2"]
# Local web control panel + launcher (component #12, decision D11).
# starlette is pinned explicitly (not left to fastapi's transitive range):
# CVE-2026-48710 "BadHost" is a pre-1.0.1 Host-header validation bypass, and
# U6's control-plane hardening (host allow-list, Origin/Sec-Fetch checks) keys
# off Host/path, so the underlying ASGI layer must not be vulnerable to a
# Host-header bypass itself (CC-UI-0026).
web = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "jinja2>=3.1,<4",
       "starlette>=1.0.1,<2"]
# Lab generator: the metadata leakage-probe reference implementation
# (T-LAB0.11, fuzzlab/labgen/leakage_probe.py) — not needed for the rest of
# fuzzlab/labgen/, so kept optional rather than a main dependency (PA-0005:
# declared where it's actually imported).
labgen = ["scikit-learn>=1.3,<2", "numpy>=1.24,<3"]
# Lab-generator fingerprint-independence build gate (CR-LAB-0001 §3,
# fuzzlab/labgen/fingerprint_gate.py): scipy.stats.chi2_contingency backs the
# stack<->class / stack<->verdict independence test. Imported lazily inside
# the gate (PA-0005: never assumed present; a missing install raises a typed
# `MissingStatsDependencyError` naming this extra, not a raw ImportError).
labgen-stats = ["scipy>=1.11,<2"]
# Lab-generator Python/FastAPI emitter, Tier-A depth (L-P3.2,
# fuzzlab/labgen/emitters/python_fastapi/): this emitter's own module-render
# code only imports jinja2 (already a main dependency, see above) -- these
# are needed only to actually EXECUTE a rendered app (the TestClient-backed
# end-to-end tests, tests/test_labgen_python_fastapi_*.py), which are
# skip-guarded (PA-0005) when this extra isn't installed, matching
# php_current's `php_available()`/`php -l` convention for the same reason.
# Versions pinned to match the generated app's own requirements.txt lockfile
# (fuzzlab.labgen.emitters.python_fastapi.FASTAPI_VERSION etc.) as of
# 2026-09-21.
labgen-python-fastapi = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "sqlalchemy>=2.0,<3",
    "httpx>=0.27,<1",
]
# Developer tooling.
dev = ["pytest>=8,<9"]

[project.scripts]
# Single entry point; `fuzzlab <command>` dispatches (crawler, auditor, fuzzer,
# harness, web, ...). Each tool also stays runnable as `python -m fuzzlab.tools.<name>`.
fuzzlab = "fuzzlab.cli:main"

[tool.setuptools.packages.find]
include = ["fuzzlab*"]

[tool.setuptools.package-data]
"fuzzlab.tools" = ["data/*.db"]
"fuzzlab.labels" = ["schemas/*.json"]
"fuzzlab.audit.rules_data" = ["*.json"]
"fuzzlab.web" = ["templates/*.html", "static/*"]
"fuzzlab.labgen.modules" = ["sources/*.j2", "transforms/*.j2", "sinks/*.j2", "complexities/*.j2"]
"fuzzlab.labgen.emitters.python_fastapi" = [
    "templates/sources/*.j2",
    "templates/transforms/*.j2",
    "templates/sinks/*.j2",
    "templates/complexities/*.j2",
    "templates/scaffold/*.j2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
