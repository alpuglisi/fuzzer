# The fixture's origin root sends a visitor to bWAPP's portal (CC-LAB-0300), which
# redirects an anonymous visitor on to login.php and answers 200 once logged in. bWAPP
# lives under /bWAPP/; with this, a run whose base URL is the origin -- which a
# ground-truth-points run needs while BUG-0300 doubles a sub-path base -- still finds the
# login form and can confirm the login there. Our own config, not a change to bWAPP.
RedirectMatch 302 "^/$" "/bWAPP/portal.php"
