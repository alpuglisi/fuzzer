# One log line per request with the security-level cookie the request carried
# (CC-LAB-0300, BUG-0311). bWAPP keeps its level only in that cookie, and the fixture's
# labels rest on level 0, so the live test reads these lines to show that no request of
# a scored run carried another level. GlobalLog (Apache >= 2.4.19) applies in every
# virtual host. Our own config, not a change to bWAPP.
GlobalLog ${APACHE_LOG_DIR}/access.log "fuzzlab-level %{security_level}C \"%r\""
