; bWAPP connects to MySQL as "localhost", which PHP resolves to a unix socket. The db
; container has no network at all (network_mode: none); its socket directory is a
; tmpfs volume shared with this container. (CC-LAB-0300)
mysql.default_socket = /var/run/mysqld/mysqld.sock
mysqli.default_socket = /var/run/mysqld/mysqld.sock
pdo_mysql.default_socket = /var/run/mysqld/mysqld.sock
