# Lab h2 -> h1 downgrade front-end (Phase 9 T9.5, decision D17).
#
# A DELIBERATE request-smuggling / desync RESEARCH TARGET for the security lab: it
# accepts HTTP/2 (cleartext h2c, prior knowledge — what the toolkit's raw-frame client
# speaks) and proxies each request as HTTP/1.1 to the Puppy Fort Factory app. The h2->h1
# rewrite is exactly the topology where h2-to-h1 desync/smuggling primitives live.
#
# This is NOT a production or protective configuration. It runs only in the loopback lab,
# only when the `desync` compose profile is enabled, against infrastructure we own.

worker_processes 1;
events { worker_connections 256; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # The Puppy Fort Factory web tier (HTTP/1.1 only), on the compose network.
    upstream pff_app { server web:80; }

    server {
        listen 80;
        http2  on;                     # accept HTTP/2 cleartext (h2c) on this listener
        server_name _;

        location / {
            proxy_pass http://pff_app;
            proxy_http_version 1.1;     # <- the downgrade: HTTP/2 front, HTTP/1.1 back
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
