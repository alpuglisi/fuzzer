schema_version: 1
id: pc-xss-context-mismatch-0001
class: xss_context_mismatch
sink_family: html_attribute_unquoted
stack: php
root_cause: >
  A template helper HTML-entity-escaped a user-controlled value before
  writing it into an attribute position, which looked correct in review.
  The attribute itself was rendered without surrounding quotes by an older
  part of the template, so entity escaping (which protects against `<`,
  `>`, and `&`) never covered the whitespace/backtick characters that
  actually terminate an unquoted attribute, leaving the context
  exploitable despite the escaping call being present and "correct" in
  isolation.
