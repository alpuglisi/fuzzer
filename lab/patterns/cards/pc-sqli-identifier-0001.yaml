schema_version: 1
id: pc-sqli-identifier-0001
class: sqli_identifier
sink_family: sql_identifier
stack: php
root_cause: >
  A user-controlled sort-column name was interpolated directly into an
  ORDER BY clause. The application's escaping helper only quoted and
  escaped string *literals*, so it never ran on this value at all — the
  column name is not a literal, it's an identifier, and identifiers cannot
  be parameter-bound with a standard prepared-statement placeholder. The
  fix required an explicit allow-list of known column names rather than any
  form of escaping.
