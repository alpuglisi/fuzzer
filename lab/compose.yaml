# Target lab: the generated PHP lab (Laravel/`php_laravel` + MariaDB), containerized
# (D7). `L-P3.3c-CUT` re-points this file at the generator's own output -- the
# hand-built `puppy-fort-factory/` app it used to mount is retired.
#
# Safety: the web tier is published on LOOPBACK ONLY (127.0.0.1) and the database
# is not published at all. This deliberately vulnerable app must never be exposed
# on a shared or public network.
#
# One-command up:    ./labctl.sh up        (or: docker compose up -d --build)
# One-command reset: ./labctl.sh reset      (drops the DB volume and re-seeds)
#
# SELinux (Fedora): bind mounts use :Z / :ro,Z so the container can read them.
name: pff-lab

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${PFF_DB_NAME:-puppy_fort}
      MARIADB_USER: ${PFF_DB_USER:-pff}
      MARIADB_PASSWORD: ${PFF_DB_PASS:-pff_lab_pw}
      MARIADB_ROOT_PASSWORD: ${PFF_DB_ROOT_PASS:-root_lab_pw}
    volumes:
      # Fresh install needs only schema.sql (it creates + seeds everything,
      # including posts). Mounted read-only under the init hook.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,Z
      - pff-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    # No host port: the database is never reachable from outside the compose net.

  web:
    build:
      # The repo root: the build's `gen` stage runs the real generator
      # (`fuzzlab.labgen.assemble`), which needs `fuzzlab/` and
      # `lab/manifests/` in its build context, not just `lab/`.
      context: ..
      dockerfile: lab/web.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The generated app is a real Laravel app: it reads Laravel's own
      # DB_* env vars (not the old app's PFF_DB_HOST/... config.php keys).
      # These override the baked-in `.env`'s defaults without a rebuild
      # (Dotenv never overwrites an already-set process env var).
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${PFF_DB_NAME:-puppy_fort}
      DB_USERNAME: ${PFF_DB_USER:-pff}
      DB_PASSWORD: ${PFF_DB_PASS:-pff_lab_pw}
      APP_URL: http://127.0.0.1:${PFF_WEB_PORT:-8080}
      # Lab WAF (D16): the configurable request prefilter, now a Laravel
      # middleware (FzlWaf). DEFAULT OFF — the app is unchanged and all
      # ground-truth labels stay valid until a filter-evasion experiment
      # enables it. Toggle without a rebuild (only a restart):
      #   PFF_WAF=on PFF_WAF_MODE=block|sanitize|log
      PFF_WAF: ${PFF_WAF:-off}
      PFF_WAF_MODE: ${PFF_WAF_MODE:-block}
      # Grey-box coverage side channel (Phase 3). The FzlCoverage middleware
      # writes one JSON file per instrumented request here; the host
      # bind-mount below lets fuzzlab read them back. Only written when a
      # request carries X-Fzl-Cov.
      FZL_COV_DIR: /tmp/fzl-cov
    volumes:
      # No app bind mount: the app is a build artifact of the generator
      # (baked into the image by web.Dockerfile's `gen` stage), not a
      # hand-edited tree to live-edit. Editing a page now means editing its
      # manifest/emitter and rebuilding, not editing a file under this mount.
      #
      # Grey-box coverage side channel: shared host<->container dir (Phase 3 T3.1).
      # Host path is created by scripts/greybox_e2e.sh; loopback-only lab data.
      - ${FZL_COV_DIR:-/tmp/fzl-cov}:/tmp/fzl-cov:Z
    ports:
      # Loopback only. Change the host port with PFF_WEB_PORT; never bind 0.0.0.0.
      - "127.0.0.1:${PFF_WEB_PORT:-8080}:80"

  # h2 -> h1 downgrade front-end (D17): a deliberate desync/smuggling RESEARCH TARGET.
  # DEFAULT OFF — gated behind the `desync` compose profile, so a plain `up` never starts
  # it and the default lab is unchanged. Enable only for protocol-desync experiments:
  #   docker compose --profile desync up -d   (or: PFF_PROFILE=desync ./labctl.sh up)
  # Loopback only; lab-only; on infrastructure we own.
  frontend:
    image: nginx:1.27
    profiles: ["desync"]
    depends_on:
      web:
        condition: service_started
    volumes:
      - ./downgrade/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    ports:
      # Loopback only. The raw-frame client speaks h2c to this port.
      - "127.0.0.1:${PFF_DOWNGRADE_PORT:-8081}:80"

  # Browsable labs (CC-LAB-0247, Lane 7): the 10 split-out apps across the
  # other 5 stacks. DEFAULT OFF -- gated behind the `apps` compose profile,
  # so a plain `up` starts only PFF, unchanged. Enable with
  # `PFF_PROFILE=apps ./labctl.sh up` (combine with `desync` via
  # `PFF_PROFILE=apps,desync`). Ports are the fixed table in
  # docs/LAB_BROWSABLE_APPS_PLAN.md, kept in sync.
  #
  # Network isolation (S17): each app gets its OWN dedicated network, never
  # the project's implicit default network PFF/desync use -- a real SSRF
  # exists in this lab (ReelQueue's /api/content/thumbnail-import), so no
  # app may reach another by service-name DNS even though every host port
  # is loopback-only. A compose service with an explicit `networks:` key
  # stops auto-joining the default network (it does not join both), so
  # this is sufficient by itself -- the `db`/`web`/`frontend` services
  # above are deliberately left with no `networks:` key, unchanged.

  circlefeed:
    build:
      context: ..
      dockerfile: lab/web.Dockerfile
      args:
        APP: circlefeed
    profiles: ["apps"]
    networks: [circlefeed-net]
    ports:
      - "127.0.0.1:${CIRCLEFEED_WEB_PORT:-8082}:80"

  huddlehub:
    build:
      context: ..
      dockerfile: lab/web.Dockerfile
      args:
        APP: huddlehub
    profiles: ["apps"]
    networks: [huddlehub-net]
    ports:
      - "127.0.0.1:${HUDDLEHUB_WEB_PORT:-8083}:80"

  booking:
    build:
      context: ..
      dockerfile: lab/web.Dockerfile
      args:
        APP: booking
    profiles: ["apps"]
    networks: [booking-net]
    ports:
      - "127.0.0.1:${BOOKING_WEB_PORT:-8084}:80"

  pictrail:
    build:
      context: ..
      dockerfile: lab/web-django.Dockerfile
    profiles: ["apps"]
    networks: [pictrail-net]
    ports:
      - "127.0.0.1:${PICTRAIL_WEB_PORT:-8085}:8000"

  loopcast:
    build:
      context: ..
      dockerfile: lab/web-go.Dockerfile
    profiles: ["apps"]
    networks: [loopcast-net]
    ports:
      - "127.0.0.1:${LOOPCAST_WEB_PORT:-8086}:8080"

  trackernest:
    build:
      context: ..
      dockerfile: lab/web-spring.Dockerfile
      args:
        APP: trackernest
    profiles: ["apps"]
    networks: [trackernest-net]
    ports:
      - "127.0.0.1:${TRACKERNEST_WEB_PORT:-8087}:8080"

  reelqueue:
    build:
      context: ..
      dockerfile: lab/web-spring.Dockerfile
      args:
        APP: reelqueue
    profiles: ["apps"]
    networks: [reelqueue-net]
    ports:
      - "127.0.0.1:${REELQUEUE_WEB_PORT:-8088}:8080"

  wanderfare:
    build:
      context: ..
      dockerfile: lab/web-spring.Dockerfile
      args:
        APP: wanderfare
    profiles: ["apps"]
    networks: [wanderfare-net]
    ports:
      - "127.0.0.1:${WANDERFARE_WEB_PORT:-8089}:8080"

  forgecart:
    build:
      context: ..
      dockerfile: lab/web-rails.Dockerfile
    profiles: ["apps"]
    environment:
      RAILS_ENV: production
    networks: [forgecart-net]
    ports:
      - "127.0.0.1:${FORGECART_WEB_PORT:-8090}:3000"

  meadowmart:
    build:
      context: ..
      dockerfile: lab/web-node.Dockerfile
    profiles: ["apps"]
    environment:
      # Already baked into web-node.Dockerfile (ENV NODE_ENV=production);
      # set here too, harmless and explicit.
      NODE_ENV: production
    networks: [meadowmart-net]
    ports:
      - "127.0.0.1:${MEADOWMART_WEB_PORT:-8091}:3000"

volumes:
  pff-db-data:

networks:
  circlefeed-net: {}
  huddlehub-net: {}
  booking-net: {}
  pictrail-net: {}
  loopcast-net: {}
  trackernest-net: {}
  reelqueue-net: {}
  wanderfare-net: {}
  forgecart-net: {}
  meadowmart-net: {}
