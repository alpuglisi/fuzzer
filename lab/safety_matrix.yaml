  # --- webhook-signature: HMAC/signature verification correctness ---------
  # From docs/research/corpus-examples/webhook-signature/
  # {node,php,python}/. `naive_string_compare` and `loose_equality_compare`
  # are `partial`, not `no_effect`: unlike `no_signature_check`/
  # `trust_post_data` (no verification performed at all), these DO compare
  # the computed and provided signatures — they are just timing-unsafe
  # (`===`/`==` short-circuit on first mismatch) and, for `==` in PHP,
  # additionally vulnerable to the documented "magic hash" type-juggling
  # collision. Both are a genuinely harder attack than a total bypass, so
  # both stay VULNERABLE-but-harder (D20 `partial`), not `no_effect`.
  - op: no_signature_check
    sink_family: webhook_signature_verification
    effect: no_effect
  - op: trust_post_data
    sink_family: webhook_signature_verification
    effect: no_effect
  - op: naive_string_compare
    sink_family: webhook_signature_verification
    effect: partial
    neutralizes: [weak_signature_comparison]
  - op: loose_equality_compare
    sink_family: webhook_signature_verification
    effect: partial
    neutralizes: [weak_signature_comparison]
  - op: constant_time_compare
