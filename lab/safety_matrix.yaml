# fuzzlab lab-generator safety matrix — v1
#
# Append-only, like this project's change-control logs (see
# docs/PREVENTIVE_ACTIONS.md's own convention): add a new entry and bump
# `version` for a breaking change to an *existing* (op, sink_family) pair;
# a brand-new op or sink_family is just a new entry under the same version.
# Validated against lab/schemas/safety_matrix.schema.json by
# fuzzlab.labgen.verdict.load_safety_matrix().
#
# This is a Phase 0 scaffold: the handful of entries below is deliberately
# small, sanity-checked against a couple of Ryder's Puppy Fort Factory's real
# pages (puppy-fort-factory/VULNERABILITIES.md) to prove the shape is
# expressive enough for that lab's actual vulnerability shapes — it is NOT a
# migration of those pages (that is explicitly out of scope for this change;
# see the LAB change-control entry for this delivery).
#
# Concern-ID vocabulary used below (informative, not schema-enforced yet):
#   sql_syntax_break — attacker input can terminate/alter SQL syntax
#   html_tag_break    — attacker input can open a new HTML tag/context
#   error_based_disclosure — a pipeline leaks raw query/error text on failure
#   sql_identifier_substitution — attacker input chooses *which* column/table/
#     alias the query names, without needing to break SQL syntax at all
#     (identifier/alias/connector-position injection; added L-P1.2b)
#   js_context_break — attacker input reaches a JavaScript execution context
#     (e.g. the body of a `javascript:` URL), where HTML-entity escaping is
#     the wrong escaping (added L-P1.2b)
#   ownership_check_bypass — a lookup by ID/key returns or acts on a resource
#     without verifying the requester owns/is a member of it (IDOR) (added
#     CC-LAB-0063)
#   jwt_algorithm_confusion — JWT signature verification does not pin/
#     restrict the accepted algorithm, so an attacker-chosen `alg` (e.g.
#     `none`, or a public-key algorithm swapped for an HMAC one) is honored
#     (added CC-LAB-0063)
#   weak_token_entropy — a session/reset/API token is derived from a
#     non-cryptographic, predictable source (added CC-LAB-0063)
#   stale_authorization_state — an authorization decision (e.g. "is this
#     account blocked") is taken from a value cached at an earlier point
#     (e.g. login time) rather than revalidated for the current request
#     (added CC-LAB-0063)
#   price_integrity_bypass — a payment/charge amount is taken from
#     client-supplied input rather than recomputed server-side from trusted
#     data (added CC-LAB-0063)
#   race_condition_toctou — a check-then-act gap (e.g. "is this coupon
#     unused?" then "mark it used") allows the same single-use resource to
#     be redeemed, or the same counter incremented, more than once under
#     concurrent requests (added CC-LAB-0063)
#   unrestricted_file_upload — an uploaded file's true type/executability is
#     not verified, allowing a web-executable file into a web-served path
#     (added CC-LAB-0063)
#   path_traversal — a filesystem path built from tainted input can escape
#     its intended base directory (added CC-LAB-0063)
#   sql_order_by_injection — tainted input selects the `ORDER BY`
#     column/direction with no fixed allowlist — the sort-clause-scoped
#     sibling of `sql_identifier_substitution` (added CC-LAB-0063)
#   server_template_injection — tainted input becomes template *source*
#     compiled/evaluated at render time, not just data interpolated into a
#     fixed, file-loaded template (added CC-LAB-0063)
#   xxe_entity_resolution — the XML parser resolves external entities
#     declared in a document it parses (added CC-LAB-0063)
#   mass_assignment — tainted request-body fields are written into a
#     persisted entity beyond the fields the endpoint intends to accept
#     (added CC-LAB-0063)
#   ssrf_request_forgery — server-side code fetches a URL whose host/scheme
#     is attacker-influenced, reaching internal/otherwise-unreachable
#     network targets (added CC-LAB-0063)
#   insecure_deserialization — tainted bytes are deserialized by a mechanism
#     that can construct/execute more than plain data (objects, closures,
#     code), not just parse a fixed data format (added CC-LAB-0063)
#   email_header_injection — tainted input reaches a raw mail-header string
#     with no CR/LF stripping, allowing extra headers/recipients to be
#     injected (added CC-LAB-0063)
#   http_header_injection — tainted input reaches a raw HTTP response header
#     with no CR/LF stripping, allowing response-splitting/extra headers
#     (added CC-LAB-0063)
#   weak_signature_comparison — a webhook/HMAC signature is verified with a
#     non-constant-time or type-juggling-prone comparison, or verification
#     is skipped/bypassable entirely (added CC-LAB-0063)
#   proto_pollution — attacker-controlled `__proto__`/`constructor.prototype`
#     keys reach an unguarded recursive object merge, letting the merge write
#     onto the shared `Object.prototype` chain instead of (or in addition to)
#     the intended target object -- a JS/Node-runtime-only mechanism, CWE-1321
#     (added CC-LAB-0070; reuses the concern-id vocabulary already named for
#     this class in `lab/patterns/sourcing/crosswalk.yaml`'s `proto_pollution`
#     sourcing class, rather than minting a second name for the same concept)
version: 1
entries:
  # --- SQL sinks -----------------------------------------------------
  # Raw string concatenation: no transform at all. This is the baseline
  # vulnerable shape behind product.php's ?id= (VULNERABILITIES.md).
  - op: raw_concat
    sink_family: sql_string_literal
    effect: no_effect
  - op: raw_concat
    sink_family: sql_numeric_literal
    effect: no_effect

  # Parameterized query / prepared statement: fully neutralizes syntax
  # breakout in either a quoted-string or unquoted-numeric SQL position.
  - op: param_bind
    sink_family: sql_string_literal
    effect: neutralises
    neutralizes: [sql_syntax_break]
  - op: param_bind
    sink_family: sql_numeric_literal
    effect: neutralises
    neutralizes: [sql_syntax_break]

  # A naive quote-stripping filter (removes literal ' only): reduces but
  # does not fully close the string-literal escape (e.g. a backslash- or
  # encoding-based bypass survives it) — the D20 "partial" case: this stays
  # VULNERABLE, just harder, never a third verdict value.
  - op: strip_quotes_naive
    sink_family: sql_string_literal
    effect: partial
    neutralizes: [sql_syntax_break]

  # A verbose error handler that echoes the raw failing query on exception:
  # even layered after a safe param_bind pipeline, this reintroduces a new
  # concern (error-based disclosure) — the "introduces" mechanic.
  - op: verbose_error_leak
    sink_family: sql_string_literal
    effect: introduces
    introduces: [error_based_disclosure]

  # --- HTML sinks ------------------------------------------------------
  # No escaping: the baseline vulnerable shape behind profile.php's stored
  # bio field (VULNERABILITIES.md).
  - op: raw_concat
    sink_family: html_body
    effect: no_effect
  - op: raw_concat
    sink_family: html_attribute_unquoted
    effect: no_effect

  # htmlspecialchars() in an HTML body context: fully neutralizes tag
  # breakout.
  - op: html_entity_escape
    sink_family: html_body
    effect: neutralises
    neutralizes: [html_tag_break]

  # The same escaping function, but the sink is an *unquoted* HTML
  # attribute: htmlspecialchars() does not escape spaces/backticks, so the
  # attribute boundary can still be broken — an escaping-context mismatch
  # (CR-LAB-0001's "escaping-context-mismatch XSS", the highest value/hour
  # item flagged for Phase 1). This is a "partial" entry: still VULNERABLE,
  # just harder — exactly the D20 binary-verdict shape.
  - op: html_entity_escape
    sink_family: html_attribute_unquoted
    effect: partial
    neutralizes: [html_tag_break]

  # The same escaping function is fully sufficient once the attribute is
  # quoted.
  - op: html_entity_escape
    sink_family: html_attribute_quoted
    effect: neutralises
    neutralizes: [html_tag_break]

  # Applying an SQL-oriented op at an HTML sink does nothing for HTML —
  # exercises the "wrong transform for this family" no_effect case.
  - op: param_bind
    sink_family: html_body
    effect: no_effect

  # --- L-P1.2b: the harder shapes (docs/LAB_IMPLEMENTATION_PLAN.md §2.2) ---
  # All entries below are brand-new (op, sink_family) pairs — new ops and/or
  # new sink families — so, per this file's own append-only rule, they are
  # additions under the SAME `version: 1`, not a version bump: no existing
  # pair's meaning changes, and a corpus generated under v1 before these
  # landed re-derives identically.

  # --- identifier/alias/connector-position SQL sinks ---------------------
  # `sql_identifier`: the tainted value *is* a column/table identifier
  # (e.g. `ORDER BY $sort`), not a literal value. `sql_join_alias`: it is a
  # JOIN alias — a connector position, typically substituted more than once
  # in one statement (alias declaration + ON clause). Both families require
  # two concerns: the classic `sql_syntax_break` AND
  # `sql_identifier_substitution`, the concern that distinguishes this shape
  # — an attacker who can only supply legal identifier characters still
  # chooses which column/table the query reads.
  - op: raw_concat
    sink_family: sql_identifier
    effect: no_effect
  - op: raw_concat
    sink_family: sql_join_alias
    effect: no_effect

  # Parameterization does NOT help at an identifier position: no SQL dialect
  # lets a bound placeholder stand in for a column/table/alias name, so a
  # prepared statement still concatenates the identifier. This is the single
  # most important row of this group — the shape's whole point is that the
  # textbook fix is inapplicable, not merely omitted.
  - op: param_bind
    sink_family: sql_identifier
    effect: no_effect
  - op: param_bind
    sink_family: sql_join_alias
    effect: no_effect

  # A bare-identifier *character* allowlist (`^[A-Za-z0-9_]+$`): blocks the
  # quotes/spaces/parens/comments a syntax-break payload needs, but leaves
  # the real defect untouched — any identifier-shaped string still reaches
  # the query, so `secret` can be swapped in for `name`. Credited `partial`
  # (still VULNERABLE, just harder — D20), not `neutralises`, deliberately:
  # (a) the defining concern `sql_identifier_substitution` is not addressed
  # at all, and (b) at a connector position the same filtered value can be
  # substituted into several places in one statement, so even the syntax
  # story is not fully closed. This is the exact shape a real sqlmap 1.8.4
  # spot-check could not detect — see
  # fuzzlab/labgen/identifier_sqli_oracle.py's docstring, finding #3.
  - op: identifier_charset_filter
    sink_family: sql_identifier
    effect: partial
    neutralizes: [sql_syntax_break]
  - op: identifier_charset_filter
    sink_family: sql_join_alias
    effect: partial
    neutralizes: [sql_syntax_break]

  # A real allowlist of *known identifiers* (membership in a fixed list of
  # actual column/table/alias names, with a safe default) is the only
  # transform that closes this shape: the query's structure can no longer be
  # chosen by input, and no attacker-supplied character reaches the SQL text.
  - op: identifier_allowlist
    sink_family: sql_identifier
    effect: neutralises
    neutralizes: [sql_identifier_substitution, sql_syntax_break]
  - op: identifier_allowlist
    sink_family: sql_join_alias
    effect: neutralises
    neutralizes: [sql_identifier_substitution, sql_syntax_break]

  # --- escaping-context-mismatch XSS sinks -------------------------------
  # `url_javascript_scheme`: the tainted value is placed inside a
  # `javascript:` URL (`<a href="javascript:VALUE">`), i.e. an HTML
  # attribute whose content is *JavaScript source*. The family's required
  # concern is `js_context_break`, not `html_tag_break`: the value sits
  # inside a quoted attribute, so tag breakout is not what makes this shape
  # interesting — reaching a script context is.
  - op: raw_concat
    sink_family: url_javascript_scheme
    effect: no_effect

  # The escaping-context mismatch itself: htmlspecialchars() is *correct
  # escaping for the wrong context*. It escapes `<`, `>`, `&` and (ENT_QUOTES
  # by default since PHP 8.1) quotes, which does block the subset of
  # JavaScript payloads that need a quote to break out of a string literal —
  # hence `partial`, which keeps the cell VULNERABLE and raises its
  # difficulty tier (D20) — but a payload like `alert(1)` or
  # `fetch('/x')` needs none of those characters, because the entire
  # attribute value after `javascript:` is already executable.
  - op: html_entity_escape
    sink_family: url_javascript_scheme
    effect: partial
    neutralizes: [js_context_break]

  # The right fix for this context: allowlist the URL *scheme* (http/https
  # only, anything else replaced with an inert `#`), so no attacker-supplied
  # value can select a script-executing scheme in the first place.
  - op: url_scheme_allowlist
    sink_family: url_javascript_scheme
    effect: neutralises
    neutralizes: [js_context_break]

  # The second escaping-context-mismatch shape's secure twin. The
  # (html_entity_escape, html_attribute_unquoted) `partial` row above
  # already encodes the mismatch itself; until now the family had no
  # transform that closed it, so no SECURE twin for it was expressible. A
  # strict value allowlist (`^[A-Za-z0-9_-]+$`, safe default otherwise) is
  # the transform-only fix that does — it admits no whitespace, backtick or
  # `<`, the characters that break an unquoted attribute boundary.
  - op: attr_value_allowlist
    sink_family: html_attribute_unquoted
    effect: neutralises
    neutralizes: [html_tag_break]

  # --- L-P3.3c-G6: search.php's quoted-attribute reflection ---------------
  # The `html_attribute_quoted` family has existed since Phase 0, but only
  # ever paired with `html_entity_escape` (the `neutralises` row above): there
  # was no row for the *unescaped* baseline at this family, so the no-op end
  # of the family -- which is exactly what puppy-fort-factory/search.php does
  # in `value="<?= $q ?>"` -- could not be scored at all. Adding it makes the
  # family symmetric with every other one in this file, each of which carries
  # both a `raw_concat` baseline and at least one transform row.
  #
  # Brand-new (op, sink_family) pair, so per this file's own append-only rule
  # this is an addition under the SAME `version: 1`, exactly as L-P1.2b's 15
  # rows were: no existing pair's meaning changes, no existing cell's verdict
  # moves, and a corpus generated under v1 before this landed re-derives
  # identically.
  #
  # `no_effect`, and the required concern stays `html_tag_break`: a quoted
  # attribute's boundary is the quote character, and an unescaped value
  # carries its own `"` -- so the value can close the attribute, open a new
  # one (`" onmouseover=alert(1) x="`) or close the tag outright. That is the
  # same concern the `html_body` baseline names, reached through a different
  # structural position; it is *not* a weaker variant of the unquoted family's
  # `partial` mismatch row, because here nothing has been escaped at all.
  - op: raw_concat
    sink_family: html_attribute_quoted
    effect: no_effect

  # --- CC-LAB-0063: applying corpus-collected suggested_op/suggested_sink_
  # family proposals to the matrix (site-architecture expansion plan, Step 8
  # handoff) ------------------------------------------------------------
  # All entries below are brand-new (op, sink_family) pairs (new sink
  # families throughout), so per this file's own append-only rule they are
  # additions under the SAME `version: 1`: no existing pair's meaning
  # changes, no existing cell's verdict moves, and a corpus generated under
  # v1 before these landed re-derives identically. Each group cites the
  # `docs/research/corpus-examples/<cell>/` manifests whose
  # `suggested_op`/`suggested_sink_family` fields it accepts (verbatim,
  # unrenamed/unmerged — see that plan's Step 8 handoff note on
  # `template_render` vs `template_render_pipeline` staying two distinct,
  # unmerged families below despite the conceptual overlap, since merging
  # them is a design decision for a later change, not this one).

  # --- access-control: IDOR / broken object-level authorization ----------
  # From docs/research/corpus-examples/access-control/{node,php,python}/.
  # Two sink families: `db_row_by_id_lookup` (a direct primary-key fetch)
  # and `keyed_resource_lookup` (a fetch/action keyed by some other
  # attacker-visible identifier, e.g. a board/room key). Both require
  # `ownership_check_bypass`.
  - op: no_ownership_check
    sink_family: db_row_by_id_lookup
    effect: no_effect
  - op: no_ownership_check
    sink_family: keyed_resource_lookup
    effect: no_effect
  - op: identity_match_before_fetch
    sink_family: db_row_by_id_lookup
    effect: neutralises
    neutralizes: [ownership_check_bypass]
  - op: ownership_check_after_fetch
    sink_family: db_row_by_id_lookup
    effect: neutralises
    neutralizes: [ownership_check_bypass]
  - op: ownership_query_filter
    sink_family: db_row_by_id_lookup
    effect: neutralises
    neutralizes: [ownership_check_bypass]
  - op: membership_check_helper
    sink_family: keyed_resource_lookup
    effect: neutralises
    neutralizes: [ownership_check_bypass]

  # --- auth-session: JWT algorithm confusion, weak token entropy, stale
  # authorization state -----------------------------------------------------
  # From docs/research/corpus-examples/auth-session/{node,php,python}/.
  - op: jwt_alg_none_default
    sink_family: jwt_signature_verification
    effect: no_effect
  - op: jwt_none_alg_opt_in
    sink_family: jwt_signature_verification
    effect: neutralises
    neutralizes: [jwt_algorithm_confusion]
  - op: jwt_alg_unchecked
    sink_family: jwt_signature_verification
    effect: no_effect
  - op: jwt_alg_allowlist
    sink_family: jwt_signature_verification
    effect: neutralises
    neutralizes: [jwt_algorithm_confusion]
  - op: weak_prng_token
    sink_family: session_token_generation
    effect: no_effect
  - op: predictable_token_source
    sink_family: session_token_generation
    effect: no_effect
  - op: csprng_token
    sink_family: session_token_generation
    effect: neutralises
    neutralizes: [weak_token_entropy]
  - op: login_time_only_check
    sink_family: session_authorization_state
    effect: no_effect
  - op: per_request_status_revalidation
    sink_family: session_authorization_state
    effect: neutralises
    neutralizes: [stale_authorization_state]

  # --- ecommerce-logic: client-trusted price, TOCTOU redemption/counter --
  # From docs/research/corpus-examples/ecommerce-logic/{node,php,python}/.
  - op: client_trusted_amount
    sink_family: payment_charge_amount
    effect: no_effect
  - op: trust_client_price_input
    sink_family: payment_charge_amount
    effect: no_effect
  - op: server_recomputed_amount
    sink_family: payment_charge_amount
    effect: neutralises
    neutralizes: [price_integrity_bypass]
  - op: hook_delegated_recompute
    sink_family: payment_charge_amount
    effect: neutralises
    neutralizes: [price_integrity_bypass]
  - op: unlocked_check_then_act
    sink_family: single_use_resource_redemption
    effect: no_effect
  - op: unlocked_check_then_act
    sink_family: db_counter_increment
    effect: no_effect

  # --- file-handling: unrestricted upload, path traversal -----------------
  # From docs/research/corpus-examples/file-handling/{node,php,python}/.
  # `mime_type_check` and `filename_charset_sanitize` are `partial` (D20):
  # both narrow the attack surface but neither actually inspects file
  # *content* (magic bytes) nor allowlists the *extension*, so each still
  # leaves a spoofable gap `extension_allowlist_mime_check` closes fully.
  # Likewise `path_prefix_check`: a string-prefix comparison on an
  # unresolved path is a well-documented partial defense (symlink /
  # non-separator-bounded-prefix bypasses) that `realpath_confine`
  # (resolve first, then confine) closes fully.
  - op: no_extension_check
    sink_family: fs_web_root_write
    effect: no_effect
  - op: mime_type_check
    sink_family: fs_web_root_write
    effect: partial
    neutralizes: [unrestricted_file_upload]
  - op: filename_charset_sanitize
    sink_family: fs_web_root_write
    effect: partial
    neutralizes: [unrestricted_file_upload]
  - op: extension_allowlist_mime_check
    sink_family: fs_web_root_write
    effect: neutralises
    neutralizes: [unrestricted_file_upload]
  - op: unconfined_path
    sink_family: fs_path_read
    effect: no_effect
  - op: path_prefix_check
    sink_family: fs_path_read
    effect: partial
    neutralizes: [path_traversal]
  - op: realpath_confine
    sink_family: fs_path_read
    effect: neutralises
    neutralizes: [path_traversal]

  # --- search-export: ORDER BY injection, SSTI, XXE, weaker SQL escaping --
  # From docs/research/corpus-examples/search-export/{node,php,python}/.
  # `driver_escape_string` (manual driver-level escaping, e.g.
  # `mysqli_real_escape_string`) is `partial`, not `neutralises`, at the
  # same `sql_string_literal` family `param_bind` already fully closes —
  # matching this file's existing preference for parameterization as the
  # only fully-neutralising SQL-string-literal transform (manual escaping
  # misses non-string contexts and has documented multi-byte-encoding edge
  # cases). `orm_raw_escape_hatch` and `template_compile_user_content` are
  # each a lone vulnerable-side (`no_effect`) row: the corpus's idiomatic
  # twins for those two shapes route around the sink entirely (parameterize
  # or avoid it) rather than proposing a same-family secure transform, so
  # neither family has a `neutralises` row yet — the same "vulnerable-only
  # coverage, secure twin later" situation L-P3.3c-G6 and L-P1.2b's own
  # additions started from.
  - op: orm_order_by_unvalidated
    sink_family: sql_order_by_clause
    effect: no_effect
  - op: identifier_allowlist
    sink_family: sql_order_by_clause
    effect: neutralises
    neutralizes: [sql_order_by_injection, sql_identifier_substitution]
  - op: driver_escape_string
    sink_family: sql_string_literal
    effect: partial
    neutralizes: [sql_syntax_break]
  - op: orm_raw_escape_hatch
    sink_family: sql_where_clause_fragment
    effect: no_effect
  - op: template_compile_user_content
    sink_family: template_render_pipeline
    effect: no_effect
  - op: xml_external_entities_enabled
    sink_family: xml_parse_input
    effect: no_effect

  # --- ugc-xss: sanitizer/autoescape alternatives at the existing
  # `html_body` family — new ops, no new sink family. From
  # docs/research/corpus-examples/ugc-xss/{node,php,python}/.
  - op: dompurify_sanitize
    sink_family: html_body
    effect: neutralises
    neutralizes: [html_tag_break]
  - op: wp_kses_post
    sink_family: html_body
    effect: neutralises
    neutralizes: [html_tag_break]
  - op: bleach_clean
    sink_family: html_body
    effect: neutralises
    neutralizes: [html_tag_break]
  - op: default_autoescape
    sink_family: html_body
    effect: neutralises
    neutralizes: [html_tag_break]

  # --- mass-assignment: unfiltered bulk ORM/entity writes ------------------
  # From docs/research/corpus-examples/mass-assignment/node/. Every
  # `neutralises` row here is a distinct allowlisting mechanism (typed
  # schema, runtime field list, ORM `fields` option, hand-rolled mapping,
  # typed GraphQL input) collected as independent architectures in the
  # corpus; every `no_effect` row is that architecture's own unfiltered
  # counterpart.
  - op: unfiltered_object_assign
    sink_family: orm_entity_bulk_assign
    effect: no_effect
  - op: typed_schema_allowlist
    sink_family: orm_entity_bulk_assign
    effect: neutralises
    neutralizes: [mass_assignment]
  - op: unfiltered_body_update
    sink_family: orm_entity_bulk_assign
    effect: no_effect
  - op: runtime_field_allowlist
    sink_family: orm_entity_bulk_assign
    effect: neutralises
    neutralizes: [mass_assignment]
  - op: orm_update_no_fields_option
    sink_family: orm_entity_bulk_assign
    effect: no_effect
  - op: orm_fields_option_allowlist
    sink_family: orm_entity_bulk_assign
    effect: neutralises
    neutralizes: [mass_assignment]
  - op: unfiltered_object_spread
    sink_family: orm_entity_bulk_assign
    effect: no_effect
  - op: explicit_field_mapping
    sink_family: orm_entity_bulk_assign
    effect: neutralises
    neutralizes: [mass_assignment]
  - op: generic_scalar_input_assign
    sink_family: orm_entity_bulk_assign
    effect: no_effect
  - op: typed_graphql_field_mapping
    sink_family: orm_entity_bulk_assign
    effect: neutralises
    neutralizes: [mass_assignment]

  # --- ssrf: server-side fetch with attacker-influenced target ------------
  # From docs/research/corpus-examples/ssrf/{node,php,python}/.
  # `hostname_allowlist` is `partial`: checking the *hostname string*
  # against an allowlist before the fetch, with no check of the IP the
  # allowlisted host actually resolves to at fetch time, is the well-
  # documented DNS-rebinding gap `scheme_and_resolved_ip_allowlist` (which
  # checks the resolved IP itself, not just the hostname) closes fully.
  - op: unchecked_url_fetch
    sink_family: server_side_http_fetch
    effect: no_effect
  - op: hostname_allowlist
    sink_family: server_side_http_fetch
    effect: partial
    neutralizes: [ssrf_request_forgery]
  - op: scheme_and_resolved_ip_allowlist
    sink_family: server_side_http_fetch
    effect: neutralises
    neutralizes: [ssrf_request_forgery]

