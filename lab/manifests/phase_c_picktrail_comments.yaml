# Phase C, PicTrail's second real page (category 2 pilot, `CC-LAB-0093`).
#
# The researched, Django-specific mark_safe()/template-autoescape footgun
# deliberately deferred from Phase B (CC-LAB-0091), per
# docs/research/category2-social-ugc-functionality-and-cwe-research.md §4
# row 2 -- a deliberately simplified, generic mark_safe()-on-raw-value
# shape (not the full @mention/#hashtag auto-linking shape that row
# researched; see this app's own change-control entry for the reasoning).
