# Extends, not replaces, lab/manifests/phase_c_picktrail_post_detail.yaml.
# The canonical vulnerable cell (LABGEN-DJ-0009) owns PicTrail's real
# `/post/comments` URL and is the one described by
# lab/ground-truth-picktrail-django/'s own labels.json (case PT-0002).
manifest_version: 1
