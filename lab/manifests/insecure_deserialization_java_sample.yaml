# Insecure-deserialization sample manifest (CC-LAB-0091), java_spring_boot.
#
# First illustrative pair for this stack's Phase A build (category 4 pilot,
# Media/streaming, Netflix pick -- docs/LAB_MULTI_CATEGORY_SECOND_TARGETS_PLAN.md
# §9.4/§9.5). Grounded in the Netflix functionality/CWE research
# (docs/research/site-architecture-survey-functionality-netflix.md): a
# playback-resume-shaped endpoint that Jackson-deserializes its request
# body either polymorphically (vulnerable) or into a single fixed DTO
# class (secure).
#
# Reuses `lab/safety_matrix.yaml`'s existing `object_deserialization` sink
# family (added by CC-LAB-0063) but adds two new ops to it --
# `jackson_default_typing_deserialize`/`jackson_typed_allowlist_deserialize`
# -- since none of that family's existing node/php/python ops names the
# Jackson-polymorphic-typing idiom this pick is specifically about.
manifest_version: 1
safety_matrix_version: 1
cells:
  # Vulnerable: Jackson's activateDefaultTyping() deserializes the body
  # into a polymorphic Object -- the concrete runtime type is resolved
  # from an attacker-controlled type hint in the JSON itself (CWE-502).
  - cell_id: LABGEN-JV-0001
    class: insecure_deserialization
    stack_profile: java_spring_boot
    route: { method: POST, path: /api/playback/resume }
    sink_context:
      family: object_deserialization
      required_neutralizations: [insecure_deserialization]
    transform: [jackson_default_typing_deserialize]

  # Secure twin: the only difference is the transform region
  # (jackson_typed_allowlist_deserialize instead of
  # jackson_default_typing_deserialize) -- the minimal-pair invariant.
  # Deserializes into a single, fixed, concrete DTO class -- no
  # polymorphism, so the attacker cannot redirect the runtime type.
  - cell_id: LABGEN-JV-0002
    class: insecure_deserialization
    stack_profile: java_spring_boot
    route: { method: POST, path: /api/playback/resume }
    sink_context:
      family: object_deserialization
      required_neutralizations: [insecure_deserialization]
    transform: [jackson_typed_allowlist_deserialize]
