# Booking.com-themed price-integrity/business-logic sample manifest
# (CC-LAB-0212/FR-LAB-100), php_laravel -- category 5 (Travel/booking/
# marketplaces) pilot, docs/LAB_MULTI_CATEGORY_SECOND_TARGETS_PLAN.md §9.4
# row 5, third increment (first: booking_open_redirect_sample.yaml; second:
# booking_csv_export_sample.yaml).
#
# The vulnerable/secure twin pair for the `price_integrity_bypass` shape,
# reusing lab/safety_matrix.yaml's already-existing concern/sink family
