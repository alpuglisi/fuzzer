# Phase C content, per docs/LAB_MULTI_CATEGORY_SECOND_TARGETS_PLAN.md §4/§9
# and docs/research/category2-social-ugc-functionality-and-cwe-research.md
# §6's page-set design. This manifest's canonical vulnerable cell
