# XXE sample manifest (`CC-LAB-0131`/`FR-LAB-75`), `spring_boot`.
#
# TrackerNest's (category 3, Atlassian pick) second cell -- see
# docs/research/category3-saas-functionality-and-cwe-research.md sec 6b for
# the page/vulnerability-class design and sec 4 for the CWE research (real
# Java `javax.xml.parsers.DocumentBuilderFactory` default-permissive
# external-entity/DOCTYPE resolution, CWE-611). The request body is a fixed
# `<issue><title>...</title></issue>` document both twins parse the same
# way; the vulnerable twin (`xml_external_entities_enabled`) resolves a
# DOCTYPE-declared external entity referenced from inside `<title>` into
# the echoed response, the secure twin (`xml_external_entities_disabled`,
# `CC-LAB-0131`'s new `lab/safety_matrix.yaml` entry) rejects any document
# containing a DOCTYPE outright. Same route, never live-booted together --
# see `mass_assignment_laravel_sample.yaml`'s own twin-pair precedent.
manifest_version: 1
safety_matrix_version: 1
cells:
  - cell_id: LABGEN-XXE-0001
    class: xxe
    stack_profile: spring_boot
    route: { method: POST, path: /issues/import }
    sink_context:
      family: xml_parse_input
      required_neutralizations: [xxe_entity_resolution]
    transform: [xml_external_entities_enabled]

  - cell_id: LABGEN-XXE-0002
    class: xxe
    stack_profile: spring_boot
    route: { method: POST, path: /issues/import }
    sink_context:
      family: xml_parse_input
      required_neutralizations: [xxe_entity_resolution]
    transform: [xml_external_entities_disabled]
