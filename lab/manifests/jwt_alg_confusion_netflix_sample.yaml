# JWT `alg:none` signature-confusion sample manifest (CC-LAB-0193),
# spring_boot.
#
# Netflix's 8th real page (category 4, Media/streaming -- category 4's own
# "coherent page/route set" depth work, and this session's own
# cross-stack-generalization campaign: giving Netflix a mechanism Twitch's
# go_net_http pick already has, CC-LAB-0180): an account-level viewing-
# preferences lookup, `GET /api/account/preferences` (maturity rating,
# autoplay, subtitle language), gated by a Bearer JWT in the Authorization
# header -- a realistic API-edge auth shape distinct from every one of
# this app's other 7 real pages, none of which use header-carried auth.
#
# Reuses lab/safety_matrix.yaml's existing jwt_signature_verification sink
# family and its existing jwt_alg_none_default/jwt_none_alg_opt_in ops
# verbatim (added by CC-LAB-0063 for the corpus-examples/auth-session
# research; already instantiated on go_net_http, CC-LAB-0180) -- no new
# safety-matrix entry needed; this is spring_boot's first instance of this
# mechanism.
#
# Module composition mirrors CC-LAB-0180's own Go design, ported
# idiomatically to Java: a hand-rolled JWT parser/verifier using only JDK
# standard-library primitives (java.util.Base64, javax.crypto.Mac,
# java.security.MessageDigest -- no third-party JWT dependency), modeling
# the real auth0/node-jsonwebtoken vulnerability (GHSA-8cf7-32gw-wr33,
# already cited in docs/research/corpus-examples/auth-session/node/
# vulnerable-1.js): the vulnerable twin (jwt_alg_none_default) honors an
# attacker-chosen alg:none header, skipping signature verification
# entirely; the secure twin (jwt_none_alg_opt_in) requires the token's own
# header to explicitly claim the one pinned algorithm (HS256) *and* a
# valid HMAC before any claims are trusted. Unlike go_net_http's
# source+transform split, this stack's shape has no separate transform
# stage (see fuzzlab/labgen/emitters/spring_boot/modules.py's own
# docstring): the source (ReadAuthorizationBearerTokenSource) computes the
# three boolean ingredients (algIsNone/algIsHs256/hmacValid) and each op's
# own sink module reads them directly to decide its own condition.
#
# Response-shape note, the same "fixed demo field name as declared
# simplification" convention CC-LAB-0182/CC-LAB-0192's own mass_assignment
# ground truth already established: both twins echo the decoded token's
# own channel_id/role claims verbatim (alongside fixed Netflix-flavored
# preference fields) -- the exact field names
# JwtAlgNoneConfusionStrategy's own confirm() (fuzzlab/oracle/
# strategies.py, built for Twitch's go_net_http cell) already forges into
# its probe payloads, letting that existing strategy generalize across
# stacks with zero new code (verified live in
# tests/test_labgen_spring_boot_netflix_jwt_preferences_live_boot.py).
manifest_version: 1
safety_matrix_version: 1
cells:
  # Vulnerable: an attacker-chosen `alg: none` header is honored -- the
  # signature check is skipped entirely, so an unsigned token with
  # forged claims (e.g. channel_id/role) is accepted (CWE-347).
  - cell_id: LABGEN-JV-0015
    class: jwt_algorithm_confusion
    stack_profile: spring_boot
    route: { method: GET, path: /api/account/preferences }
    sink_context:
      family: jwt_signature_verification
      required_neutralizations: [jwt_algorithm_confusion]
    transform: [jwt_alg_none_default]

  # Secure twin: only the difference is which sink module renders
  # (jwt_none_alg_opt_in instead of jwt_alg_none_default) -- the minimal-
  # pair invariant. Requires the token's own header to explicitly claim
  # the one pinned, allowed algorithm (HS256) *and* a valid HMAC before
  # any claims are trusted; an alg:none token is rejected outright with a
  # real HTTP 401.
  - cell_id: LABGEN-JV-0016
    class: jwt_algorithm_confusion
    stack_profile: spring_boot
    route: { method: GET, path: /api/account/preferences }
    sink_context:
      family: jwt_signature_verification
      required_neutralizations: [jwt_algorithm_confusion]
    transform: [jwt_none_alg_opt_in]
