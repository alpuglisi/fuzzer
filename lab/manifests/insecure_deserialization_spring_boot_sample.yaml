# Insecure-deserialization sample manifest (`CC-LAB-0132`/`FR-LAB-80`),
# `spring_boot`.
#
# TrackerNest's (category 3, Atlassian pick) third and final designed cell
# -- see docs/research/category3-saas-functionality-and-cwe-research.md
# sec 6b for the page/vulnerability-class design and sec 4 for the CWE
# research (real Java `ObjectInputStream` unrestricted-type-construction
# footgun, CWE-502). Both twins reuse EXISTING `lab/safety_matrix.yaml`
# ops for the `object_deserialization` family (no new safety-matrix entry
# needed, unlike CC-LAB-0131's XXE cell): the vulnerable twin
# (`function_executing_deserialize`) constructs whatever `Serializable`
# class a request's serialized bytes name; the secure twin
# (`handler_registry_lookup`) allowlists exactly one expected class name
# (`com.fuzzlab.trackernest.generated.WebhookEvent`) via a
# `resolveClass()` override, rejecting everything else. Same route, never
# live-booted together -- see `mass_assignment_laravel_sample.yaml`'s own
# twin-pair precedent.
manifest_version: 1
safety_matrix_version: 1
cells:
  - cell_id: LABGEN-DESER-0001
    class: insecure_deserialization
    stack_profile: spring_boot
    route: { method: POST, path: /integrations/webhook-payload }
    sink_context:
      family: object_deserialization
      required_neutralizations: [insecure_deserialization]
    transform: [function_executing_deserialize]

  - cell_id: LABGEN-DESER-0002
    class: insecure_deserialization
    stack_profile: spring_boot
    route: { method: POST, path: /integrations/webhook-payload }
    sink_context:
      family: object_deserialization
      required_neutralizations: [insecure_deserialization]
    transform: [handler_registry_lookup]

  # --- Ported from java_spring_boot (CC-LAB-0171, category 4 pilot's
  # Netflix pick) as part of the §9.2a Java/Spring Boot consolidation
  # (CC-LAB-0173) -- java_spring_boot is retired, this is now the only
  # home for this cell. Cell-ID prefix kept as LABGEN-JV- (distinct from
  # this manifest's own LABGEN-DESER- cells) so provenance stays
  # distinguishable at the manifest/ground-truth level even though the
  # compiled class shares this app's Java package -- see CC-LAB-0173's
  # own "cell/page identity" note: this does NOT make the cell a
  # TrackerNest page, it only relocates which skeleton compiles/boots it.
  #
  # Same (vuln_class, sink_context.family) shape as LABGEN-DESER-0001/2
  # above via a genuinely different mechanism: Jackson polymorphic-typing
  # deserialization (CWE-502), not raw ObjectInputStream. Vulnerable twin
  # (jackson_default_typing_deserialize) deserializes into a polymorphic
  # Object -- the concrete runtime type is resolved from an
  # attacker-controlled type hint embedded in the JSON body itself. Secure
  # twin (jackson_typed_allowlist_deserialize) deserializes into a single,
  # fixed, concrete DTO class (PlaybackResumeRequest) -- no polymorphism.
  - cell_id: LABGEN-JV-0001
    class: insecure_deserialization
    stack_profile: spring_boot
    route: { method: POST, path: /api/playback/resume }
    sink_context:
      family: object_deserialization
      required_neutralizations: [insecure_deserialization]
    transform: [jackson_default_typing_deserialize]

  - cell_id: LABGEN-JV-0002
    class: insecure_deserialization
    stack_profile: spring_boot
    route: { method: POST, path: /api/playback/resume }
    sink_context:
      family: object_deserialization
      required_neutralizations: [insecure_deserialization]
    transform: [jackson_typed_allowlist_deserialize]
