# Phase 2 corpus cell: file-handling / python
# Sub-shapes collected (per assignment):
#   (a) upload handler: no/weak extension check (werkzeug-style, no allowlist
#       actually enforced) vs. allowlist+content-type check (secure_filename)
#   (b) download/serve endpoint: unconfined path-from-user-input vs.
#       validated/confined path
#
# Pairing status: both sub-shapes are fully paired (vulnerable + idiomatic
# each) -- not half-populated.

- file: vulnerable-1.py
  role: vulnerable
  repo: kaushikjadhav01/COVID-19-Detection-Flask-App-based-on-Chest-X-rays-and-CT-Scans
  commit_sha: 4487c14493d943709b5e660c98cad5b659c68faf
  license: MIT
  license_copyright: "Copyright (c) 2023 Kaushik Jadhav"
  pattern: "weak/no extension check: an ALLOWED_EXTENSIONS allowlist is defined at module scope but never referenced/enforced by this route, and werkzeug's secure_filename() call is present in the source but commented out -- any uploaded file is accepted and written to disk"
  notes: "`/uploaded_chest` route in a real Flask ML-inference demo app. Chosen over a from-scratch example specifically because the dead ALLOWED_EXTENSIONS/commented-out secure_filename() shows the real-world failure mode of a validation control that exists in the codebase but was bypassed/disabled, not just omitted outright."
  validated: false
  validated_by: []
  redacted: false
  # --- migrated to cwe_shared/cwe_unique per PA-0033's tightened standard.
  # NOTE: researched from trained knowledge, not a live MITRE lookup --
  # cwe.mitre.org is blocked by this environment's egress proxy (already
  # logged in ERROR_LOG.md's 2026-09-22 entry). ---
  cwe_shared: [CWE-434]
  cwe_unique: [CWE-1164, CWE-561]
  cwe_rationale: >
    Shared (this cell's own upload-sub-shape class, see idiomatic-1.py
    below and both file-handling/node/php upload entries elsewhere in
    this corpus): CWE-434 (Unrestricted Upload of File with Dangerous
    Type).
    Unique to this entry, researched against the MITRE CWE index: CWE-1164
    (Irrelevant Code) -- the commented-out `secure_filename()` call left
    in place, per this entry's own pattern field, is exactly this
    weakness: code that reads as if a security control is present but no
    longer executes, misleading a reviewer; CWE-561 (Dead Code) -- the
    module-scope `ALLOWED_EXTENSIONS` allowlist is defined but never
    referenced by this route at all, a distinct defect from the disabled
    secure_filename() call (unused-but-present validation data vs.
    disabled-but-present validation logic).
  suggested_op: no_extension_check
  suggested_sink_family: fs_web_root_write

- file: idiomatic-1.py
  role: idiomatic
  repo: xuchengli/ai-answerer
  commit_sha: d328d12ab198c1b52d681361ca93c9311e3208c4
  license: MIT
  license_copyright: "Copyright (c) 2024 lixucheng"
  pattern: "allowlist via werkzeug secure_filename() applied to the uploaded filename before file.save(), paired with send_from_directory() (which itself confines the served path to UPLOAD_FOLDER) on the matching download route"
  notes: "excerpt of the `/upload` and `/uploads/<name>` routes from app.py (a Flask + LLM/TTS 'answer this homework photo' app). The source file's app.config block also hardcodes a demo Redis URL with an inline password (`redis://:passw0rd@localhost`) and third-party API key env-var names a few lines away from the routes copied here -- that block was deliberately excluded from the excerpt rather than redacted-in-place, since it is unrelated to the file-handling pattern being illustrated. gitleaks did not flag it (below its rule thresholds), but a manual read did; excluding it meant no redaction marker was needed in the copied file itself."
  validated: false
  validated_by: []
  redacted: false
  cwe_shared: [CWE-434]
  cwe_unique: [CWE-732, CWE-284]
  cwe_rationale: >
    Shared: see vulnerable-1.py's cwe_rationale above.
    Unique to this entry, researched against the MITRE CWE index: CWE-732
    (Incorrect Permission Assignment for Critical Resource) -- nothing in
    this excerpt shows the saved file's permissions being restricted
    (e.g. non-executable) after `file.save()`, relying entirely on the
    OS/webserver's own default umask; CWE-284 (Improper Access Control)
    -- neither the `/upload` nor the `/uploads/<name>` route shown here
    has any visible authentication/authorization dependency, so any
