# Phase 2 corpus cell: file-handling / python
# Sub-shapes collected (per assignment):
#   (a) upload handler: no/weak extension check (werkzeug-style, no allowlist
#       actually enforced) vs. allowlist+content-type check (secure_filename)
#   (b) download/serve endpoint: unconfined path-from-user-input vs.
#       validated/confined path
#
# Pairing status: both sub-shapes are fully paired (vulnerable + idiomatic
# each) -- not half-populated.

- file: vulnerable-1.py
  role: vulnerable
  repo: kaushikjadhav01/COVID-19-Detection-Flask-App-based-on-Chest-X-rays-and-CT-Scans
  commit_sha: 4487c14493d943709b5e660c98cad5b659c68faf
  license: MIT
  license_copyright: "Copyright (c) 2023 Kaushik Jadhav"
  pattern: "weak/no extension check: an ALLOWED_EXTENSIONS allowlist is defined at module scope but never referenced/enforced by this route, and werkzeug's secure_filename() call is present in the source but commented out -- any uploaded file is accepted and written to disk"
  notes: "`/uploaded_chest` route in a real Flask ML-inference demo app. Chosen over a from-scratch example specifically because the dead ALLOWED_EXTENSIONS/commented-out secure_filename() shows the real-world failure mode of a validation control that exists in the codebase but was bypassed/disabled, not just omitted outright."
  validated: false
  validated_by: []
  redacted: false
  cwe: [CWE-434]
  suggested_op: no_extension_check
  suggested_sink_family: fs_web_root_write

