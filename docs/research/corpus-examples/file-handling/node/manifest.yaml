# (AGPL-3.0-or-later) -- the real mimetype-allowlist check every video
# upload passes through. The vulnerable side is a manufactured simplified
# upload handler that skips it, trusting the client-declared filename/
# Content-Type outright. Commit pinned via `git ls-remote
# https://github.com/Chocobozzz/PeerTube.git HEAD` at collection time
# (2026-09-22).

- file: idiomatic-peertube-upload-1.ts
  role: idiomatic
  architecture: peertube-video-upload
  repo: Chocobozzz/PeerTube
  commit_sha: faa76bad2c1969a088ef1df38dc666dfe7259b5c
  license: AGPL-3.0-or-later
  tutorial_or_course_project: false
  pattern: "commonVideoFileChecks(): rejects the upload with 415 unless isVideoFileMimeTypeValid(files) passes (mimetype allowlist against CONSTRAINTS_FIELDS.VIDEOS.EXTNAME), before any size/quota check runs"
  notes: >
    Verbatim excerpt (single function only, per the AGPL-3.0 copyleft-
    handling rule). Source file path in the origin repo:
    server/core/middlewares/validators/videos/shared/video-validators.ts.
    **License note: AGPL-3.0-or-later (copyleft) -- do not let this
    snippet or its manufactured pair below quietly seed an emitter/module
    template without this flag surviving; Step 8 of the site-architecture
    plan already stops at the proposal stage for exactly this reason.**
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe: [CWE-434, CWE-646, CWE-20, CWE-669]
  cwe_rationale: >
    Researched against the MITRE CWE index for the missing-mimetype-check
    mechanism this pair contrasts, not recalled: CWE-434 (Unrestricted
    Upload of File with Dangerous Type) is the primary weakness class;
    CWE-646 (Reliance on File Name or Extension of Externally-Supplied
    File) applies because the vulnerable side (below) uses the client-
    declared `originalname`/mimetype as its sole basis for accepting and
    naming the file, exactly the anti-pattern CWE-646 names; CWE-20
    (Improper Input Validation) is CWE-434's own listed parent relationship;
    CWE-669 (Incorrect Resource Transfer Between Spheres) is CWE-434's own
    listed parent -- the general class covering a resource (the uploaded
    file) crossing from an untrusted sphere (the client) into a trusted one
    (the server's public media directory) without adequate checks. Note:
    the vulnerable side below additionally introduces CWE-22 (Path
    Traversal), listed only on that entry since it is a second, distinct
    mechanism (join() on an unsanitized filename) not present in this
    idiomatic side at all.
  suggested_op: mime_type_check   # same op already established for this
                             # cell's PHP entries (no_extension_check's
                             # paired mitigation) -- reused across languages
  suggested_sink_family: fs_web_root_write

