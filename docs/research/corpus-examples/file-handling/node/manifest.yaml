  # entry's own mimetype-allowlist implementation.
  cwe_shared: [CWE-434, CWE-20, CWE-22]
  cwe_unique: [CWE-436, CWE-1287]
  cwe_rationale: >
    Shared: CWE-434/CWE-20/CWE-22, see vulnerable-peertube-upload-1.ts's
    cwe_rationale above -- this entry closes the CWE-22 half that
    idiomatic-peertube-upload-1.ts's own cwe field does not carry.
    Unique to this entry: CWE-436 (Interpretation Conflict) -- the
    mimetype allowlist check trusts `file.mimetype`, a value multer
    populates from the client's declared Content-Type header rather than
    from inspecting the uploaded bytes themselves, so the check can pass
    a file whose actual byte content a downstream consumer (a video
    player, a transcoder) interprets differently than the declared type
    claims. CWE-1287 (Improper Validation of Specified Type of Input) --
    the mimetype allowlist and the derived stored filename are validated
    independently of each other; nothing cross-checks that the
    (sanitized) filename's own extension is consistent with the
    validated mimetype, so a mismatched pair passes both checks
    individually.
  suggested_op: mime_type_check
  suggested_sink_family: fs_web_root_write
  validation_caveat: >
    Dynamic validation was run against a hand-written harness (Node,
    executed both directly and inside the gVisor sandbox via
    `run_in_sandbox`) that stubs `CONFIG`/`moveFile` and feeds a
    traversal-shaped `file.originalname`, not against the real PeerTube
    application (which is out of scope to boot here) -- the harness
    proves the specific mechanism difference (destination path escapes
    the intended directory for the vulnerable file; stays confined for
    this file), which is what this pair exists to demonstrate.
