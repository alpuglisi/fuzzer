  cwe_shared: [CWE-434, CWE-20]
  cwe_unique: [CWE-340, CWE-158]
  cwe_rationale: >
    Shared: see vulnerable-1.js's cwe_rationale above.
    Unique to this entry: CWE-340 (Generation of Predictable Numbers or
    Identifiers) -- the storage filename callback derives the stored
