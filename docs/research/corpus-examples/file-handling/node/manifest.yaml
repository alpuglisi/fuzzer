- file: idiomatic-peertube-upload-1.ts
  role: idiomatic
  architecture: peertube-video-upload
  repo: Chocobozzz/PeerTube
  commit_sha: faa76bad2c1969a088ef1df38dc666dfe7259b5c
  license: AGPL-3.0-or-later
  tutorial_or_course_project: false
  pattern: "commonVideoFileChecks(): rejects the upload with 415 unless isVideoFileMimeTypeValid(files) passes (mimetype allowlist against CONSTRAINTS_FIELDS.VIDEOS.EXTNAME), before any size/quota check runs"
  notes: >
    Verbatim excerpt (single function only, per the AGPL-3.0 copyleft-
    handling rule). Source file path in the origin repo:
    server/core/middlewares/validators/videos/shared/video-validators.ts.
    **License note: AGPL-3.0-or-later (copyleft) -- do not let this
    snippet or its manufactured pair below quietly seed an emitter/module
    template without this flag surviving; Step 8 of the site-architecture
    plan already stops at the proposal stage for exactly this reason.**
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe_shared: [CWE-434, CWE-20]
  cwe_unique: [CWE-770, CWE-1284]
  cwe_rationale: >
    Shared: CWE-434 (Unrestricted Upload of File with Dangerous Type) is
    the primary weakness class; CWE-20 (Improper Input Validation) is its
    listed parent -- documented once for this pair, see
    vulnerable-peertube-upload-1.ts below.
    Unique to this entry, researched against the MITRE CWE index -- this
    real function does more than the type check: CWE-770 (Allocation of
    Resources Without Limits or Throttling) -- `checkUserQuota({
    channelUser, uploadSize, ... })` enforces a per-user resource quota,
