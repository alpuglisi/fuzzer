# Phase 2 corpus cell: file-handling / php
# Sub-shapes collected (per assignment):
#   (a) upload handler: no/weak extension check vs. allowlist+content-type check
#   (b) download/serve endpoint: unconfined path-from-user-input vs. validated/confined path
#
# Pairing status: both sub-shapes are fully paired (vulnerable + idiomatic
# each) -- not half-populated.

- file: vulnerable-1.php
  role: vulnerable
  repo: GreatDevelopers/Certificate
  commit_sha: 97171bb0e5e22e52eacf4e4fa81773e5f3cffb73
  license: MIT
  license_copyright: "Copyright (c) 2017 Great Developers"
  pattern: "unrestricted upload: uploaded 'photo' (a compressed images archive) is move_uploaded_file()'d with no extension or content-type check at all; the sibling .csv upload only does a weak strrchr()-based extension check on the original filename before moving it, then shells out (tar/unzip) on it"
  notes: "real certificate-generation web app (not a synthetic PoC); mirrors puppy-fort-factory's own unrestricted-upload shape (CWE-434). Full file copied (149 lines) -- kept whole since the vulnerable upload and the immediately-following unzip/shell_exec use of the uploaded file are one continuous flow."
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review confirms line 45: `move_uploaded_file($_FILES["photo"]
    ["tmp_name"], "$id/$file")` with no extension/MIME check at all
    beforehand, and lines 23-30's `.csv` sibling using only a weak
    `strrchr($csv,".")` string check -- matches the pattern exactly, and
    lines 53/57's `exec("tar -zxvf $file")`/`exec("unzip $file")` on the
    uploaded, attacker-named `$file` confirm the CWE-78 unique claim.
    `php -l` parses clean. Semgrep (local custom rule set; registry
    blocked -- semgrep.dev:443 CONNECT returns 403 via this environment's
    egress proxy) fires `php-move-uploaded-no-check`/
    `php-unrestricted-upload` on lines 31 and 45. No dynamic run: depends
    on a live `library/odf.php`/`$_SESSION`/`unoconv` binary and real
    filesystem side effects (mkdir/exec/tar/unzip) not appropriate to
    actually execute even sandboxed, since the point under test (missing
    upload validation) is already fully evidenced statically.
  redacted: false
  # --- migrated to cwe_shared/cwe_unique per PA-0033's tightened standard.
  # NOTE: researched from trained knowledge, not a live MITRE lookup --
  # cwe.mitre.org is blocked by this environment's egress proxy (already
  # logged in ERROR_LOG.md's 2026-09-22 entry). ---
  cwe_shared: [CWE-434]
  cwe_unique: [CWE-78, CWE-1289]
  cwe_rationale: >
    Shared (this cell's own upload-sub-shape class, see idiomatic-1.php
    below and both file-handling/node/python upload entries elsewhere in
    this corpus): CWE-434 (Unrestricted Upload of File with Dangerous
    Type).
    Unique to this entry, researched against the MITRE CWE index: CWE-78
    (OS Command Injection) -- per the pattern field, the sibling .csv
    upload "shells out (tar/unzip) on it" after only a weak
    strrchr()-based extension check, a second, independent mechanism
    beyond the upload-validation gap itself; CWE-1289 (Improper
    Validation of Unsafe Equivalence in Input) -- the strrchr()-based
    check inspects only the substring after the last dot with no
    case-normalization or canonicalization, so an equivalent-but-differently-
    cased or multi-extension filename (e.g. "shell.PHP" or "shell.pHp3")
    can be treated as inequivalent to the denylisted form the check
    actually looks for.
  suggested_op: no_extension_check
  suggested_sink_family: fs_web_root_write

- file: idiomatic-1.php
  role: idiomatic
  repo: WonderCMS/wondercms
  commit_sha: 7dae4c93f266c05ca6563a96e9f0168f2defe399
  license: MIT
  license_copyright: "Copyright (c) 2026 Robert Isoski and WonderCMS contributors"
  pattern: "allowlist + content-type check: extension checked against a fixed $allowedExtensions list AND the real MIME type (via finfo/mime_content_type) checked against a fixed $allowedMimeTypes list, both required before move_uploaded_file()"
  notes: "excerpt of WonderCMS::uploadFileAction() from the CMS's single-file index.php (3830 lines total) -- only the upload-validation method was copied, not the whole file, per Phase 2's 'not a bare copy of the whole thing when a fragment illustrates the shape' spirit. Filename is also defanged via basename()+str_replace() against traversal sequences before use."
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review confirms lines 124-141: extension checked against
    `$allowedExtensions`, real MIME type (finfo/mime_content_type)
    checked against `$allowedMimeTypes`, both required
    (`!in_array($mimeType, ...) || !in_array($ext, ...)`) before
    `move_uploaded_file()` -- matches the pattern exactly. `php -l` on
    the bare excerpt fails only because it's a method with no enclosing
    class (expected, per the file's own header note); wrapping it in a
    minimal harness class confirms it parses clean otherwise. Semgrep
    (local custom rule set on the wrapped harness; registry blocked, see
    vulnerable-1.php's entry) fires `php-mime-allowlist-check` on the
    `in_array($mimeType, ...)` line, confirming the real-MIME-check
