    `$this->redirect`/`$this->filesPath` framework context not present
    in this excerpt.
  redacted: false
  cwe_shared: [CWE-434]
  cwe_unique: [CWE-352, CWE-538]
  cwe_rationale: >
    Shared: see vulnerable-1.php's cwe_rationale above.
    Unique to this entry, researched against the MITRE CWE index: CWE-352
    (Cross-Site Request Forgery) -- uploadFileAction() is a state-changing
    POST action with nothing shown in this excerpt gating it with a CSRF
    token; CWE-538 (Insertion of Sensitive Information into Externally-
    Accessible File or Directory) -- the extension+MIME allowlist checks
    what is uploaded, but nothing in this excerpt confirms the
    destination directory itself sits outside the web-served document
    root, so a validated-but-still-accepted file type could still be
