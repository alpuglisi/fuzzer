  redacted: false
  cwe_shared: [CWE-918, CWE-20, CWE-441]
  cwe_unique: [CWE-400, CWE-284]
  cwe_rationale: >
    Shared: see idiomatic-safe-fetch-1.js above.
    Unique: CWE-400 (Uncontrolled Resource Consumption) -- no timeout or
    response-size limit is shown, unlike entry 1's wrapper; CWE-284
    (Improper Access Control) -- flagged at the general level since this
    endpoint effectively grants any authenticated user an open proxy into
    whatever network the server can reach.
  suggested_op: unchecked_url_fetch
  suggested_sink_family: server_side_http_fetch
