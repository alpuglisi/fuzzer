  redacted: false
  cwe: [CWE-502, CWE-20, CWE-758, CWE-807]
  cwe_shared: [CWE-502, CWE-20]
  cwe_unique: [CWE-758, CWE-807]
  cwe_rationale: >
    Shared: see idiomatic-laravel-encrypted-command-1.php above.
    Unique: CWE-758 (Reliance on Undefined, Unspecified, or
    Implementation-Defined Behavior) -- PHP's unserialize() has real,
    documented implementation-defined edge-case behavior on malformed
    input across versions, distinct from the object-injection risk itself;
    CWE-807 (Reliance on Untrusted Inputs in a Security Decision) -- the
    mere presence of a cache entry at this key is treated as sufficient
    grounds to deserialize it, with no independent trust signal.
  suggested_op: unrestricted_unserialize
  suggested_sink_family: object_deserialization
