    "Per-pair mechanics" (Phase 3, final batch, group 1 of 10). Same
    overall shape as idiomatic-job-cache-json-3.py/
    vulnerable-job-cache-pickle-3.py (a cache-backed payload parsed then
    type-checked) but a genuinely distinct sub-scenario (admin-authored
    config reload, not a background job payload) and a distinct
    deserialization library (PyYAML, not json/pickle), contrasting
    yaml.safe_load() against yaml.load(Loader=UnsafeLoader) rather than
    json.loads() against pickle.loads().
  validated: true
  validated_by: [python-syntax-check, gvisor-sandbox-dynamic, manual-review]
  redacted: false
  cwe_shared: [CWE-502, CWE-20]
  cwe_unique: [CWE-1287, CWE-841]
  cwe_rationale: >
    Shared (this cell's core class, see idiomatic-job-cache-json-3.py's
    own cwe_rationale above): CWE-502, CWE-20.
    Unique: CWE-1287 (Improper Validation of Specified Type of Input) --
    only `task_name`'s type is checked after parsing; nothing validates
