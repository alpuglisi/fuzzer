#   Multi-Stock-Logistics-Platform, Christian-39/chris-lux,
#   amgad165/Retro-store, Ricas2410/mablex, IlboudoOusmane/Vente-en-ligne,
#   GreeshmaAbeesh/Fashionfiesta) -- none of them carry a LICENSE file.
#   arvinmaroufi/MasaiShop was the only one found with a declared license.
# --- manufactured per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
# "Per-pair mechanics" (Phase 3, worst-gap group 2 of 5) ---

- file: idiomatic-2-altered.py
  role: idiomatic
  derived_from: vulnerable-2.py
  manufactured: true
  license: n/a (manufactured, derived from vulnerable-2.py's real structure per the plan's methodology; no additional upstream source copied)
  notes: >
    MANUFACTURED. Missing idiomatic counterpart for vulnerable-2.py's
    CWE-362/CWE-367 TOCTOU race (arvinmaroufi/MasaiShop's apply_coupon(),
    a non-atomic read-is_valid()-then-increment on
    Coupon.usage_count). This cell's manifest.yaml note above records
    that no license-clean real-world locked counterpart was found in the
    original collection pass; this file supplies exactly the mitigation
    that note names as absent. Minimal-pair discipline: same function
    name/messages/discount computation/control flow, differing ONLY in
    (1) select_for_update() locking the coupon row, (2) the whole
    check-then-act sequence wrapped in transaction.atomic(), and (3) the
    counter increment using F('usage_count') + 1 (an atomic
    database-level UPDATE) instead of a Python-side `+= 1; .save()`.
  pattern: "apply_coupon() locks the coupon row with Coupon.objects.select_for_update().get(...) inside a transaction.atomic() block before reading is_valid(), and increments usage_count via the atomic F('usage_count') + 1 expression -- closing the window where two concurrent requests could both pass is_valid() before either commits its increment."
  validated: true
  validated_by: [semgrep-custom-rule, py_compile, manual-review]
  redacted: false
  cwe_shared: [CWE-362, CWE-367]
  cwe_unique: [CWE-636, CWE-460]
  cwe_rationale: >
    CWE-636 (Not Failing Securely / 'Failing Open'): `select_for_update()`
    only takes a real row lock on a database backend that supports
    row-level locking; on a backend that doesn't (e.g. SQLite, common in
    dev/test), Django logs a warning and silently proceeds WITHOUT
    locking rather than raising an error -- so this fix's actual
    protection is contingent on production DB configuration, not
    guaranteed by the code alone. CWE-460 (Improper Cleanup on Thrown
    Exception): only `Coupon.DoesNotExist` is caught by this function's
    `except` clause; any other exception raised inside the
    `transaction.atomic()` block (e.g. a DB error during the F()
    update) propagates past the explicit error-handling this function
    does have, relying entirely on Django's implicit atomic-block
    rollback with no function-level cleanup/logging of its own.
  suggested_op: locked_check_then_act
  suggested_sink_family: db_counter_increment
  validation_caveat: >
    Dynamic (gVisor-sandbox) execution was NOT run for this pair: genuinely
    proving the race (and its fix) requires real concurrent requests
    against a live multi-connection database (Postgres/MySQL under
    Django's ORM, with select_for_update() actually taking a row lock
    across connections) -- SQLite's single-writer model and this
    sandbox's single-process, no-network execution model cannot exercise
    that. Validated at the static tier only (a custom semgrep
    differential rule confirms vulnerable-2.py's unguarded
    `coupon.usage_count += 1` triggers and this file's F()/
    select_for_update()/transaction.atomic() form does not) plus
    py_compile and manual review. Reported honestly per the plan's "N of
    M, never rounded up" instruction rather than skipped silently or
    faked.

