# - The exact "coupon.usage_count += 1; coupon.save()" non-atomic race
#   shape in vulnerable-2.py recurs almost verbatim across many other
#   Django e-commerce student/portfolio projects found during collection
#   (whizkidefos/trederwen-springs-platform, AnNguyen05092004/
#   Bookstore-management-system, AshishCherian15/
#   Multi-Stock-Logistics-Platform, Christian-39/chris-lux,
#   amgad165/Retro-store, Ricas2410/mablex, IlboudoOusmane/Vente-en-ligne,
#   GreeshmaAbeesh/Fashionfiesta) -- none of them carry a LICENSE file.
#   arvinmaroufi/MasaiShop was the only one found with a declared license.
# - A real, *locked* counterpart to this race (select_for_update() and/or
#   an F('usage_count') + 1 atomic update inside a transaction) was found
#   in CNRWhoAmI/meraycoshop (backend/apps/coupons/services.py),
#   gam98/valentina-ecommerce-backend (apps/orders/services.py), and
#   ln-khanhduy/elearning (backend/apps/promotions/services/
#   coupon_service.py) -- all unlicensed. Aniket-Dev-IT/CartMax
#   (store/coupon_utils.py) also has this locked shape but carries an
#   explicit proprietary "All Rights Reserved" LICENSE, which this
#   corpus's rules treat the same as no license for copying purposes.
#   None was usable; this leaves vulnerable-2.py's race without a locked
#   idiomatic counterpart in this pass.
