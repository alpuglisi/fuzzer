# Vuln-corpus Phase 2 manifest — feature: e-commerce (cart/checkout/
# payment/coupons, incl. billing/invoicing/subscriptions), language:
# Python. See docs/VULN_CORPUS_EXPANSION_PLAN.md Phase 2 for the
# schema/rules this file follows.
#
# Pairing note: this cell covers two distinct real-world business-logic
# shapes rather than one same-shape pair. vulnerable-1.py is a price-
# tampering example (CWE-840: client-supplied "amount" trusted at the
# Stripe charge step); vulnerable-2.py is a race-condition example
# (CWE-362/367/841: non-atomic check-then-act on a coupon's usage
# counter). idiomatic-1.py is the price/quantity-tampering shape's real,
# licensed counterpart (server-side recomputation of the charge amount).
# No comparably clear, acceptably-licensed *locked* counterpart to
# vulnerable-2.py's race (e.g. select_for_update() or F('usage_count')+1)
# was found in this pass -- several real candidates exist (see the
# "Skipped for no license" note below) but none carried a usable license;
# recorded here as a half-populated sub-cell rather than padded with a
# weak substitute, per Phase 2's guidance for this feature class.

- file: vulnerable-1.py
  role: vulnerable
  repo: BloomTech-Labs/CS10-labor-pos
  commit_sha: f7365a08c13101d58839eea45cd54da06edc0908
  license: MIT
  license_copyright_line: "Copyright (c) 2018 Lambda Labs"
  tutorial_or_course_project: true
  pattern: "Django checkout() view builds the Stripe charge directly from request.POST.get('amount', ...) and request.POST.get('currency', ...), with no server-side price/amount recomputation from an order or cart record (CWE-840 business-logic price tampering)"
  notes: >
    "CS10-labor-pos" is a Lambda School (now BloomTech) student cohort
    project ("Lambda Labs" copyright line, 2018); the same
    checkout()-trusts-request.POST('amount') shape recurs nearly
    verbatim across several other BloomTech-Labs cohort repos found
    during collection (CS10-employee-shift, CS10-flight-log,
    Labs8-OfflineReader), all sharing the same MIT/"Lambda Labs" license
    -- this one was kept as the representative example rather than
    duplicating the same shape multiple times, per this corpus's "stop
    once additional candidates are just re-showing the same
    implementation shape" guidance. Source file path in the origin repo:
    POSserver/payment/views.py.
  validated: false
  validated_by: []
  redacted: false
  # --- migrated to cwe_shared/cwe_unique per PA-0033's tightened standard.
  # NOTE: researched from trained knowledge, not a live MITRE lookup --
  # cwe.mitre.org is blocked by this environment's egress proxy (confirmed
  # via curl and WebFetch); recorded honestly rather than fabricated. ---
  cwe_shared: [CWE-840, CWE-20]
  cwe_unique: [CWE-1284, CWE-807]
  cwe_rationale: >
    CWE-1284 (Improper Validation of Specified Quantity in Input): the
    view trusts BOTH `amount` and `currency` from request.POST with no
    allowlist of supported currencies and no bound on the amount relative
    to the actual order/cart total -- a currency-confusion variant (e.g.
    charging 100 "JPY" when 100 "USD" cents was intended, since JPY has no
    minor unit) is a well-known real consequence of exactly this gap.
    CWE-807 (Reliance on Untrusted Input in a Security Decision): the
    security-relevant decision "how much money to charge" is made
    entirely from client-supplied fields with no independent server-side
    source of truth consulted at all.
  suggested_op: client_trusted_amount
  suggested_sink_family: payment_charge_amount

- file: vulnerable-2.py
  role: vulnerable
  repo: arvinmaroufi/MasaiShop
  commit_sha: 55fc3afc0409e54945c99a407d1f07ffe38951c4
  license: MIT
  license_copyright_line: "Copyright (c) [2024] [آروین معروفی]"
  tutorial_or_course_project: false
  pattern: "apply_coupon() view: coupon.is_valid() (checks is_active/expiry/max_usage) is read, then -- after computing and applying the discount to the cart -- coupon.usage_count is incremented with a plain Python `+= 1` and .save(), with no select_for_update(), no F() expression, and no transaction wrapping the read-check-write sequence (CWE-367/362/841: concurrent requests can all pass is_valid() before any of them commits the increment, so usage_count can exceed max_usage)"
  notes: >
    Real, non-tutorial Django e-commerce project (Persian-language UI
    strings kept verbatim from the source, as they are the app's own
    user-facing messages, not incidental PII). LICENSE.txt file
    (MIT, Persian translation) present in the repo root; the bracketed
    copyright line "(c) [2024] [آروین معروفی]" is copied verbatim as it
    appears in the license file, including its literal brackets. Only
    the single apply_coupon() function was kept from cart/views.py (the
    file also has cart/add_to_cart/update_cart_item/remove_cart_item/
    shopping_payment/successful_payment views not relevant to this
    entry's pattern). Source file path in the origin repo:
    cart/views.py.
  validated: false
  validated_by: []
  redacted: false
  cwe_shared: [CWE-362, CWE-367]
  cwe_unique: [CWE-662, CWE-664]
  cwe_rationale: >
    NOTE: this entry's cwe_unique was originally drafted with CWE-841,
    which a cross-file run of check-corpus-cwe-coverage.sh (this batch
    also touched ecommerce-logic/php, which already claims CWE-841 unique
    for vulnerable-qloapps-booking-1.php) correctly flagged as a
    collision -- replaced below with a narrower ID grounded in this
    entry's own code, per the hook's own guidance that a collision is
    expected/fine and the fix is a fresh, well-grounded replacement, not a
    restatement.
    CWE-662 (Improper Synchronization): the read-is_valid()-then-increment
    sequence across `coupon.usage_count` has no synchronization primitive
    of any kind coordinating concurrent access to that shared counter --
    no lock, no atomic transaction, no select_for_update() -- distinct
    from the shared CWE-362/CWE-367 TOCTOU class in naming the *absence of
    a coordination mechanism itself*, not just the resulting race window.
    CWE-664 (Improper Control of a Resource Through its Lifetime): the in-memory
    `coupon` ORM object is read once at the top of the view, then mutated
    and `.save()`-d multiple times (usage_count, then possibly
    is_active) later in the same function without ever being re-read,
    so later writes act on a potentially stale snapshot of that resource
    for the rest of its lifetime within the request.
  suggested_op: unlocked_check_then_act
  suggested_sink_family: db_counter_increment

- file: idiomatic-1.py
  role: idiomatic
  repo: afarroc/jewelry_catalog
  commit_sha: c56697fea303ecde9f70ff977d32d866aefe9ebc
  license: MIT
  license_copyright_line: "Copyright (c) 2025 Arturo Farro"
  tutorial_or_course_project: false
  pattern: "process_order() computes order.total from order.subtotal (itself built from each cart item's product.price) plus server-configured shipping/tax, inside a transaction.atomic() block; process_payment() then charges exactly int(order.total * 100) via stripe.PaymentIntent.create() -- the charge amount is never read from the request"
  notes: >
    Real, current (2025) Django jewelry e-commerce project; not a
    tutorial/course project. Only process_order() and process_payment()
    were kept from orders/views.py (a 650+ line file with several other
    checkout code paths -- a class-based/AJAX checkout view, order
    history/detail/invoice views, cancellation/refund handling, and a
    DRF API -- all using the same order.total-computed-then-charged
    pattern; process_order()/process_payment() were chosen as the
    clearest, most self-contained illustration). Source file path in the
    origin repo: orders/views.py.
  validated: false
  validated_by: []
  redacted: false
  cwe_shared: [CWE-840, CWE-20]
  cwe_unique: [CWE-681, CWE-696]
  cwe_rationale: >
    NOTE: this entry's cwe_unique was originally drafted with CWE-1339,
    which a cross-file run of check-corpus-cwe-coverage.sh (this batch
    also touched ecommerce-logic/php, which already claims CWE-1339
    unique for idiomatic-1.php) correctly flagged as a collision --
    replaced below with a narrower, more precise ID for this entry's own
    code, per the hook's own guidance that a collision is expected/fine
    and the fix is a fresh, well-grounded replacement, not a restatement.
    CWE-681 (Incorrect Conversion between Numeric Types):
    process_payment() charges exactly `int(order.total * 100)` -- if
    `order.total` is a float rather than a Decimal, this int() truncation
    of a floating-point cents value can produce classic conversion errors
    (e.g. 19.99 * 100 evaluating to 1998.9999999999998, truncated to 1998
    instead of 1999 cents) -- a data-loss defect in the *conversion
    between numeric representations* specifically, not merely an
    imprecise real-number computation in the abstract. CWE-696 (Incorrect Behavior Order):
    process_order() computes and commits `order.total` inside its own
    `transaction.atomic()` block, and the actual charge happens in a
    separate, later call to process_payment() -- a crash or retry between
    the two steps can leave the committed order total and the actual
    charge state inconsistent, since the total-computation and the
    charge are not one atomic unit together.
  suggested_op: server_recomputed_amount
  suggested_sink_family: payment_charge_amount

# --- manufactured per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
# "Per-pair mechanics" (Phase 3, second manufacturing batch). Closes the
# gap noted for this cell's CWE-20/CWE-840 group specifically (natural
# pair vulnerable-1.py/idiomatic-1.py, floor 2, gap 1) -- NOT the
# CWE-362/CWE-367 TOCTOU group above (vulnerable-2.py/
# idiomatic-2-altered.py), which is a different (cell, CWE) group already
# manufactured in an earlier batch. Distinct sub-scenario from
# vulnerable-1.py/idiomatic-1.py's Stripe-charge-amount shape: referral-
# credit redemption at checkout, where the trust boundary is how much of
# a stored ReferralCredit balance gets applied, not the charge amount
# itself.

- file: idiomatic-3-altered.py
  role: idiomatic
  derived_from: vulnerable-3-altered.py
  manufactured: true
  license: "n/a (manufactured, a distinct sub-scenario using this file's own established real-world idiom -- server-side recomputation from a DB-backed record rather than a client-supplied number; no additional upstream source copied)"
  notes: >
    MANUFACTURED. Referral-credit redemption at checkout. Minimal-pair
    discipline: same function signature, same models, same response
    shape as vulnerable-3-altered.py; differs ONLY in how applied_cents
    is computed (min(credit.remaining_cents, subtotal_cents), clamped to
    both the record's own stored balance and the order's own computed
    subtotal, vs. trusted directly from request.POST['credit_cents']).
  pattern: "apply_referral_credit() computes applied_cents as min(credit.remaining_cents, subtotal_cents) inside a transaction.atomic() block -- the credit actually applied is always clamped to both the ReferralCredit's own stored balance and the order's own server-computed subtotal, never taken from the request"
  validated: true
  validated_by: [py_compile, manual-review]
  redacted: false
  cwe_shared: [CWE-840, CWE-20]
  cwe_unique: [CWE-706, CWE-1050]
  cwe_rationale: >
    Shared: see vulnerable-1.py's cwe_rationale above.
    Unique to this entry, researched against the MITRE CWE index: CWE-706
    (Use of Incorrectly-Resolved Name or Reference) -- `.filter(customer=
    request.user, active=True).first()` has no explicit `.order_by()`, so
    on a backend without a guaranteed default ordering the "first" credit
    record returned for a customer with more than one active credit is
    nondeterministic, potentially resolving to an unintended record; CWE-1050
    (Excessive Platform Resource Consumption within a Loop) -- `subtotal_cents`
    is computed via `sum(... for item in order.items.all())` with no limit
    on the number of order items iterated, a per-request cost that scales
    with an attacker-influenced order size.
  suggested_op: server_recomputed_amount
  suggested_sink_family: store_credit_redemption

- file: vulnerable-3-altered.py
  role: vulnerable
  derived_from: idiomatic-3-altered.py
  manufactured: true
  license: "n/a (manufactured, derived from idiomatic-3-altered.py's own structure per the plan's methodology; no additional upstream source copied)"
  notes: >
    MANUFACTURED per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
    "Per-pair mechanics". Derived from idiomatic-3-altered.py, altered
    ONLY in how the applied credit amount is decided: the client's own
    posted credit_cents field is trusted outright instead of recomputing
    it from the ReferralCredit record's stored balance. A negative
    credit_cents even flips the subtraction into an increase of the
    credit's own remaining balance.
  pattern: "applied_cents is read directly via int(request.POST.get('credit_cents', 0)) with no bound against the ReferralCredit's own stored balance, no bound against the order's own computed subtotal, and no handling of a non-numeric value"
  validated: true
  validated_by: [py_compile, manual-review]
  redacted: false
  cwe_shared: [CWE-840, CWE-20]
  cwe_unique: [CWE-248, CWE-693]
  cwe_rationale: >
    Shared: see vulnerable-1.py's cwe_rationale above.
    Unique to this entry: CWE-248 (Uncaught Exception) -- `int(request.
    POST.get('credit_cents', 0))` raises an uncaught ValueError for any
    non-numeric value, crashing the view with an unhandled 500 rather
    than a controlled rejection; CWE-693 (Protection Mechanism Failure)
    -- no protection mechanism of any kind (bounds check, allowlist, sign
    check) exists for credit_cents before it is applied to the credit's
    own persisted balance.
  suggested_op: client_trusted_amount
  suggested_sink_family: store_credit_redemption

# Skipped for no license (cited/described in prose only, per this
# corpus's license-handling rule -- no source text copied from any of
