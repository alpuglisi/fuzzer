# Vuln-corpus Phase 2 manifest — feature: e-commerce (cart/checkout/
# payment/coupons, incl. billing/invoicing/subscriptions), language: PHP.
# See docs/VULN_CORPUS_EXPANSION_PLAN.md Phase 2 for the schema/rules this
# file follows.
#
# Pairing note: this cell landed at the 2-example floor, and -- unlike
# most other cells in this corpus -- the two examples are NOT a matched
# pair of the *same* code shape. This is the "harder to find" outcome the
# assignment anticipated for this feature class: real PHP e-commerce
# projects trusting a client-posted price/total at the charge step are
# common on GitHub (see the many hits noted below), but essentially none
# of the ones actually exhibiting that exact shape carry a LICENSE file or
# a declared license, so per this corpus's license-triage rule they could
# not be copied. The one real, licensed PHP business-logic-flaw example
# located was a coupon-redemption race condition (a different sink shape:
# CWE-362/367/841, not CWE-840 price tampering); a real, licensed
# idiomatic price-recomputation example was located separately and paired
# with it here on the shared "e-commerce business-logic" feature rather
# than on an identical sink. See "Skipped for no license" below for the
# unlicensed price-tampering candidates that would otherwise have made a
# tighter same-shape pair.

- file: vulnerable-1.php
  role: vulnerable
  repo: cnqvnet/mucms
  commit_sha: 53efad054242e471157be9a57aa0a0a7143d54cf
  license: Apache-2.0
  tutorial_or_course_project: false
  pattern: "check-then-act coupon-redemption race: checkCode() reads uses_left and the caller checks `uses_left <= 0` in PHP, but the corresponding decrement (setUsesLeft(), an unconditional `UPDATE ... SET uses_left = uses_left - 1`) happens later in a separate statement with no row lock, no `WHERE uses_left > 0` guard, and no transaction wrapping the read and the write together (CWE-367/362/841)"
  notes: >
    Real, currently-maintained open-source game-server CMS ("free mu cms
    based on dmn mucms", per its own README); Apache-2.0 LICENSE present
    in the repo root, no NOTICE file to carry forward. Combines an excerpt
    of two real files from the same plugin (see the file's own header
    comment): application/plugins/gift_code/models/model.gift_code.php
    (checkCode/checkUsesByAccount/logGiftCode/setUsesLeft methods) and
    application/plugins/gift_code/plugin.php (the redeem_coupon POST
    handler, trimmed to its first reward branch -- the original repeats
    the same checkCode() -> ...checks... -> setUsesLeft() shape across
    ~8 near-identical branches for different reward types). Confirmed via
    plugin.php that setUsesLeft() actually is called at the end of the
    validated branch, well after the uses_left check, with several other
    validation steps (server/expiry/class/per-account usage-cap checks) in
    between that only widen the race window without re-reading or locking
    uses_left.
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review confirms line 40: `UPDATE DmN_Gift_Codes SET uses_left =
    uses_left - 1 WHERE code = '...'` -- no `uses_left > 0` bound and no
    transaction/lock around this statement and the earlier `checkCode()`
    read (line 15/52-54) -- matches the pattern/CWE-362/367/841 exactly.
    `php -l` parses clean. Semgrep (local custom rule
    `php-unconditional-decrement-no-guard`; registry blocked --
    semgrep.dev:443 CONNECT returns 403 via this environment's egress
    proxy) fires on line 40 exactly, confirming the missing guard
    textually as well as by manual reading. No dynamic run: demonstrating
    the actual race requires concurrent requests against a live,
    lockable DB under real contention (this environment's gVisor sandbox
    runs one isolated, network-less process per invocation, not a
    concurrent multi-request scenario against a shared DB state) --
    static + manual confirmation of the missing atomic guard is the
    practical evidence for a TOCTOU class like this one, consistent with
    the plan's own fallback-to-static guidance where a live exploit
    harness isn't practical.
  redacted: false
  cwe_shared: [CWE-840]
  cwe_unique: [CWE-362, CWE-367, CWE-667]
  cwe_rationale: >
    Shared (this cell's broader business-logic-error class, also carried
    by idiomatic-1.php below and the woocommerce-cart-hook/qloapps-booking
    pairs elsewhere in this file -- this entry and idiomatic-1.php are
    explicitly NOT a matched-shape pair per this file's own header note,
    so no other CWEs are shared between them): CWE-840 (Business Logic
    Errors).
    Unique to this entry, researched against the MITRE CWE index: CWE-362
    (Concurrent Execution using Shared Resource with Improper
    Synchronization, 'Race Condition') and CWE-367 (Time-of-check
    Time-of-use Race Condition) are this entry's own primary, specific
    mechanism (already correctly identified pre-BUG-0029, retained here);
    CWE-667 (Improper Locking) -- per the pattern field, "no row lock, no
    WHERE uses_left > 0 guard, and no transaction wrapping the read and
    the write together" is specifically the absence of a lock around the
    check-then-act sequence, a distinct, more precise MITRE ID than CWE-362
    alone for *why* the race is exploitable.
  suggested_op: unlocked_check_then_act
  suggested_sink_family: single_use_resource_redemption

- file: idiomatic-1.php
  role: idiomatic
  repo: dprabin/simple-php-shopping-cart
  commit_sha: 677f18b90b7be9814871739b99f4a064eeea59f7
  license: GPL-2.0
  tutorial_or_course_project: false
  pattern: "checkout (PayPal Express Checkout) recomputes each line item's price via Product_model->get_product_details($item_id) -- a fresh DB lookup keyed only by the posted item id -- and accumulates the order total itself, rather than trusting a client-supplied price or total field for the PAYMENTREQUEST_0_AMT sent to PayPal"
  notes: >
    Real, published CodeIgniter shopping-cart project. Per this corpus's
    copyleft-handling rule (repo's LICENSE is GPLv2), only the single
    relevant method (Cart::process()) was copied, not the whole
    controller file (index/add/update/payment_success methods, and the
    class's inline __construct-era comments, were omitted). Notably, the
    same controller's add() method (not included here) does accept a
    client-posted 'price' into the CI cart library's per-item record --
    but that client-influenced value is never what actually reaches the
    charge step, because process() always re-derives price from
    Product_model before building the PayPal request, which is exactly
    why process() (not add()) is the idiomatic-shape excerpt kept here.
    Source file path in the origin repo: application/controllers/cart.php.
  validated: true
  validated_by: [manual-review]
  validation_notes: >
    Manual review confirms lines 31-46/75-87: `$product =
    $this->Product_model->get_product_details($item_id)` (DB lookup keyed
    on the posted item id only) feeds `$subtotal`/`$this->total`, and the
    PayPal `PAYMENTREQUEST_0_AMT`/`ITEMAMT` fields are built from
    `$this->total`/`$this->grand_total` -- never a client-posted price or
    total field; `grep -n "input->post"` confirms the only posted values
    used are item id/qty/address fields, never a price/amount/total key.
    `php -l` parses clean. No PHP custom semgrep rule in this pass targets
    this file's shape (a string-built PayPal NVP request, not a
    parameterized-query or Stripe-SDK call), so semgrep is deliberately
    not claimed here -- per the "no silent pass"/no-collapsing-checks
    rule, only manual-review is listed since it is the check that
    actually ran and confirmed the claim. No dynamic run: requires a live
    CodeIgniter framework context (`$this->input`/`$this->config`/
    `$this->session`/`Product_model`) and a live PayPal API endpoint, out
    of scope for this offline pass.
  redacted: false
  cwe_shared: [CWE-840]
  cwe_unique: [CWE-1339, CWE-573]
  cwe_rationale: >
    Shared: see vulnerable-1.php's cwe_rationale above -- this cell's
    broader business-logic-error class (not a matched-shape pair with that
    entry; each has its own distinct unique mechanism).
    Unique to this entry, researched against the MITRE CWE index: CWE-1339
    (Insufficient Precision or Accuracy of a Real Number) -- `process()`
    "accumulates the order total itself" in PHP application code (not a
    DB-side SUM or gateway-computed total); PHP floating-point price
    accumulation is a well-documented real-world source of rounding-error
    bugs, a residual concern even in this correctly-recomputing entry;
    CWE-573 (Improper Following of Specification by Caller) -- this is a
    PayPal Express Checkout integration, whose documented flow requires a
    later confirmation call (`DoExpressCheckoutPayment`) to re-verify the
    amount matches what was set here; nothing in this excerpt confirms
    that later step follows PayPal's own specified verification.
  suggested_op: server_recomputed_amount
  suggested_sink_family: payment_charge_amount

# --- manufactured per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
# "Per-pair mechanics" (Phase 3, second manufacturing batch). Closes the
# gap noted for this cell's CWE-840 group (vulnerable-1.php/idiomatic-1.php
# is the natural pair, but it is a not-same-shape pairing per this file's
# own header note -- floor 2, natural 1). Distinct sub-scenario from both
# vulnerable-1.php/idiomatic-1.php (coupon-race / price-recompute) and the
# woocommerce-cart-hook/qloapps-booking pairs below (price override): VIP/
# loyalty discount-tier application, where the trust boundary is which
# discount percentage gets applied, not the underlying price itself.

- file: idiomatic-2-altered.php
  role: idiomatic
  derived_from: vulnerable-2-altered.php
  manufactured: true
  license: "n/a (manufactured, a distinct sub-scenario using this file's own established real-world idiom -- server-side lookup from a DB-backed record rather than a client-supplied number; no additional upstream source copied)"
  notes: >
    MANUFACTURED. VIP/loyalty discount-tier application at checkout.
    Minimal-pair discipline: same function signature and control flow as
    vulnerable-2-altered.php; differs ONLY in how $discountPercent is
    decided (looked up from the customer's own stored loyalty_tier column
    via a fixed $tierDiscounts map, vs. trusted directly from
    $_POST['vip_discount_percent']).
  pattern: "applyLoyaltyDiscount() looks up the customer's own loyalty_tier column via a prepared statement and maps it through a fixed $tierDiscounts array -- the discount percentage actually applied is never read from the request"
  validated: true
  validated_by: [php-syntax-check, manual-review]
  redacted: false
  cwe_shared: [CWE-840]
  cwe_unique: [CWE-697, CWE-1023]
  cwe_rationale: >
    Shared: see vulnerable-1.php's cwe_rationale above -- this cell's
    broader business-logic-error class (not a matched-shape pair with any
    other entry in this file; each has its own distinct unique mechanism).
    Unique to this entry, researched against the MITRE CWE index: CWE-697
    (Incorrect Comparison) -- the `$tierDiscounts[$tier] ?? 0.0` lookup
    relies on PHP array-key lookup semantics for a value read straight out
    of the database column with no explicit type/format check first,
    which is exactly the class of PHP loose-comparison/coercion pitfall
    CWE-697 describes if `$tier` is ever a non-string type from the DB
    driver; CWE-1023 (Incomplete Comparison with Missing Factors) -- the
    fixed $tierDiscounts map does not account for every tier value the
    `loyalty_tier` column could actually hold (e.g. NULL for a brand-new
    customer, or a future tier added to the enum but not yet to this map),
    silently defaulting to 0.0 rather than surfacing the gap.
  suggested_op: server_recomputed_amount
  suggested_sink_family: discount_percent_lookup

- file: vulnerable-2-altered.php
  role: vulnerable
  derived_from: idiomatic-2-altered.php
  manufactured: true
  license: "n/a (manufactured, derived from idiomatic-2-altered.php's own structure per the plan's methodology; no additional upstream source copied)"
  notes: >
    MANUFACTURED per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
    "Per-pair mechanics". Derived from idiomatic-2-altered.php, altered
    ONLY in how the discount percentage is decided: the client's own
    posted vip_discount_percent field is trusted outright instead of
    looking it up from the customer's own stored loyalty_tier column. A
    percent over 100 drives the discounted total negative; a negative
    percent inflates it above the original total.
  pattern: "discountPercent is read directly from $_POST['vip_discount_percent'] with no lookup against the customer's own tier, no upper bound, and no allowlist of the tiers' own known valid percentages"
  validated: true
  validated_by: [php-syntax-check, manual-review]
  redacted: false
  cwe_shared: [CWE-840]
  cwe_unique: [CWE-183, CWE-20]
  cwe_rationale: >
    Shared: see vulnerable-1.php's cwe_rationale above.
    Unique to this entry: CWE-183 (Permissive List of Allowed Inputs) --
    no allowlist of valid discount percentages (e.g. the tiers' own known
    {0, 5, 10, 15}) constrains vip_discount_percent at all -- literally any
    numeric string is accepted; CWE-20 (Improper Input Validation) -- the
    `(float) ($_POST['vip_discount_percent'] ?? 0)` cast performs a type
    coercion but no actual validation (range, sign, or membership in a
    known set) of the resulting value before it drives a monetary
    calculation.
  suggested_op: client_trusted_amount
  suggested_sink_family: discount_percent_lookup

