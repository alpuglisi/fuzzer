# calling it -- the same CWE-840 shape as this cell's woocommerce-cart-hook
# pair above, in a different real architecture (QloApps/PrestaShop-family
# hotel-booking engine vs. WooCommerce e-commerce). suggested_op/
# suggested_sink_family are reused from that pair rather than restated as
# new, since the mechanism is identical. Commit pinned via `git ls-remote
