# (2026-09-22).

- file: idiomatic-qloapps-booking-1.php
  role: idiomatic
  architecture: qloapps-booking
  repo: Qloapps/QloApps
  commit_sha: de6ecd72f0ce73750bea8d653c47efd9e2eb837b
  license: OSL-3.0
  tutorial_or_course_project: false
  pattern: "Cart::getOrderTotal() signature and its Adapter_ProductPriceCalculator dependency wiring -- the real server-side entry point booking totals are always recomputed through, never taken from a client-supplied total"
  notes: >
    Trimmed excerpt (method signature and dependency setup only, per the
    OSL-3.0 copyleft-handling rule -- the ~150-line tax/rounding/discount
    body is omitted as not illustrative of this specific contrast).
    Source file path in the origin repo: classes/Cart.php.
    **License note: OSL-3.0 (copyleft) -- do not let this snippet or its
    manufactured pair below quietly seed an emitter/module template
    without this flag surviving; Step 8 of the site-architecture plan
    stops at the proposal stage for exactly this reason.**
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe_shared: [CWE-602, CWE-840]
  cwe_unique: [CWE-820, CWE-682]
  cwe_rationale: >
    Shared: see idiomatic-woocommerce-hook-1.php's cwe_rationale above --
    same weakness class, a different real architecture.
    Unique to this entry (grounded in QloApps' own specific code, not the
    same as WooCommerce's hook-based delegation, and distinct from
    vulnerable-1.php's CWE-367/CWE-667 TOCTOU finding elsewhere in this
    file -- this is a missing-synchronization concern on a *cached* value,
    not a check-then-act race on a *counter*): CWE-820 (Missing
    Synchronization) -- `getOrderTotal(..., $use_cache = true)` defaults to
    reading a cached total shared across calls with no synchronization
    shown against a cart mutated concurrently (e.g. a second request
    changing room/occupancy) -- a caching parameter WooCommerce's shown
    excerpt has no analogue for; CWE-682 (Incorrect
    Calculation) -- the method's own signature threads five independent
    optional parameters (`$with_taxes`, `$type`, `$products`, `$id_carrier`,
    `$use_cache`) through a single total computation, a materially larger
    combinatorial surface for a wrong-combination calculation bug than
    WooCommerce's simpler no-argument `calculate_totals()`.
  suggested_op: server_recomputed_amount   # same top-level property as
                             # idiomatic-1.php above (server derives the
                             # amount, never trusts a client value) --
                             # reused despite the different delegation
                             # mechanism (service-locator adapter here vs.
                             # inline DB lookup there)
  suggested_sink_family: payment_charge_amount

- file: vulnerable-qloapps-booking-1.php
  role: vulnerable
  architecture: qloapps-booking
