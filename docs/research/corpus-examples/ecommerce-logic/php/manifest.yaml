  validated_by: [manual-review]
  redacted: false
  cwe_shared: [CWE-602, CWE-840]
  cwe_unique: [CWE-829, CWE-668]
  cwe_rationale: >
    Shared (documented, not counted toward the floor -- applies to every
    entry in this pair-of-pairs, see vulnerable-woocommerce-hook-1.php and
    both qloapps-booking entries): CWE-602 (Client-Side Enforcement of
    Server-Side Security) is MITRE's own canonical example for this exact
    shape -- its description names an e-commerce app that computes a price
    client-side and trusts the value posted back; CWE-840 (Business Logic
