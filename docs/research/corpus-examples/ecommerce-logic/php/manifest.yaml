# Vuln-corpus Phase 2 manifest — feature: e-commerce (cart/checkout/
# payment/coupons, incl. billing/invoicing/subscriptions), language: PHP.
# See docs/VULN_CORPUS_EXPANSION_PLAN.md Phase 2 for the schema/rules this
# file follows.
#
# Pairing note: this cell landed at the 2-example floor, and -- unlike
# most other cells in this corpus -- the two examples are NOT a matched
# pair of the *same* code shape. This is the "harder to find" outcome the
# assignment anticipated for this feature class: real PHP e-commerce
# projects trusting a client-posted price/total at the charge step are
# common on GitHub (see the many hits noted below), but essentially none
# of the ones actually exhibiting that exact shape carry a LICENSE file or
# a declared license, so per this corpus's license-triage rule they could
# not be copied. The one real, licensed PHP business-logic-flaw example
# located was a coupon-redemption race condition (a different sink shape:
# CWE-362/367/841, not CWE-840 price tampering); a real, licensed
# idiomatic price-recomputation example was located separately and paired
# with it here on the shared "e-commerce business-logic" feature rather
# than on an identical sink. See "Skipped for no license" below for the
# unlicensed price-tampering candidates that would otherwise have made a
# tighter same-shape pair.

- file: vulnerable-1.php
  role: vulnerable
  repo: cnqvnet/mucms
  commit_sha: 53efad054242e471157be9a57aa0a0a7143d54cf
  license: Apache-2.0
  tutorial_or_course_project: false
  pattern: "check-then-act coupon-redemption race: checkCode() reads uses_left and the caller checks `uses_left <= 0` in PHP, but the corresponding decrement (setUsesLeft(), an unconditional `UPDATE ... SET uses_left = uses_left - 1`) happens later in a separate statement with no row lock, no `WHERE uses_left > 0` guard, and no transaction wrapping the read and the write together (CWE-367/362/841)"
  notes: >
    Real, currently-maintained open-source game-server CMS ("free mu cms
    based on dmn mucms", per its own README); Apache-2.0 LICENSE present
    in the repo root, no NOTICE file to carry forward. Combines an excerpt
    of two real files from the same plugin (see the file's own header
    comment): application/plugins/gift_code/models/model.gift_code.php
    (checkCode/checkUsesByAccount/logGiftCode/setUsesLeft methods) and
    application/plugins/gift_code/plugin.php (the redeem_coupon POST
    handler, trimmed to its first reward branch -- the original repeats
    the same checkCode() -> ...checks... -> setUsesLeft() shape across
    ~8 near-identical branches for different reward types). Confirmed via
    plugin.php that setUsesLeft() actually is called at the end of the
    validated branch, well after the uses_left check, with several other
    validation steps (server/expiry/class/per-account usage-cap checks) in
    between that only widen the race window without re-reading or locking
    uses_left.
  validated: false
  validated_by: []
  redacted: false
  cwe_shared: [CWE-840]
  cwe_unique: [CWE-362, CWE-367, CWE-667]
  cwe_rationale: >
    Shared (this cell's broader business-logic-error class, also carried
    by idiomatic-1.php below and the woocommerce-cart-hook/qloapps-booking
    pairs elsewhere in this file -- this entry and idiomatic-1.php are
    explicitly NOT a matched-shape pair per this file's own header note,
    so no other CWEs are shared between them): CWE-840 (Business Logic
    Errors).
    Unique to this entry, researched against the MITRE CWE index: CWE-362
    (Concurrent Execution using Shared Resource with Improper
    Synchronization, 'Race Condition') and CWE-367 (Time-of-check
    Time-of-use Race Condition) are this entry's own primary, specific
    mechanism (already correctly identified pre-BUG-0029, retained here);
    CWE-667 (Improper Locking) -- per the pattern field, "no row lock, no
    WHERE uses_left > 0 guard, and no transaction wrapping the read and
    the write together" is specifically the absence of a lock around the
    check-then-act sequence, a distinct, more precise MITRE ID than CWE-362
    alone for *why* the race is exploitable.
  suggested_op: unlocked_check_then_act
  suggested_sink_family: single_use_resource_redemption

- file: idiomatic-1.php
  role: idiomatic
  repo: dprabin/simple-php-shopping-cart
  commit_sha: 677f18b90b7be9814871739b99f4a064eeea59f7
  license: GPL-2.0
  tutorial_or_course_project: false
  pattern: "checkout (PayPal Express Checkout) recomputes each line item's price via Product_model->get_product_details($item_id) -- a fresh DB lookup keyed only by the posted item id -- and accumulates the order total itself, rather than trusting a client-supplied price or total field for the PAYMENTREQUEST_0_AMT sent to PayPal"
  notes: >
    Real, published CodeIgniter shopping-cart project. Per this corpus's
    copyleft-handling rule (repo's LICENSE is GPLv2), only the single
    relevant method (Cart::process()) was copied, not the whole
    controller file (index/add/update/payment_success methods, and the
    class's inline __construct-era comments, were omitted). Notably, the
    same controller's add() method (not included here) does accept a
    client-posted 'price' into the CI cart library's per-item record --
    but that client-influenced value is never what actually reaches the
    charge step, because process() always re-derives price from
    Product_model before building the PayPal request, which is exactly
    why process() (not add()) is the idiomatic-shape excerpt kept here.
    Source file path in the origin repo: application/controllers/cart.php.
  validated: false
  validated_by: []
  redacted: false
  cwe_shared: [CWE-840]
  cwe_unique: [CWE-1339, CWE-573]
  cwe_rationale: >
    Shared: see vulnerable-1.php's cwe_rationale above -- this cell's
    broader business-logic-error class (not a matched-shape pair with that
    entry; each has its own distinct unique mechanism).
    Unique to this entry, researched against the MITRE CWE index: CWE-1339
    (Insufficient Precision or Accuracy of a Real Number) -- `process()`
    "accumulates the order total itself" in PHP application code (not a
    DB-side SUM or gateway-computed total); PHP floating-point price
    accumulation is a well-documented real-world source of rounding-error
    bugs, a residual concern even in this correctly-recomputing entry;
    CWE-573 (Improper Following of Specification by Caller) -- this is a
    PayPal Express Checkout integration, whose documented flow requires a
    later confirmation call (`DoExpressCheckoutPayment`) to re-verify the
    amount matches what was set here; nothing in this excerpt confirms
    that later step follows PayPal's own specified verification.
  suggested_op: server_recomputed_amount
  suggested_sink_family: payment_charge_amount

# --- added by docs/VULN_CORPUS_SITE_ARCHITECTURE_EXPANSION_PLAN.md wave 1,
# category 1 (e-commerce/marketplaces), architecture: woocommerce-cart-hook.
# The idiomatic side is verbatim WooCommerce core (GPL-3.0-only -- kept to
# the single calculate_totals() method per this corpus's copyleft-handling
# rule, prominently flagged here and in each entry's license field so this
# GPL provenance survives into any later handoff). The vulnerable side is
# NOT a same-file edit of the idiomatic side (unlike this cell's
# vulnerable-1.php/idiomatic-1.php, which aren't a same-file pair either) --
# it is a manufactured plugin-style callback hooked on the real
# 'woocommerce_before_calculate_totals' action the idiomatic side fires,
# reproducing the exact "custom checkout price override trusts $_POST"
# anti-pattern this cell's own "Skipped for no license" notes below
# describe finding in the wild (hamzamamdouh298/shop_4K) but could not
# license-clear -- this fills that gap with a manufactured equivalent
# instead. Commit pinned via `git ls-remote
# https://github.com/woocommerce/woocommerce.git trunk` at collection time
# (2026-09-22).

- file: idiomatic-woocommerce-hook-1.php
  role: idiomatic
  architecture: woocommerce-cart-hook
  repo: woocommerce/woocommerce
  commit_sha: c4ed11e2a9102f400f3b975043a2a29ecf4236e5
  license: GPL-3.0-only
  tutorial_or_course_project: false
  pattern: "WC_Cart::calculate_totals() delegates all line-item/total recalculation to a fresh WC_Cart_Totals instance and fires 'woocommerce_before_calculate_totals'/'woocommerce_after_calculate_totals' as the documented extension points -- it is the real hook surface the vulnerable side's manufactured callback attaches to, not itself a price-recomputation routine"
  notes: >
    Verbatim excerpt (single method only, per the GPL-3.0 copyleft-handling
    rule) of WC_Cart::calculate_totals(). Source file path in the origin
    repo: plugins/woocommerce/includes/class-wc-cart.php.
    **License note: GPL-3.0-only (copyleft) -- do not let this snippet or
    its manufactured pair below quietly seed an emitter/module template
    without this flag surviving; see this plan's Step 8 scoping, which
    already stops at the proposal stage for exactly this reason.**
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe_shared: [CWE-602, CWE-840]
  cwe_unique: [CWE-829, CWE-668]
  cwe_rationale: >
    Shared (documented, not counted toward the floor -- applies to every
    entry in this pair-of-pairs, see vulnerable-woocommerce-hook-1.php and
    both qloapps-booking entries): CWE-602 (Client-Side Enforcement of
    Server-Side Security) is MITRE's own canonical example for this exact
    shape -- its description names an e-commerce app that computes a price
    client-side and trusts the value posted back; CWE-840 (Business Logic
    Errors) is the general category this weakness instantiates.
    Unique to this entry (researched against the MITRE CWE index,
    https://cwe.mitre.org/data/index.html, not recalled, and not claimed by
    any other entry in this corpus): CWE-829 (Inclusion of Functionality
    from Untrusted Control Sphere) -- the real `do_action(
    'woocommerce_before_calculate_totals', $this)` hook this method fires
    passes the live Cart object, by reference, to *every* registered
    callback (core WooCommerce or any installed plugin) with no additional
    guardrail beyond "this function is hooked" -- exactly CWE-829's own
    description of including/trusting functionality from a control sphere
    the framework itself doesn't fully vet; CWE-668 (Exposure of Resource
    to Wrong Sphere) -- the *entire* `$this` Cart object (not a narrower,
    purpose-built API) is exposed to each hooked callback, more state/
    surface than a minimal extension point would need to grant.
  suggested_op: hook_delegated_recompute   # distinct mechanism from
                             # server_recomputed_amount (idiomatic-1.php,
                             # above) -- that one recomputes inline in the
                             # same function; this one delegates to a
                             # collaborator object via an action hook.
                             # Proposed as new.
  suggested_sink_family: payment_charge_amount

- file: vulnerable-woocommerce-hook-1.php
  role: vulnerable
  architecture: woocommerce-cart-hook
  derived_from: idiomatic-woocommerce-hook-1.php
  repo: woocommerce/woocommerce
  commit_sha: c4ed11e2a9102f400f3b975043a2a29ecf4236e5
  license: GPL-3.0-only
  tutorial_or_course_project: false
  pattern: "manufactured: a callback hooked on the real 'woocommerce_before_calculate_totals' action (fired by idiomatic-woocommerce-hook-1.php) that sets each cart item's price from $_POST['custom_price'] with no re-validation against the product's own canonical price -- CWE-840 business logic error / price tampering, the same real-world WooCommerce-plugin CVE shape as several actually-disclosed 'checkout price override' plugin vulnerabilities"
  notes: >
    Manufactured per docs/VULN_CORPUS_EXPANSION_PLAN.md Phase 3's "Pair
    generation" methodology, using WooCommerce's own real hook name/calling
    convention as the base rather than a synthetic stand-in -- not a
    same-file diff of the idiomatic side (the idiomatic side doesn't itself
    contain price logic to alter; it only fires the hook this file attaches
    to), so the "structural check" applied here is a manual read confirming
    the hook name and $cart argument shape match the idiomatic side's real
    action, not a line-level diff. No dynamic-execution validation available
    in this session's environment (see this plan's "Tooling constraints"
    section); validated at the structural/manual-review tier only.
    **License note: derived from GPL-3.0-only code -- see the idiomatic
    entry's license note above; the same caution applies here.**
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe_shared: [CWE-602, CWE-840]
  cwe_unique: [CWE-471, CWE-345]
  cwe_rationale: >
    Shared: see idiomatic-woocommerce-hook-1.php's cwe_rationale above --
    same mechanism, researched once.
    Unique to this entry: CWE-471 (Modification of Assumed-Immutable Data)
    -- `$cart_item['data']->set_price(...)` mutates the live `WC_Product`
    object obtained from `$cart->get_cart()`; within a single request that
    price is exactly the "assumed-immutable" authoritative value the rest
    of checkout relies on once loaded, and this callback modifies it from
    attacker-controlled `$_POST` data -- distinct from CWE-602/840 (the
    general trust-boundary violation) in naming *what specifically* gets
    corrupted and how; CWE-345 (Insufficient Verification of Data
    Authenticity) -- the posted price is cast with `floatval(
    wp_unslash(...))` (unslashing is correct WordPress practice for
    undoing its own magic-quotes layer, but a type cast is not
    verification) and never checked against any authoritative source
    before being trusted as a charge amount.
  suggested_op: trust_client_price_input   # the exact gap this cell's
                             # "Skipped for no license" note (below) flagged
                             # as found-in-the-wild-but-unlicensed
                             # (hamzamamdouh298/shop_4K); proposed as new
  suggested_sink_family: payment_charge_amount

