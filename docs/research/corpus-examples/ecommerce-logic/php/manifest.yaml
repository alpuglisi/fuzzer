  cwe_shared: [CWE-602, CWE-840]
  cwe_unique: [CWE-441, CWE-841]
  cwe_rationale: >
    Shared: see idiomatic-woocommerce-hook-1.php's cwe_rationale above.
    Unique to this entry, and distinct from vulnerable-woocommerce-hook-1.php's
    unique CWEs (that entry poisons a value feeding into the normal
    computation path; this one skips the computation path entirely):
    CWE-441 (Unintended Proxy or Intermediary, 'Confused Deputy') -- the
    payment-module controller calls `$this->module->validateOrder(...)`,
    a store-owner-trusted, privileged operation, using an amount taken
    directly from `Tools::getValue('total_price')` -- the module acts as a
    confused deputy, exercising its own trusted privilege on the
    attacker's behalf; CWE-841 (Improper Enforcement of Behavioral
