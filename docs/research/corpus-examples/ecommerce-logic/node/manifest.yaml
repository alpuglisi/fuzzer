- file: idiomatic-1.js
  role: idiomatic
  repo: demirelarda/TrizyBackend
  commit_sha: 20e9df83d80657dd5291faac94eec1e6b10696de
  license: MIT
  license_copyright_line: "Copyright (c) 2025 Arda Demirel"
  tutorial_or_course_project: false
  pattern: "createPaymentIntent looks up each cart item's product via Mongoose populate(), validates stock, sums quantity * (salePrice ?? price) server-side, and only then calls stripe.paymentIntents.create() with the computed total -- the charge step never reads a price/amount out of the request"
  notes: >
    Real, current (2025) small e-commerce backend; not a tutorial/course
    project. Only the createPaymentIntent handler was kept (the file also
    contains order-finalization and address-lookup helpers not relevant
    to this entry's pattern). Source file path in the origin repo:
    controllers/paymentController.js.
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review confirms lines 26-65: `totalAmount` is accumulated from
    `item.productId.salePrice ?? item.productId.price` (DB-populated
    field) times quantity, plus `cart.cargoFee`, and only that computed
    `totalAmount` reaches `stripe.paymentIntents.create({amount: Math.round
    (totalAmount * 100), ...})` -- no `req.body` price field is ever read.
    `node --check` parses clean. Semgrep (local custom rule
    `js-stripe-server-computed-amount`; registry blocked, see
    vulnerable-1.js's entry) fires on line 64, and the vulnerable-side
    `js-stripe-client-price` rule does NOT fire anywhere in this file.
    No dynamic run: depends on a live Mongoose/MongoDB connection and
    Stripe API, out of scope for this offline validation pass.
  redacted: false
  cwe_shared: [CWE-840, CWE-20]
  cwe_unique: [CWE-1088, CWE-197]
  cwe_rationale: >
    Shared: see vulnerable-1.js's cwe_rationale above. Unique to this entry:
    CWE-1088 (Synchronous Access of Remote Resource Without Timeout) -- the
    stock-validation DB lookup has no timeout/retry handling shown around it, so a
    slow concurrent check leaves the race window this function is meant to close
    open longer than necessary; CWE-197 (Numeric Truncation Error) -- `salePrice
    ?? price` mixes two DB-sourced numeric fields with no explicit type
    normalization; if one is a Mongoose Decimal128 and the other a plain Number,
    the two representations don't arithmetic-compose the way this line assumes,
    risking silent truncation.
  suggested_op: server_recomputed_amount
  suggested_sink_family: payment_charge_amount

- file: idiomatic-2.js
  role: idiomatic
  repo: arifahmad17/BuyBags
  commit_sha: b04509c31ba363faead6c1a6a5868a40b3f28be8
  license: MIT
  license_copyright_line: "Copyright (c) 2023 arifahmad17"
  tutorial_or_course_project: false
  pattern: "add-to-cart handler reads product.price from the DB (Product.findById) and accumulates it into cart.totalCost server-side; the checkout handler later charges cart.totalCost * 100, never a client-posted amount -- a different idiomatic shape from idiomatic-1.js (accumulate-at-add-time vs. recompute-at-charge-time)"
  notes: >
    Kept alongside idiomatic-1.js because it illustrates a meaningfully
    different idiomatic shape (server-side accumulation into a persisted
    cart total, rather than a fresh per-item recomputation at the payment
    step) for the same underlying "never trust a client-supplied price"
    principle. Only the add-to-cart and checkout routes were kept from a
    larger router file (product listing, category browsing, and other
    unrelated routes were omitted for size). Source file path in the
    origin repo: routes/index.js.
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review confirms lines 41-59 (accumulating `product.price`,
    read from `Product.findById`, into `cart.totalCost`/`cart.items[...]
    .price`, never from `req.body`) and lines 96-100 (`stripe.
    paymentIntents.create({amount: cart.totalCost * 100, ...})`) --
    matches the pattern exactly, including the "accumulate-at-add-time"
    vs. idiomatic-1.js's "recompute-at-charge-time" distinction. `node
    --check` parses clean. Semgrep (local custom rule
    `js-stripe-server-computed-amount`; registry blocked, see
    vulnerable-1.js's entry) fires on line 96. No dynamic run: depends on
    a live Mongoose/MongoDB connection, session store, and Stripe API.
  redacted: false
  cwe_shared: [CWE-840, CWE-20]
  cwe_unique: [CWE-908, CWE-390]
  cwe_rationale: >
    Shared: see vulnerable-1.js's cwe_rationale above. Unique to this entry: CWE-908 (Use of Uninitialized Resource) -- `product` is treated as if always populated immediately after `Product.findById()`, with nothing confirming that call actually initialized it with a real document (e.g. a deleted product) before `product.price` is read off it; CWE-390 (Detection of Error Condition Without Action) -- the accumulation into cart.totalCost has no error-handling path shown at all around the DB lookup or the .save() call, so a failure partway through is not detected or acted on by this code.
  suggested_op: server_recomputed_amount
  suggested_sink_family: payment_charge_amount

# --- manufactured per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
# "Per-pair mechanics" (Phase 3, second manufacturing batch). Closes the
# gap noted for this cell's CWE-20/CWE-840 group (2 natural pairs against
# a floor of 3). Distinct sub-scenario from this file's Stripe-charge-
# amount pairs above: gift-card redemption at checkout, where the trust
# boundary is how much of a stored GiftCard balance gets applied as store
# credit, not the charge amount itself.

- file: idiomatic-4-altered.js
  role: idiomatic
  derived_from: vulnerable-4-altered.js
  manufactured: true
  license: "n/a (manufactured, a distinct sub-scenario using this file's own established real-world idiom -- server-side recomputation from a DB-backed record rather than a client-supplied number; no additional upstream source copied)"
  notes: >
    MANUFACTURED. Gift-card redemption at checkout -- a distinct
    sub-scenario from this file's Stripe-charge-amount pairs
    (vulnerable-1/2/3.js, idiomatic-1/2.js). Minimal-pair discipline: same
    route, same models, same response shape as vulnerable-4-altered.js;
    differs ONLY in how redeemAmount is computed (Math.min() against the
    GiftCard's own stored balanceCents and the cart's own computed total,
    vs. trusting a client-posted amountCents field outright).
  pattern: "redeemAmount is computed as Math.min(giftCard.balanceCents, Math.round(cartTotal * 100)) -- the amount actually redeemed is always clamped to both the card's own stored balance and the cart's own server-computed total, never taken from the request"
  validated: true
  validated_by: [node-syntax-check, manual-review]
  redacted: false
  cwe_shared: [CWE-840, CWE-20]
  cwe_unique: [CWE-833, CWE-351]
  cwe_rationale: >
    Shared: see vulnerable-1.js's cwe_rationale above. Unique to this entry,
    researched against the MITRE CWE index: CWE-833 (Deadlock) --
    `giftCard.save()` and `cart.save()` are two separate, un-transactioned awaited
    calls; a concurrent redemption racing the same gift card's balance down to 0
    while this handler is mid-sequence between the two saves is exactly the kind
    of unsynchronized, order-dependent resource acquisition that can deadlock or
    corrupt state depending on which save lands first; CWE-351 (Insufficient Type
    Distinction) -- the GiftCard's single boolean `active` flag cannot by itself
    distinguish 'still has balance' from 'explicitly deactivated by an admin', two
    states this handler and a concurrent redemption can each independently try to
    set.
  suggested_op: server_recomputed_amount
  suggested_sink_family: store_credit_redemption
  validation_caveat: >
    Dynamic (gVisor-sandbox) execution was not run for this pair: doing so
    would require a real Mongoose/MongoDB connection this session's
    sandbox (zero network, ephemeral filesystem) cannot provide. Validated
    at the static tier only: node --check syntax validation on both files
    plus manual review confirming the minimal-pair discipline (the two
    files differ only in the redeemAmount computation). Reported honestly
    per the plan's "N of M, never rounded up" instruction rather than
    padded with a fabricated dynamic result.

- file: vulnerable-4-altered.js
  role: vulnerable
  derived_from: idiomatic-4-altered.js
  manufactured: true
  license: "n/a (manufactured, derived from idiomatic-4-altered.js's own structure per the plan's methodology; no additional upstream source copied)"
  notes: >
    MANUFACTURED per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
    "Per-pair mechanics". Derived from idiomatic-4-altered.js, altered
    ONLY in how the redeemed amount is decided: the client's own posted
    amountCents field is trusted outright instead of recomputing it from
    the GiftCard record's stored balance. A negative amountCents even
    flips the subtraction into an increase of the card's own balance.
  pattern: "redeemAmount is read directly from req.body.amountCents with no bound against the GiftCard's own stored balance, no bound against the cart's own computed total, and no check that it is even a non-negative number"
  validated: true
  validated_by: [node-syntax-check, manual-review]
  redacted: false
  cwe_shared: [CWE-840, CWE-20]
  cwe_unique: [CWE-839, CWE-410]
  cwe_rationale: >
    Shared: see vulnerable-1.js's cwe_rationale above. Unique to this entry:
    CWE-839 (Numeric Range Comparison Without Minimum Check) -- nothing shown
    bounds `amountCents` from below with an explicit minimum-value check before it
    is applied to the card's own persisted balance, so a negative value is
    accepted exactly as readily as a legitimate top-up; CWE-410 (Insufficient
    Resource Pool) -- nothing shown pools or caps concurrent redemption requests
    against this endpoint, so repeated calls face no server-imposed ceiling before
    the abuse is noticed.
  suggested_op: client_trusted_amount
  suggested_sink_family: store_credit_redemption
  validation_caveat: >
    Same caveat as idiomatic-4-altered.js above -- static tier only
    (node --check plus manual review); no live Mongoose/MongoDB
    connection available in this session's sandbox.

