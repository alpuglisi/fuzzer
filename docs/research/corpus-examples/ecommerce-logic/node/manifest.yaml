# Vuln-corpus Phase 2 manifest — feature: e-commerce (cart/checkout/
# payment/coupons, incl. billing/invoicing/subscriptions), language:
# Node/JavaScript. See docs/VULN_CORPUS_EXPANSION_PLAN.md Phase 2 for the
# schema/rules this file follows.
#
# Pairing note: vulnerable-1/2/3.js all show the same real-world shape --
# an Express route trusts req.body.price (a client-supplied number) as the
# Stripe charge amount, with no server-side recomputation from a product/
# cart record. idiomatic-1.js and idiomatic-2.js are two independently-
# sourced real contrasts to that same shape (one recomputes the total from
# a Mongoose Cart/Product lookup at the payment-intent step; the other
# accumulates cart.totalCost from product.price at add-to-cart time and
# charges that accumulated value, never a client-posted total). No
# race-condition (coupon/single-use-resource) example was locatable for
# Node under an acceptable license in this pass -- see the "gap" note at
# the end of this file.

- file: vulnerable-1.js
  role: vulnerable
  repo: BAM-Shopper/BAM-Shopper
  commit_sha: 4c82228513754c9770c70b11803bff8c98117754
  license: MIT
  license_copyright_line: "Copyright (c) 2018 Fullstack Academy"
  tutorial_or_course_project: true
  pattern: "checkout route builds the Stripe charge amount directly from req.body.price, a client-supplied field, with no server-side price lookup (CWE-840 business-logic price tampering)"
  notes: >
    "BAM-Shopper" is a Fullstack Academy student capstone built from the
    school's shared "Grace Shopper" project template/rubric (hence the
    2018 Fullstack Academy MIT copyright line, common to several
    independently-implemented student repos built from the same
    template -- see vulnerable-2.js and vulnerable-3.js, different teams,
    same license/copyright line, genuinely different code). Source file
    path in the origin repo: server/api/checkout.js.
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review confirms line 12-13: `stripe.charges.create({amount:
    req.body.price, ...})` -- matches the pattern exactly, no server-side
    price lookup anywhere in the route. `node --check` parses clean.
    Semgrep (local custom rule `js-stripe-client-price`; registry blocked
    -- semgrep.dev:443 CONNECT returns 403 via this environment's egress
    proxy) fires on line 12. eslint-plugin-security not installed (npm
    registry blocked) -- not needed, the custom rule already gives
    concrete confirmation of this exact shape. No dynamic run: depends on
    a live `STRIPE_SECRET_KEY`/Stripe API (network egress + real/test
    Stripe account), out of scope for this lab-only offline validation
    pass; the business-logic flaw (trusting a client-posted amount) is
    fully demonstrated statically without needing a live charge.
  redacted: false
  # --- migrated to cwe_shared/cwe_unique per PA-0033's tightened standard.
  # NOTE: researched from trained knowledge, not a live MITRE lookup --
  # cwe.mitre.org is blocked by this environment's egress proxy (already
  # logged in ERROR_LOG.md's 2026-09-22 entry). ---
  cwe_shared: [CWE-840, CWE-20]
  cwe_unique: [CWE-642, CWE-602]
  cwe_rationale: >
    Shared (this cell's own price-tampering-shape class, see
    idiomatic-1.js/idiomatic-2.js below and vulnerable-2.js/vulnerable-3.js,
    same shape): CWE-840 (Business Logic Errors), CWE-20 (Improper Input
    Validation).
    Unique to this entry, researched against the MITRE CWE index: CWE-642
    (External Control of Critical State Data) -- the charge amount is
    exactly the kind of critical application state this weakness
    describes, and here it is read directly out of req.body.price with no
    intervening state of its own; CWE-602 (Client-Side Enforcement of
    Server-Side Security) -- MITRE's own canonical example for this ID is
    an e-commerce application that computes a price client-side and trusts
    the value posted back, which is precisely this route's shape.
  suggested_op: client_trusted_amount
  suggested_sink_family: payment_charge_amount

