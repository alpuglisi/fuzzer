- file: idiomatic-handlebars-fixed-template-2.js
  role: idiomatic
  architecture: handlebars-fixed-template
  license: "N/A (synthetic)"
  tutorial_or_course_project: false
  synthetic: true
  pattern: "Handlebars.compile() called once at startup on a fixed file asset; only the data object varies per request"
  notes: "Manufactured, representing a real, common safe-Handlebars-usage shape."
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe_shared: [CWE-1336, CWE-94]
  cwe_unique: [CWE-665, CWE-710]
  cwe_rationale: >
    Shared (this cell's core class, see ../php/manifest.yaml's
    idiomatic-twig-file-template-1.php entry): CWE-1336, CWE-94.
    Unique: CWE-665 (Improper Initialization) -- the template is compiled
    once at process startup and cached in module scope; a restart picking
    up a tampered file on disk (a separate access-control issue) would
    silently initialize that module-scope cache from it; CWE-710
    (Improper Adherence to Coding Standards) -- the template path is
    built via string concatenation (`__dirname + '/templates/...'`)
    rather than `path.join`, a real source of resolution drift across
    platforms.
  suggested_op: file_loaded_template_name
  suggested_sink_family: template_render

- file: vulnerable-handlebars-user-template-2.js
  role: vulnerable
  architecture: handlebars-fixed-template
  derived_from: idiomatic-handlebars-fixed-template-2.js
  license: "N/A (synthetic -- represents Handlebars' own documented,
    publicly disclosed helper-lookup gadget-chain SSTI/RCE history)"
  tutorial_or_course_project: false
  synthetic: true
  pattern: "manufactured: Handlebars.compile(userSuppliedLayout) per request"
  notes: "Manufactured per Phase 3's 'Pair generation' methodology."
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe_shared: [CWE-1336, CWE-94]
  cwe_unique: [CWE-275, CWE-269]
  cwe_rationale: >
    Shared: see idiomatic-handlebars-fixed-template-2.js above.
    Unique: CWE-275 (Permission Issues) -- documented real Handlebars
    SSTI chains use helper/property lookups to reach the JS
    `constructor`/`prototype` chain with no permission boundary of any
    kind stopping the traversal; CWE-269 (Improper Privilege Management)
    -- the compiled template executes with the same privilege as the
    rendering process itself, no reduced-privilege sandbox around it.
  suggested_op: user_supplied_template_compile
  suggested_sink_family: template_render

