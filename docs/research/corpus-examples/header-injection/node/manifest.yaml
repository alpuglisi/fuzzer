  tutorial_or_course_project: false
  synthetic: true
  pattern: "manufactured: socket.write() building the raw HTTP upgrade response line-by-line, bypassing res.setHeader()'s built-in CR/LF rejection"
  notes: "Manufactured per Phase 3's 'Pair generation' methodology."
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe_shared: [CWE-93, CWE-20]
