- file: idiomatic-nodemailer-structured-2.js
  role: idiomatic
  architecture: nodemailer-structured-options
  license: "N/A (synthetic)"
  tutorial_or_course_project: false
  synthetic: true
  pattern: "recipient/subject/body passed as structured sendMail() option properties -- Nodemailer's own MIME builder encodes these, never raw-concatenated into a header block"
  notes: "Manufactured, representing a real, common safe-Nodemailer-usage shape."
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe_shared: [CWE-93, CWE-20]
  cwe_unique: [CWE-116, CWE-650]
  cwe_rationale: >
    Shared (this cell's core class, see ../php/manifest.yaml's
    idiomatic-phpmailer-secureheader-1.php entry): CWE-93, CWE-20.
    Unique: CWE-116 (Improper Encoding or Escaping of Output) -- flagged
    as what this structured API correctly delegates to Nodemailer's own
    MIME builder rather than doing itself; CWE-1173 (Improper Use of
    Validation Framework) -- `guestEmail` is used as both the envelope
    recipient and the Reply-To value with no format validation of either,
    despite Nodemailer accepting an address-validation option this
    caller never sets.
  suggested_op: structured_mail_options
  suggested_sink_family: email_header_value

