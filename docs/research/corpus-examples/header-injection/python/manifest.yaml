# CRLF-injection class applied to an HTTP response header instead, the
# Python-language counterpart to this cell's own
# idiomatic-http-header-filtered-4.php/vulnerable-raw-socket-response-4.php
# (PHP) pair, using Flask/werkzeug's own header-writing API as the
