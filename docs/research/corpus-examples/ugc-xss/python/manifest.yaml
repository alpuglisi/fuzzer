- file: idiomatic-1.py
  role: idiomatic
  repo: jwilliamsresearch/os3-security-studio
  commit_sha: c3b995f2d0abcd3c9fcd1e2f6242eb089c84288b
  license: MIT
  license_copyright_line: "Copyright (c) 2025 James Williams"
  tutorial_or_course_project: true
  pattern: "same |safe-rendered comment field as vulnerable-1.py, but bleach.clean() sanitizes the comment on the way into storage, so the value the template later marks |safe has already been through an allowlist sanitizer"
  notes: >
    Secure sibling route to vulnerable-1.py in the same source file --
    Phase 2's closest real-world analogue to a Juliet-style matched
    good()/bad() pair. Same dual-license note and tutorial_or_course_project
    flag as vulnerable-1.py applies. Source file path in the origin repo:
    app/routes/xss.py (secure() route) plus templates/xss/secure.html.
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review confirms line 30: `comment = bleach.clean(comment,
    tags=['b', 'i', 'em', 'strong'], strip=True)` before the same
    parameterized `INSERT`, and the template fragment comment (lines
    55-59) confirms the `| safe` render shape is unchanged -- matches
    the pattern exactly (the safety comes entirely from sanitizing on
    ingest, not from changing the render step). `py_compile` parses
    clean. Bandit reports zero findings. Semgrep (local custom rule
    `py-bleach-clean-present`; registry blocked -- semgrep.dev:443
    CONNECT returns 403 via this environment's egress proxy) fires on
    line 30. No dynamic run: `bleach` is not installed in this
    environment (pip install blocked by egress policy -- confirmed via
    `python3 -c "import bleach"` raising ModuleNotFoundError), so this
    specific sanitizer call cannot actually be executed here; the Jinja2
    `|safe`-rendering half of this pair's mechanism was independently,
    dynamically confirmed via vulnerable-1.py's entry (same template
    shape, same file).
  redacted: false
  cwe: [CWE-79, CWE-116, CWE-183, CWE-85]
  cwe_shared: [CWE-79, CWE-116]
  cwe_unique: [CWE-183, CWE-85]
  cwe_rationale: >
    Shared: see vulnerable-1.py's cwe_rationale above -- same weakness
    class, the same source file's secure() sibling route.
    Unique to this entry: CWE-183 (Permissive List of Allowed Inputs) --
    bleach.clean() sanitizes via an *allowlist* of permitted tags/
    attributes (default allowlist per the pattern field), meaning the app
    explicitly supports rich-text comments; the sanitizer itself, not the
    render step, is now the security boundary, and an over-permissive
    allowlist (e.g. permitting `<a href>` without restricting the URL
    scheme) is a distinct residual risk this entry's own mitigation
    introduces, separate from the render-time |safe concern shared with
    vulnerable-1.py; CWE-85 (Doubled Character XSS Manipulations) -- HTML
    sanitizers including bleach have real, documented history of bypasses
    via double-encoding/character-doubling tricks, a distinct attack class
    an allowlist sanitizer (unlike simple escaping) is specifically
    exposed to.
  suggested_op: bleach_clean   # bleach.clean() on ingest is an allowlist
                             # HTML sanitizer, distinct from html_entity_escape
                             # (the matrix's only existing HTML-body transform,
                             # which escapes rather than sanitizes markup) --
                             # proposed as new
  suggested_sink_family: html_body

