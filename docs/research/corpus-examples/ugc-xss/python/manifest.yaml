- file: idiomatic-django-comments-1.html
  role: idiomatic
  architecture: django-contrib-comments
  repo: django/django-contrib-comments
  commit_sha: 4ad4c701f2a17ca62f040e94d73c2eb08af320e9
  license: BSD-3-Clause
  license_copyright_line: "Copyright (c) 2013, Django Software Foundation and individual contributors"
  tutorial_or_course_project: false
  pattern: "comment.comment rendered with Django's default autoescaping (no |safe, no autoescape-off block) -- the template relies entirely on Django's template-engine default rather than an explicit sanitizer call"
  notes: >
    Verbatim copy of django_comments/templates/comments/list.html from the
    pinned commit (file path unchanged in the repo). Source file path in the
    origin repo: django_comments/templates/comments/list.html.
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe: [CWE-79, CWE-116, CWE-83, CWE-838]
  cwe_shared: [CWE-79, CWE-116]
  cwe_unique: [CWE-83, CWE-838]
  cwe_rationale: >
    Shared: CWE-79 (Cross-site Scripting) is the primary weakness class;
    CWE-116 (Improper Encoding or Escaping of Output) is its listed parent
    -- documented once for this pair, see vulnerable-django-comments-1.html
    below.
    Unique to this entry, researched against the MITRE CWE index
    (https://cwe.mitre.org/data/index.html): CWE-83 (Improper Neutralization
    of Script in Attributes in a Web Page) -- the real template also
    interpolates `comment.id` directly into an HTML attribute
    (`<dt id="c{{ comment.id }}">`), a genuinely different sink context
    from the comment-body sink this pair is otherwise built around, and
    Django's default autoescape does not differentiate attribute-context
    from body-context encoding requirements; CWE-838 (Inappropriate
    Encoding for Output Context) -- this template has (at least) two
    distinct output contexts (the `id` attribute and the comment body)
    sharing one undifferentiated escaping mechanism, exactly CWE-838's
    "one encoding applied regardless of context" description.
  suggested_op: default_autoescape   # relying on the template engine's
                             # default escaping (no explicit op applied) is
                             # a distinct shape from bleach_clean (sanitizes
                             # on ingest) or html_entity_escape (explicit
                             # escape call) already in the matrix -- proposed
                             # as new since it's "no code change, rely on
                             # framework default" rather than an active
                             # transform
  suggested_sink_family: html_body

