# --- added by docs/VULN_CORPUS_SITE_ARCHITECTURE_EXPANSION_PLAN.md wave 1,
# category 2 (social/UGC), architecture: django-contrib-comments. Sourced
# from django/django-contrib-comments's own default comment-list template,
# not a teaching app -- this is the real default rendering path used by a
# production Django comments app, contrasted with the documented real-world
# anti-pattern (adding |safe to "fix" comment formatting) called out in
# Django's own template-autoescaping docs and widely repeated in Django
# tutorials/Stack Overflow answers. Commit pinned via `git ls-remote
# https://github.com/django/django-contrib-comments.git master` at
# collection time (2026-09-22).

- file: idiomatic-django-comments-1.html
  role: idiomatic
  architecture: django-contrib-comments
  repo: django/django-contrib-comments
  commit_sha: 4ad4c701f2a17ca62f040e94d73c2eb08af320e9
  license: BSD-3-Clause
  license_copyright_line: "Copyright (c) 2013, Django Software Foundation and individual contributors"
  tutorial_or_course_project: false
  pattern: "comment.comment rendered with Django's default autoescaping (no |safe, no autoescape-off block) -- the template relies entirely on Django's template-engine default rather than an explicit sanitizer call"
  notes: >
    Verbatim copy of django_comments/templates/comments/list.html from the
    pinned commit (file path unchanged in the repo). Source file path in the
    origin repo: django_comments/templates/comments/list.html.
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe: [CWE-79, CWE-80, CWE-116, CWE-838]
  cwe_rationale: >
    Researched against the MITRE CWE index for the |safe/autoescape
    mechanism this pair contrasts, not recalled: CWE-79 (Improper
    Neutralization of Input During Web Page Generation, 'Cross-site
    Scripting') is the primary weakness class; CWE-80 (Improper
    Neutralization of Script-Related HTML Tags in a Web Page, Basic XSS) is
    CWE-79's own listed child and the specific variant this reflected-HTML
    shape is; CWE-116 (Improper Encoding or Escaping of Output) is CWE-79's
    listed parent relationship -- the general output-encoding failure class
    CWE-79 instantiates for HTML specifically; CWE-838 (Inappropriate
    Encoding for Output Context) applies because |safe is literally
    choosing "no encoding" for a context (an HTML document body) that
    requires one. Same rationale applies to vulnerable-django-comments-1.html
    below, which shares this exact mechanism -- not restated there.
  suggested_op: default_autoescape   # relying on the template engine's
                             # default escaping (no explicit op applied) is
                             # a distinct shape from bleach_clean (sanitizes
                             # on ingest) or html_entity_escape (explicit
                             # escape call) already in the matrix -- proposed
                             # as new since it's "no code change, rely on
                             # framework default" rather than an active
                             # transform
  suggested_sink_family: html_body

