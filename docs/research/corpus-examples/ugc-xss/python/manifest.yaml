    (Improper Encoding or Escaping of Output) is CWE-79's listed parent.
    Unique to this entry, researched against the MITRE CWE index and not
    claimed by any other entry in this corpus: CWE-489 (Active Debug Code)
    -- per this entry's own notes, the app's `insecure()` route (this file)
    is deliberately kept live and publicly reachable alongside its
    `secure()` sibling in the very same deployed teaching app, the same
    real-world risk class as a debug/demo-only endpoint left reachable in
    a shipped instance; CWE-453 (Insecure Default Variable Initialization)
    -- per the code itself, `session.get('user_id', 1)  # Default to user 1
