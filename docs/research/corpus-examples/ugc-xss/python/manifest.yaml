# --- added by docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's Phase 3 final
# batch (group 9 of 10, closing out this manufacturing plan's ugc-xss/
# python gap). Genuinely distinct third variant: the flaw is entirely on
# the PYTHON side (Flask/Jinja2's own Markup() class wrapping a value in
# the VIEW, not a template-side `| safe` filter or a bleach.clean()-on-
# ingest idiom).

- file: vulnerable-3-altered.py
  role: vulnerable
  derived_from: vulnerable-1.py
  manufactured: true
  license: n/a (manufactured, representative of a real, documented Flask/Jinja2 anti-pattern -- markupsafe.Markup() wrapping untrusted data; no additional upstream source copied)
  notes: >
    MANUFACTURED per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
    "Per-pair mechanics" (Phase 3, final batch, group 9 of 10). Same
    weakness class as vulnerable-1.py's template-side `| safe` filter, but
    the anti-pattern lives in the VIEW function itself (wrapping every
    stored review body in Markup() before it ever reaches
    render_template()), a distinct, independently common real-world
    mistake from a template author choosing `| safe`.
  validated: true
  validated_by: [python-syntax-check, gvisor-sandbox-dynamic, manual-review]
  redacted: false
  cwe_shared: [CWE-79, CWE-116]
  cwe_unique: [CWE-285, CWE-476]
  cwe_rationale: >
    Shared: see vulnerable-1.py's cwe_rationale above.
    Unique: CWE-285 (Improper Authorization) -- every stored review body
    is wrapped in Markup() identically regardless of which user
    authored it or what trust level that user has, so a brand-new,
    unverified account's review content is marked "already safe" exactly
    like a long-standing verified reviewer's. CWE-476 (NULL Pointer
    Dereference, applied to Python's `None` analogue) -- if a review's
    `body` column is ever SQL NULL, `Markup(r[1])` receives `None`
    directly with no check, and MarkupSafe's own handling of a `None`
    argument to `Markup()` is not validated anywhere in this code path
    before the value is later used as if it were always a string.
  suggested_op: markup_wrap_on_view   # new op: genuinely distinct from
                                        # raw_concat -- the "already-safe"
                                        # marking happens in Python view
                                        # code (Markup()), not a template
                                        # filter
  suggested_sink_family: html_body   # existing family; reused

