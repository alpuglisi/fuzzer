#
# Pairing note: vulnerable-1.py and idiomatic-1.py are the vulnerable/secure
# route pair from a *single real file* deliberately built for this exact
# contrast (jwilliamsresearch/os3-security-studio's own insecure()/secure()
# routes) -- the closest thing Phase 2 found to a naturally-occurring
# Juliet-style good()/bad() pair in the wild. idiomatic-2.py is a second,
# independently-sourced idiomatic example (a real production app, not a
# teaching app) showing the same bleach.clean()-on-ingest idiom.

