  validated: true
  validated_by: [dynamic, manual-review]
  validation_notes: >
    Manual review confirms lines 32-37 (`comment = request.form.get(
    'comment', '')` inserted unsanitized via a parameterized `INSERT`,
    which correctly avoids SQLi but does nothing for XSS) and the
    template comment block at lines 58-63 (`{{ comment[0] | safe }}`) --
    matches the pattern exactly; line 33's `session.get('user_id', 1)`
    also confirms the CWE-453 claim. `py_compile` parses clean. Bandit
    reports zero findings (expected -- bandit has no rule for a
    template-level `|safe` filter, which lives in the docstring/comment-
    documented template fragment, not executable Python bandit's AST
    analysis inspects). Dynamic validation: reproduced this exact
    template fragment shape (`{{ comment | safe }}`) with a real Jinja2
    `Template` (Jinja2 3.1.6 is installed in this environment) and
    rendered it with a `<script>` payload, run under this repo's gVisor
    sandbox (`corpus_validation_sandbox.py::run_in_sandbox`,
    authorized=True, network=none): exit 0, stdout confirmed the
    `<script>` tag was rendered live/unescaped
    ("VULN (|safe) output: ...<script>alert(document.cookie)</script>...").
    This is real behavioral confirmation of Jinja2's actual `|safe`
    semantics, not just a reading of the source. Audited in
    docs/research/corpus-validation-audit.jsonl
    (fixture=/tmp/jwt_poc_sandbox/poc_jinja_safe_vs_default.py). No
    dynamic run of the Flask route itself: depends on
    `..models.database.get_db_connection` not present in this excerpt.
  redacted: false
  cwe: [CWE-79, CWE-116, CWE-489, CWE-453]
  cwe_shared: [CWE-79, CWE-116]
  cwe_unique: [CWE-489, CWE-453]
  cwe_rationale: >
    Shared (this entry's own primary class -- see this file's other
    XSS-family entries for the same shared pair, documented once per
