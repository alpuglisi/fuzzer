# Vuln-corpus Phase 2 manifest — feature: user-generated content (comments/
# reviews/forums), language: Python. See docs/VULN_CORPUS_EXPANSION_PLAN.md
# Phase 2 for the schema/rules this file follows.
#
# Pairing note: vulnerable-1.py and idiomatic-1.py are the vulnerable/secure
# route pair from a *single real file* deliberately built for this exact
# contrast (jwilliamsresearch/os3-security-studio's own insecure()/secure()
# routes) -- the closest thing Phase 2 found to a naturally-occurring
# Juliet-style good()/bad() pair in the wild. idiomatic-2.py is a second,
# independently-sourced idiomatic example (a real production app, not a
# teaching app) showing the same bleach.clean()-on-ingest idiom.

- file: vulnerable-1.py
  role: vulnerable
  repo: jwilliamsresearch/os3-security-studio
  commit_sha: c3b995f2d0abcd3c9fcd1e2f6242eb089c84288b
  license: MIT
  license_copyright_line: "Copyright (c) 2025 James Williams"
  tutorial_or_course_project: true
  pattern: "comment stored completely unsanitized; Jinja2 template renders it with the |safe filter (disables autoescaping) -> stored XSS on every later view of the comment list"
  notes: >
    Repository is dual-licensed (MIT for code, CC BY 4.0 for educational
    content per its LICENSE.md); this is source code, covered by the MIT
    grant. Deliberately built as a teaching app pairing an insecure route
    with a secure one for the same feature (see idiomatic-1.py, same file) --
    labeled tutorial_or_course_project per Phase 2's rule so Phase 3 does not
    mistake it for production-derived prevalence evidence. Source file path
    in the origin repo: app/routes/xss.py (insecure() route) plus
    templates/xss/insecure.html.
  validated: false
  validated_by: []
  redacted: false
  cwe: [CWE-79, CWE-116, CWE-489, CWE-453]
  cwe_shared: [CWE-79, CWE-116]
  cwe_unique: [CWE-489, CWE-453]
  cwe_rationale: >
    Shared (this entry's own primary class -- see this file's other
    XSS-family entries for the same shared pair, documented once per
    entry): CWE-79 (Cross-site Scripting) is the primary weakness; CWE-116
    (Improper Encoding or Escaping of Output) is CWE-79's listed parent.
    Unique to this entry, researched against the MITRE CWE index and not
    claimed by any other entry in this corpus: CWE-489 (Active Debug Code)
    -- per this entry's own notes, the app's `insecure()` route (this file)
    is deliberately kept live and publicly reachable alongside its
    `secure()` sibling in the very same deployed teaching app, the same
    real-world risk class as a debug/demo-only endpoint left reachable in
    a shipped instance; CWE-453 (Insecure Default Variable Initialization)
    -- per the code itself, `session.get('user_id', 1)  # Default to user 1
    if not logged in` initializes the security-relevant `user_id` variable
    used to attribute the stored comment to a hard-coded, valid identity
    (`1`) whenever no session is present, rather than to an anonymous/failed
    state, silently letting an unauthenticated POST write comments under a
    real user's identity.
  suggested_op: raw_concat   # Jinja2's |safe filter opts the value out of
                             # autoescaping entirely -- functionally the same
                             # "no transform at all" shape as the existing
                             # raw_concat rows, just a different per-language
                             # spelling of the same op; reused
  suggested_sink_family: html_body

- file: idiomatic-1.py
  role: idiomatic
  repo: jwilliamsresearch/os3-security-studio
  commit_sha: c3b995f2d0abcd3c9fcd1e2f6242eb089c84288b
  license: MIT
  license_copyright_line: "Copyright (c) 2025 James Williams"
  tutorial_or_course_project: true
  pattern: "same |safe-rendered comment field as vulnerable-1.py, but bleach.clean() sanitizes the comment on the way into storage, so the value the template later marks |safe has already been through an allowlist sanitizer"
  notes: >
    Secure sibling route to vulnerable-1.py in the same source file --
    Phase 2's closest real-world analogue to a Juliet-style matched
    good()/bad() pair. Same dual-license note and tutorial_or_course_project
    flag as vulnerable-1.py applies. Source file path in the origin repo:
    app/routes/xss.py (secure() route) plus templates/xss/secure.html.
  validated: false
  validated_by: []
  redacted: false
  cwe: [CWE-79, CWE-116, CWE-183, CWE-85]
  cwe_shared: [CWE-79, CWE-116]
  cwe_unique: [CWE-183, CWE-85]
  cwe_rationale: >
    Shared: see vulnerable-1.py's cwe_rationale above -- same weakness
    class, the same source file's secure() sibling route.
    Unique to this entry: CWE-183 (Permissive List of Allowed Inputs) --
    bleach.clean() sanitizes via an *allowlist* of permitted tags/
    attributes (default allowlist per the pattern field), meaning the app
    explicitly supports rich-text comments; the sanitizer itself, not the
    render step, is now the security boundary, and an over-permissive
    allowlist (e.g. permitting `<a href>` without restricting the URL
    scheme) is a distinct residual risk this entry's own mitigation
    introduces, separate from the render-time |safe concern shared with
    vulnerable-1.py; CWE-85 (Doubled Character XSS Manipulations) -- HTML
    sanitizers including bleach have real, documented history of bypasses
    via double-encoding/character-doubling tricks, a distinct attack class
    an allowlist sanitizer (unlike simple escaping) is specifically
    exposed to.
  suggested_op: bleach_clean   # bleach.clean() on ingest is an allowlist
                             # HTML sanitizer, distinct from html_entity_escape
                             # (the matrix's only existing HTML-body transform,
                             # which escapes rather than sanitizes markup) --
                             # proposed as new
  suggested_sink_family: html_body

- file: idiomatic-2.py
  role: idiomatic
  repo: hotosm/tasking-manager
  commit_sha: 2b917a14ea7b0b76935c4e2d6985ab25764cd1c9
  license: BSD-2-Clause
  license_copyright_line: "Copyright (c) 2017, Humanitarian OpenStreetMap Team"
  tutorial_or_course_project: false
  pattern: "task/comment free-text field run through bleach.clean() (default allowlist) before being persisted as task history"
  notes: >
    HOT Tasking Manager is a real, actively used production application
    (OpenStreetMap task-mapping coordination), independent of the
    os3-security-studio teaching app above -- a second, production-derived
    instance of the same bleach.clean()-on-ingest idiom, at much larger
    scale/maturity. Source file path in the origin repo:
    backend/models/postgis/task.py (TaskHistory.set_comment_action).
  validated: false
  validated_by: []
  redacted: false
  cwe: [CWE-79, CWE-116, CWE-1188, CWE-86]
  cwe_shared: [CWE-79, CWE-116]
  cwe_unique: [CWE-1188, CWE-86]
  cwe_rationale: >
    Shared: see vulnerable-1.py's cwe_rationale above -- same weakness
    class, an independent production instance of the mitigation.
    Unique to this entry: CWE-1188 (Insecure Default Initialization of
    Resource) -- the pattern field says bleach.clean() runs with its
    "default allowlist," i.e. this production app relies on the library's
    shipped default configuration, not an app-reviewed/hardened allowlist,
    as its security boundary; CWE-86 (Improper Neutralization of Invalid
    Characters in Identifiers in Web Pages) -- per the code, `bleach.clean(
    comment)` is called with no extra character-handling/normalization step
    of its own around it, so this entry's security boundary rests entirely
    on bleach's own built-in handling of invalid/incomplete multi-byte
    character sequences in tag and attribute names, a distinct, documented
    class of allowlist-sanitizer bypass (malformed/invalid characters that
    a browser still parses as markup) separate from the default-allowlist
    configuration concern above.
  suggested_op: bleach_clean   # same allowlist-sanitizer mechanism as
                             # idiomatic-1.py, a second independent instance
                             # -- reused, not a new name
  suggested_sink_family: html_body

# --- added by docs/VULN_CORPUS_SITE_ARCHITECTURE_EXPANSION_PLAN.md wave 1,
# category 2 (social/UGC), architecture: django-contrib-comments. Sourced
# from django/django-contrib-comments's own default comment-list template,
# not a teaching app -- this is the real default rendering path used by a
# production Django comments app, contrasted with the documented real-world
# anti-pattern (adding |safe to "fix" comment formatting) called out in
# Django's own template-autoescaping docs and widely repeated in Django
# tutorials/Stack Overflow answers. Commit pinned via `git ls-remote
# https://github.com/django/django-contrib-comments.git master` at
# collection time (2026-09-22).

- file: idiomatic-django-comments-1.html
  role: idiomatic
  architecture: django-contrib-comments
  repo: django/django-contrib-comments
  commit_sha: 4ad4c701f2a17ca62f040e94d73c2eb08af320e9
  license: BSD-3-Clause
  license_copyright_line: "Copyright (c) 2013, Django Software Foundation and individual contributors"
  tutorial_or_course_project: false
  pattern: "comment.comment rendered with Django's default autoescaping (no |safe, no autoescape-off block) -- the template relies entirely on Django's template-engine default rather than an explicit sanitizer call"
  notes: >
    Verbatim copy of django_comments/templates/comments/list.html from the
    pinned commit (file path unchanged in the repo). Source file path in the
    origin repo: django_comments/templates/comments/list.html.
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe: [CWE-79, CWE-116, CWE-83, CWE-838]
  cwe_shared: [CWE-79, CWE-116]
  cwe_unique: [CWE-83, CWE-838]
  cwe_rationale: >
    Shared: CWE-79 (Cross-site Scripting) is the primary weakness class;
    CWE-116 (Improper Encoding or Escaping of Output) is its listed parent
    -- documented once for this pair, see vulnerable-django-comments-1.html
    below.
    Unique to this entry, researched against the MITRE CWE index
    (https://cwe.mitre.org/data/index.html): CWE-83 (Improper Neutralization
    of Script in Attributes in a Web Page) -- the real template also
    interpolates `comment.id` directly into an HTML attribute
    (`<dt id="c{{ comment.id }}">`), a genuinely different sink context
    from the comment-body sink this pair is otherwise built around, and
    Django's default autoescape does not differentiate attribute-context
    from body-context encoding requirements; CWE-838 (Inappropriate
    Encoding for Output Context) -- this template has (at least) two
    distinct output contexts (the `id` attribute and the comment body)
    sharing one undifferentiated escaping mechanism, exactly CWE-838's
    "one encoding applied regardless of context" description.
  suggested_op: default_autoescape   # relying on the template engine's
                             # default escaping (no explicit op applied) is
                             # a distinct shape from bleach_clean (sanitizes
                             # on ingest) or html_entity_escape (explicit
                             # escape call) already in the matrix -- proposed
                             # as new since it's "no code change, rely on
                             # framework default" rather than an active
                             # transform
  suggested_sink_family: html_body

