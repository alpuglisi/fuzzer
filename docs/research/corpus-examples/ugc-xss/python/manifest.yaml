  license: MIT
  license_copyright_line: "Copyright (c) 2025 James Williams"
  tutorial_or_course_project: true
  pattern: "comment stored completely unsanitized; Jinja2 template renders it with the |safe filter (disables autoescaping) -> stored XSS on every later view of the comment list"
  notes: >
    Repository is dual-licensed (MIT for code, CC BY 4.0 for educational
