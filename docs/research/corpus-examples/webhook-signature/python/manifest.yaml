  architecture: hmac-compare-digest
  license: "N/A (synthetic)"
  tutorial_or_course_project: false
  synthetic: true
  pattern: "hmac.compare_digest() for a constant-time comparison -- Python's own hmac module documentation explicitly recommends this specifically to avoid timing attacks"
  notes: "Manufactured, representing the generic HMAC-webhook verification shape in Python, the same mitigation class as this cell's Node/PHP entries in an independently common language."
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe: [CWE-347, CWE-345, CWE-384, CWE-1025]
  cwe_shared: [CWE-347, CWE-345]
  cwe_unique: [CWE-384, CWE-1025]
  cwe_rationale: >
    Shared (this cell's core class, see ../node/manifest.yaml's
    idiomatic-stripe-validate-signature-1.ts entry): CWE-347, CWE-345.
    Unique: CWE-384 (Session Fixation) -- flagged generally as a residual
    concern for whatever session this webhook event ultimately drives a
    state change in; CWE-1025 (Comparison Using Wrong Factors) --
    `signature_header` is used directly with no check that it's a
