- file: idiomatic-timingsafe-equal-4.js
  role: idiomatic
  architecture: hmac-timingsafe-equal
  license: "N/A (synthetic)"
  tutorial_or_course_project: false
  synthetic: true
  pattern: "crypto.timingSafeEqual() with an explicit length check first -- Node's own documented API constraint (timingSafeEqual throws on mismatched buffer lengths)"
  notes: "Manufactured, representing the generic HMAC-webhook verification shape (GitHub-style), distinct from Stripe's own bundled verification API above."
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe_shared: [CWE-347, CWE-345]
  cwe_unique: [CWE-208, CWE-620]
  cwe_rationale: >
    Shared: see idiomatic-stripe-validate-signature-1.ts above.
    Unique: CWE-208 (Observable Timing Discrepancy) -- the explicit
    length-check-then-timingSafeEqual sequence is precisely the
    documented mitigation for this; CWE-620 (Unverified Password Change)
    -- flagged generally as a residual concern for whatever process
    rotates `webhookSecret`, a precondition the HMAC's own strength
    depends on.
  suggested_op: constant_time_compare
  suggested_sink_family: webhook_signature_verification

- file: vulnerable-strict-equal-4.js
  role: vulnerable
  architecture: hmac-timingsafe-equal
  derived_from: idiomatic-timingsafe-equal-4.js
  license: "N/A (synthetic -- represents the well-documented real timing-
    side-channel risk of comparing secrets with a short-circuiting `===`)"
  tutorial_or_course_project: false
  synthetic: true
  pattern: "manufactured: expected === signatureHeader -- JavaScript's short-circuiting string equality leaks a timing signal proportional to the matching-prefix length"
  notes: "Manufactured per Phase 3's 'Pair generation' methodology."
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe_shared: [CWE-347, CWE-345]
  cwe_unique: [CWE-697, CWE-571]
  cwe_rationale: >
    Shared: see idiomatic-stripe-validate-signature-1.ts above.
    Unique: CWE-697 (Incorrect Comparison) -- `===` is the wrong
    comparison operator for a secret-bearing value, independent of the
    timing question; CWE-571 (Expression is Always True) -- flagged
    generally: if `expected` and `signatureHeader` are ever both empty
    strings (a malformed-request edge case), this `===` comparison
    returns true with no signature having been checked at all.
  suggested_op: naive_string_compare
  suggested_sink_family: webhook_signature_verification
