# webhook-signature / node -- new corpus cell (CWE-347/CWE-345), per
# direct instruction to expand into classes not already in this corpus/
# lab/safety_matrix.yaml. Category 6 (fintech/payments) architecture
# research (APIs/integrations). 5 pairs across node/php/python. One real
# upstream anchor (Stripe's own webhook-verification code) plus
# manufactured pairs covering both "no verification at all" and
# "verification present but timing-unsafe" sub-shapes.

- file: idiomatic-stripe-validate-signature-1.ts
  role: idiomatic
  architecture: stripe-webhook-verification
  repo: stripe/stripe-node
  commit_sha: 9996a2d4f129c8b02f36f715b27a30c956087007
  license: MIT
  tutorial_or_course_project: false
  pattern: "validateComputedSignature(): platformFunctions.secureCompare() (constant-time) for the HMAC check, plus a separate timestamp-tolerance check to reject replayed/stale events"
  notes: >
    Verbatim excerpt (trimmed to the two checks, per this corpus's
    excerpting convention). Source file: src/Webhooks.ts. Note (from the
    real docstring, not reproduced verbatim here): timestamp verification
    is opt-in via the `tolerance` parameter in this API, not the default.
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe_shared: [CWE-347, CWE-345]
  cwe_unique: [CWE-294, CWE-636]
  cwe_rationale: >
    Shared (this cell's core class, documented once, see every other
    entry): CWE-347 (Improper Verification of Cryptographic Signature) is
    the canonical ID; CWE-345 (Insufficient Verification of Data
    Authenticity) is its general parent.
    Unique: CWE-294 (Authentication Bypass by Capture-replay) -- per this
    entry's own real docstring, timestamp/tolerance verification (the
    replay defense) is opt-in, not the default, in this exact API;
    CWE-636 (Not Failing Securely, 'Failing Open') -- a caller using this
    function without passing `tolerance` gets no replay protection at
    all, despite the function's name suggesting full validation.
  suggested_op: constant_time_signature_and_timestamp_check
  suggested_sink_family: webhook_signature_verification

