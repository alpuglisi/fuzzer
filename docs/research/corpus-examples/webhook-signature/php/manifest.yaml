  tutorial_or_course_project: false
  synthetic: true
  pattern: "manufactured: $expected == $signatureHeader -- PHP's loose equality both short-circuits (timing) and type-juggles hex-looking strings in scientific notation ('0e...') as equal numbers"
  notes: "Manufactured per Phase 3's 'Pair generation' methodology, using a real, PHP-specific, well-documented comparison-operator bypass class."
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe_shared: [CWE-347, CWE-345]
  cwe_unique: [CWE-760, CWE-480]
  cwe_rationale: >
    Shared: see idiomatic-paypal-ipn-verify-2.php above.
    Unique: CWE-760 (Use of a One-Way Hash with a Predictable Salt) --
    flagged generally as a residual HMAC-construction concern alongside
    the comparison-operator bug this entry centers on; CWE-480 (Use of
    Incorrect Operator) -- `==` instead of `hash_equals()`/`===` is
    precisely this weakness, and PHP's own documented "magic hash"
    behavior (two different hex-digest strings shaped like
    `"0e12345..."` comparing equal under `==`) is the concrete
    consequence of using the wrong operator here.
