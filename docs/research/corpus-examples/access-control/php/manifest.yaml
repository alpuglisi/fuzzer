# Access control / IDOR-BOLA corpus — PHP
# Feature: Authorization / access control (CWE-639/862/863), incl. the
# social-object variant folded into this row per the plan's boundary rule.
# See docs/VULN_CORPUS_EXPANSION_PLAN.md Phase 2 for the collection method.

- file: vulnerable-1.php
  role: vulnerable
  repo: cupengus1/vulnerable-shop
  commit_sha: 4467ed6badcaa408a82576aef15519bb608c4426
  license: MIT
  license_note: >
    No separate LICENSE file in the repo, but the README explicitly states
    "Dự án này được phân phối dưới giấy phép MIT License" (this project is
    distributed under the MIT License) with a link to the canonical MIT
    text and an MIT badge — treated as a declared license per Phase 2's
    license-handling rule, though there is no copyright-holder line to
    reproduce (README states the license, not a copyright notice).
  notes: >
    Full file copied as-is. This is a deliberately-built vulnerable-shop
    teaching repo (Vietnamese-language comments); the SAME file naturally
    contains both the active vulnerable code AND a complete, real fixed
    version of it in a commented-out block written by the same author for
    the same teaching purpose (see pattern below) — a same-file
    contrastive pair, left intact rather than split, since splitting it
    would misrepresent which block is actually live in this commit.
  pattern: >
    order_detail.php reads $_GET['id'] and queries
    "SELECT ... FROM orders o JOIN users u ... WHERE o.id = $order_id" with
    no user_id/session check at all (also raw string interpolation, a
    separate SQLi concern not the focus here) — any logged-in user can view
    any other user's order by changing ?id=. The file's own commented-out
    FIX_START/FIX_END block (left in place, inactive) shows the real
    corrected version: validates the id, reads $_SESSION['user_id'], and
    adds "AND o.user_id = ?" to the query for non-admins.
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review confirms the WHERE clause (line 22) has no user_id/session
    predicate, matching the claimed CWE-639/862 gap; the commented-out
    FIX_START block is inert (never executed). Static check: `php -l`
    parses clean. Semgrep run with a local custom rule file (registry
    packs p/php etc. are unreachable -- semgrep.dev:443 is blocked by this
    environment's egress policy, confirmed via curl 403; same restriction
    already noted elsewhere in this corpus for cwe.mitre.org) confirms the
    raw-concat SQLi taint rule fires on line 24's mysqli_query() (the
    file's own separately-noted, non-focal SQLi concern) and the
    ownership-filter heuristic rule does NOT fire anywhere in the file --
    consistent with "no ownership check" for this entry's own CWE-639/862
    claim. Psalm taint analysis was not available (not installed; npm/pip-
    style package installs are blocked by this environment's egress
    policy) and eslint-plugin-security does not apply to PHP; no dynamic
    run attempted (the fragment `require_once 'config.php'` and depends on
    a live mysqli connection/session/DB schema not present in this
    excerpt -- not a standalone-runnable harness).
  cwe_shared: [CWE-639, CWE-862]
  cwe_unique: [CWE-1041, CWE-1076]
  cwe_rationale: >
    Shared (this cell's own recurring core class): CWE-639 (Authorization Bypass
    Through User-Controlled Key), CWE-862 (Missing Authorization) --
    order_detail.php reads $_GET['id'] with no user_id/session predicate on the
    WHERE clause. Unique to this entry, researched against the MITRE CWE index and
    grounded in this file's own code (not recalled): CWE-1041 (Use of Redundant
    Code) -- the order-info and order-items markup (product
    name/price/quantity/total, order
    id/date/customer/email/status/shipping-address) is rendered TWICE in the same
    file, once in the Bootstrap card layout (lines ~109-150) and again, verbatim
    in substance, in a second `order-info-section`/`order-items-section` block
    (lines ~186-250) that appears to be leftover from an earlier template revision
    never removed; CWE-1076 (Insufficient Adherence to Expected Conventions) --
    the first (top) rendering of `full_name`/`email`/`shipping_address` correctly
    wraps each in `htmlspecialchars()` (lines 105-106, 167), but the second
    (bottom) rendering of the identical fields (lines 196, 199, 217) omits the
    escaping entirely, an inconsistent application of this file's own established
    output-encoding convention between its two duplicate sections.
  suggested_op: no_ownership_check
  suggested_sink_family: db_row_by_id_lookup

- file: vulnerable-2.php
  role: vulnerable
  repo: AhmedFatehy/E-commerce
  commit_sha: 42a5cb8157d4b25a5b20d16cf9338165be928839
  license: MIT
  copyright: "Copyright (c) 2021 Ayondip Jana"
  notes: >
    Full file copied as-is (short file). Real student e-commerce project;
    forms a matched pair with idiomatic-1.php and idiomatic-2.php (same
    shape: order fetched by a caller-supplied id with vs. without a
    session-ownership check).
  pattern: >
    process.php reads order-id from $_POST and fetches/updates the order
    ("select * from orders where id='$order_id'", later an UPDATE on the
    same id) with no check that the order belongs to $_SESSION['USER_ID'] —
    an authenticated user can complete or manipulate another user's order
    by supplying its id (also raw string interpolation; SQLi is a separate
    concern not the focus here).
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review: lines 5-20 fetch/update the order and cart/product rows
    keyed only on `$order_id`/`$_SESSION['USER_ID']` with no check that the
    order belongs to that session's user -- matches the CWE-639/862 claim.
    Semgrep (local custom rule, registry blocked -- see vulnerable-1.php's
    entry for the confirmed cwe.mitre.org-pattern network restriction)
    fires the raw-concat SQLi taint rule on every mysqli_query() call in
    the file, confirming the noted separate SQLi concern; no ownership-
    filter heuristic hit anywhere, consistent with the missing check.
    No psalm-taint (not installed, blocked by egress policy). No dynamic
    run: depends on `utility/utility.php`, a live `$con` connection and
    `$_SESSION` state not present in this excerpt.
  cwe_shared: [CWE-639, CWE-862]
  cwe_unique: [CWE-691, CWE-708]
  cwe_rationale: >
    Shared: see vulnerable-1.php's cwe_rationale above -- process.php
    fetches/updates the order keyed only on `$order_id`/`$_SESSION['USER_ID']`
    with no check the order belongs to that session's user. Unique to this entry,
    researched against the MITRE CWE index: CWE-691 (Insufficient Control Flow
    Management) -- the order-status update, the `order_time` insert, the
    cart/cart_detail deletes, and the per-item product-quantity decrement loop are
    seven-plus separate, sequential `mysqli_query()` calls with no transaction or
    other coordinating control-flow construct ensuring they either all apply or
    none do, and no return value of any of them is checked; CWE-708 (Incorrect
    Ownership Assignment) -- the cart being deleted (lines 12-15) is selected
    purely by the current session's `u_id`+`belonging_city`, with nothing
    correlating that fetched cart back to the specific `$order_id` this request is
    finalizing, so the code implicitly assigns 'the caller's one active cart in
    this city' as the owner of an order it never actually verified a relationship
    to.
  suggested_op: no_ownership_check
  suggested_sink_family: db_row_by_id_lookup

- file: idiomatic-1.php
  role: idiomatic
  repo: Jamexuu/Papernest-with-Payment
  commit_sha: 9aecc7fcd2bfcc1482c9bf19a258fa42b821d59a
  license: MIT
  copyright: "Copyright (c) 2025 James Francis Mercado"
  notes: >
    Full file copied as-is (short file, trailing HTML/markup after the PHP
    block omitted is not present — file kept whole). Clean pairing example:
    combines a parameterized query with the ownership check in one
    statement.
  pattern: >
    success.php fetches the order with a parameterized query
    "SELECT * FROM orders WHERE id = ? AND user_id = ?" passing both
    $order_id and $_SESSION['user_id'] as bind params — the ownership
    check is enforced inside the query itself, not as a separate
    after-the-fact comparison.
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review confirms line 24's `Database::fetchOne("... WHERE id = ?
    AND user_id = ?", [$order_id, $_SESSION['user_id']])` -- ownership is
    enforced in the query itself, matching the pattern. `php -l` parses
    clean. Semgrep (local custom rule; registry blocked, see
    vulnerable-1.php's entry) fires the parameterized-query INFO rule on
    lines 23/33 and the ownership-filter heuristic on line 24, and does
    NOT fire the raw-concat SQLi rule anywhere -- consistent with a clean
    parameterized, ownership-scoped query. No psalm-taint (unavailable).
    No dynamic run: depends on `backend/Database.php` and a live
    `$_SESSION`, not present in this excerpt.
  cwe_shared: [CWE-639, CWE-862]
  cwe_unique: [CWE-550, CWE-396]
  cwe_rationale: >
    Shared: see vulnerable-1.php's cwe_rationale above -- success.php enforces
    ownership inside the query itself via `WHERE id = ? AND user_id = ?`. Unique
    to this entry, researched against the MITRE CWE index: CWE-550 (Information
    Exposure Through Server Error Message) -- the `catch (Exception $e)` block at
    line 41 does `die('Error: ' . $e->getMessage())`, echoing the raw internal
    exception message (which can include database driver/query detail) directly to
    the client on any failure; CWE-396 (Declaration of Catch for Generic
    Exception) -- that same block catches the base `Exception` class, so a genuine
    DB connectivity failure, a not-found condition, and an unrelated coding bug
    are all funneled through one identical, undifferentiated handler.
  suggested_op: ownership_query_filter
  suggested_sink_family: db_row_by_id_lookup

- file: idiomatic-2.php
  role: idiomatic
  repo: decodelover/syre_bijouteries
  commit_sha: ff9069e8c569293c0583375537fe44311675439e
  license: MIT
  copyright: "Copyright (c) 2025 Syre Bijouteries"
  notes: >
    Full file copied as-is (short file). The access-control mechanism
    (ownership check) is correct, but note the query itself uses raw
    string interpolation rather than a prepared statement — a separate
    SQLi concern, out of scope for this feature's corpus, left as-is
    since Phase 2 collects real code with its real imperfections rather
    than laundering it into a textbook-clean example.
  pattern: >
    cancel-order.php's own comment says "Get order and verify ownership":
    the SELECT explicitly ANDs "user_id = " . $_SESSION['user_id'] onto the
    WHERE clause, and treats a zero-row result as "Order not found" before
    allowing the cancel action to proceed.
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review confirms line 20's `WHERE id = $order_id AND user_id = "
    . $_SESSION['user_id']` -- ownership check present, matching the
    pattern and the entry's own note that the query is raw-interpolated
    (a separate, out-of-scope SQLi concern). `php -l` parses clean.
    Semgrep (local custom rule; registry blocked, see vulnerable-1.php's
    entry) fires both the ownership-filter heuristic (line 20) and the
    raw-concat SQLi rule (lines 20, 37) -- exactly the two things this
    entry's own notes/pattern claim: correct access control, imperfect
    SQL hygiene. No psalm-taint (unavailable). No dynamic run: depends on
    `includes/config.php`/`functions.php` and a live `$conn`/`$_SESSION`.
  cwe_shared: [CWE-639, CWE-862]
  cwe_unique: [CWE-650, CWE-388]
  cwe_rationale: >
    Shared: see vulnerable-1.php's cwe_rationale above -- cancel-order.php's own
    comment "Get order and verify ownership" ANDs `user_id = $_SESSION['user_id']`
    onto the WHERE clause (the file's own noted raw-interpolation SQLi hygiene
    issue is a separate, out-of-scope concern per this entry's own notes, not
    re-claimed here). Unique to this entry, researched against the MITRE CWE
    index: CWE-650 (Trusting HTTP Permission Methods on the Server Side) -- this
    destructive order-cancellation action is triggered by a plain GET request
    (`cancel-order.php?id=...`) rather than a state-changing POST, relying on the
    request reaching this script at all as its only gate rather than on the HTTP
    method itself carrying any additional protection; CWE-388 (Error Handling) --
    line 23's `if (!$order_result || $order_result->num_rows === 0)` folds a
    genuine query failure and a legitimate zero-row result into one identical
    'Order not found' branch, with no distinction in error-handling strategy
    between the two different failure classes.
  suggested_op: ownership_query_filter
  suggested_sink_family: db_row_by_id_lookup
