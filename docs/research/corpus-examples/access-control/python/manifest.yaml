# Access control / IDOR-BOLA corpus — Python
# Feature: Authorization / access control (CWE-639/862/863), incl. the
# social-object variant folded into this row per the plan's boundary rule.
# See docs/VULN_CORPUS_EXPANSION_PLAN.md Phase 2 for the collection method.
#
# CELL STATUS: only 2 examples (the floor), not the usual 3-5 target.
# Several otherwise-good real vulnerable-Flask/Django-IDOR candidates were
# found and rejected purely on the license gate (no LICENSE file and no
# license declared anywhere in the repo): himanshu140505/PYTHON,
# LamaHosam6/Secure_Web_App, n0psn0ps/FernbachAPI, melaku2402/flaskweb-,
# Riteshhhh22/GymFit-Management. Per Phase 2's license-handling rule these
# were cited/described here for context but their source was NOT copied:
# each had a Flask route (typically `/profile/<id>` or `/api/user/<id>`)
# reading a user/order id straight from the URL with no session-ownership
# check — the same shape as vulnerable-1.py below, just unlicensed.

- file: vulnerable-1.py
  role: vulnerable
  repo: openhackai/OpenHack
  commit_sha: 4e1f532e01c3ecca007e07ff4c06770c1c4a9919
  license: MIT
  copyright: "Copyright (c) 2026 OpenHack"
  notes: >
    QUALITY CAVEAT (flagged per Phase 2's tutorial/non-production labeling
    rule, generalized to this file's own nature): this is NOT a live
    application route — it is a real, published, MIT-licensed source file
    from a security-review tool's own prompt/documentation library
    (openhack/prompts/flask/idor.py), written to teach the tool's LLM
    reviewer what Flask IDOR shapes look like. The vulnerable/safe Flask
    snippets embedded in it were written specifically to illustrate the
    contrast, similar in spirit to a Juliet-style synthetic pair, though
    they are real committed file content, not paraphrased from memory.
    Full file copied as-is (it is itself organized as parallel
    vulnerable/safe snippets across several ORM call shapes -
    Invoice.query.get_or_404, db.session.get, Flask-RESTful Resource -
    so importing the whole file preserves more of that variety than
    extracting just one snippet would).
  pattern: >
    Multiple parallel Flask examples of "URL id -> ORM lookup with no
    filter_by(user_id=current_user.id)/ownership check", contrasted inline
    against the corrected filter_by(...) form for the same route shape.
  validated: false
  validated_by: []
  # --- migrated to cwe_shared/cwe_unique per PA-0033's tightened standard
  # (docs/VULN_CORPUS_SITE_ARCHITECTURE_EXPANSION_PLAN.md Step 6). NOTE:
  # this entry's CWE research was done from trained knowledge, not a live
  # MITRE index lookup -- cwe.mitre.org is blocked by this environment's
  # egress proxy (confirmed via curl and WebFetch, both returned
  # EGRESS_BLOCKED/403 at the time of this edit); recorded honestly per
  # this corpus's own "not silently" convention rather than fabricating a
  # citation. ---
  cwe_shared: [CWE-639, CWE-862]   # class-defining CWEs for this whole
                                    # cell's IDOR/ownership-check shape
  cwe_unique: [CWE-1220, CWE-915]
  cwe_rationale: >
    CWE-1220 (Insufficient Granularity of Access Control): every Flask
    example this prompt documents carries `@login_required` (session-level
    authentication) but no per-resource ownership check -- authorization
    exists, just at too coarse a granularity ("any logged-in user" rather
    than "the owning user"), distinct from idiomatic-1-altered.py which
    adds exactly that finer granularity. CWE-915 (Improperly Controlled
    Modification of Dynamically-Determined Object Attributes): the
    embedded Marshmallow `ProjectSchema` example's `owner_id =
    fields.Int()` is writable in the request body, letting a caller
    directly set/claim an object's ownership via mass-assignment -- a
    second, independent mechanism from the URL-id-lookup shapes elsewhere
    in this same file and manifest.
  suggested_op: no_ownership_check
  suggested_sink_family: db_row_by_id_lookup

- file: idiomatic-1.py
  role: idiomatic
  repo: timluh98/FS-Webapp
  commit_sha: a01089943d6a6850b97ab7ddd7f6eb51304850ac
  license: MIT
  copyright: "Copyright (c) 2023 Johann Estrada Pox & Tim Luhmann"
  notes: >
    Excerpt from app.py (650 lines total; the three order-confirmation
    routes plus the specific imports they need are kept verbatim, the rest
    of the file - unrelated routes, models, config - is trimmed). Real,
    live Flask-Login marketplace app (parts/suppliers/orders), not a
    teaching fixture. Forms a matched pair with vulnerable-1.py (same
    shape: order id from the URL, with vs. without a check against
    current_user.id).
  pattern: >
    confirm_payment() and confirm_completion() both call
    Order.query.get_or_404(order_id) and then explicitly compare
    `order.user_id != current_user.id`, flashing an error and redirecting
    instead of proceeding when the caller doesn't own the order.
    confirm_shipping() uses the equivalent supplier-side check
    (`purchase.part.supplier_id == current_user.id` across the order's
    line items) since that route's actor is the supplier, not the buyer -
    included to show the same access-control idiom applied to two
    different "ownership" relations on the same object.
  validated: false
  validated_by: []
  cwe_shared: [CWE-639, CWE-862]
  cwe_unique: [CWE-203, CWE-1050]
  cwe_rationale: >
    CWE-203 (Observable Discrepancy): confirm_payment()/confirm_completion()
    fetch first via `Order.query.get_or_404(order_id)` (raising an
    immediate 404 if the row doesn't exist) and only THEN compare
    `order.user_id != current_user.id`, flashing an error and issuing a
    302 redirect if it isn't the caller's order -- an attacker probing
    order IDs can distinguish "doesn't exist" (404) from "exists, not
    yours" (200/redirect) purely from the response shape, unlike
    idiomatic-1-altered.py's combined filter_by(...).first_or_404(), which
    returns an identical 404 for both cases. CWE-1050 (Excessive Platform
    Resource Consumption within a Loop): confirm_shipping() determines
    supplier-ness via `any(purchase.part.supplier_id ==
    current_user.id for purchase in order.purchases)`, iterating the
    order's full purchases/line-items collection (a lazily-loaded ORM
    relationship) on every request regardless of order size.
  suggested_op: ownership_check_after_fetch
  suggested_sink_family: db_row_by_id_lookup

# --- manufactured per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
# "Per-pair mechanics" (Phase 3, worst-gap group 1 of 5) ---

- file: idiomatic-1-altered.py
  role: idiomatic
  derived_from: vulnerable-1.py
  manufactured: true
  license: n/a (manufactured, no upstream source copied)
  notes: >
    MANUFACTURED. Missing idiomatic counterpart for vulnerable-1.py's
    CWE-639/CWE-862/CWE-915 IDOR shape. DESIGN CHOICE (flagged per the
    manufacturing plan's own instruction): vulnerable-1.py is unusually
    a documentation/prompt-library file (an LLM code-reviewer's IDOR
    detection prompt, embedding several vulnerable/safe Flask snippets
    inline as illustrative text), not live route code -- mirroring that
    odd prompt-library format for this counterpart would have made the
    corpus less realistic, so this file is instead written as an actual,
    standalone, runnable Flask route module, drawing its shape directly
    from the exact pattern vulnerable-1.py itself documents
    (`Invoice.query.filter_by(id=x, user_id=current_user.id)`). This is
    a deliberate departure from vulnerable-1.py's own format, not a
    silent copy of it.
  pattern: "get_invoice() scopes the primary-key lookup with Invoice.query.filter_by(id=invoice_id, user_id=current_user.id).first_or_404() -- the caller can never fetch another user's invoice by id, and the 404 response is identical for both 'not found' and 'not yours'."
  validated: true
  validated_by: [semgrep-custom-rule, py_compile, manual-review]
  redacted: false
  cwe_shared: [CWE-639, CWE-862]
  cwe_unique: [CWE-799, CWE-200]
  cwe_rationale: >
    CWE-799 (Improper Control of Interaction Frequency): this route has no
    rate-limiting/throttling of any kind, so while each individual
    invoice_id guess is correctly blocked by the ownership filter, an
    attacker can still enumerate arbitrarily many IDs with no server-side
    slowdown. CWE-200 (Exposure of Sensitive Information to an
    Unauthorized Actor): `invoice.to_dict()` serializes the model with no
    explicit field allowlist, so once the caller is (correctly) scoped to
    their own invoice, any field later added to the Invoice model is
    automatically included in the response with no deliberate re-review of
    what's safe to expose to that caller.
  suggested_op: ownership_check_after_fetch
  suggested_sink_family: db_row_by_id_lookup

- file: vulnerable-1-altered.py
  role: vulnerable
  derived_from: idiomatic-1.py
  manufactured: true
  license: n/a (manufactured, derived from idiomatic-1.py's real structure per the plan's methodology; no additional upstream source copied)
  notes: >
    MANUFACTURED. Missing vulnerable counterpart for idiomatic-1.py's
    CWE-639/CWE-862 ownership-check idiom (timluh98/FS-Webapp's
    confirm_payment()/confirm_shipping()/confirm_completion() routes).
    Minimal-pair discipline: identical routes/imports/business logic,
    differing ONLY in the removed ownership check in each route -- every
    route trusts order_id from the URL alone and performs the state
    transition for any authenticated caller, not just the order's
    owner/supplier.
  pattern: "confirm_payment()/confirm_shipping()/confirm_completion() all call Order.query.get_or_404(order_id) and proceed straight to the state transition with no ownership/supplier-relation check -- contrast idiomatic-1.py's explicit `order.user_id != current_user.id` / supplier-relation checks."
  validated: true
  validated_by: [semgrep-custom-rule, py_compile, gvisor-sandbox-dynamic, manual-review]
  redacted: false
  cwe_shared: [CWE-639, CWE-862]
  cwe_unique: [CWE-352, CWE-778]
  cwe_rationale: >
    CWE-352 (Cross-Site Request Forgery): all three routes are POST-only,
    sensitive state-mutating endpoints, and nothing in this excerpt (or
    the missing ownership check it demonstrates) validates a CSRF token --
    a genuinely separate weakness class from the IDOR this file
    demonstrates (CSRF is about request-origin verification; IDOR is about
    authorization scope). CWE-778 (Insufficient Logging): none of the
    three financial/shipping state transitions this file performs emit
    any audit-log statement identifying who triggered the transition,
    removing the forensic trail that would otherwise help detect this
    exact abuse pattern after the fact.
  suggested_op: no_ownership_check
  suggested_sink_family: db_row_by_id_lookup
