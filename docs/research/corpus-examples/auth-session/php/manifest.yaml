- file: vulnerable-3-altered.php
  role: vulnerable
  derived_from: idiomatic-3-altered.php
  license: N/A (manufactured)
  tutorial_or_course_project: false
  pattern: "manufactured: verify_token() dispatches on the token's own header `alg` claim, including an 'alg: none' branch that performs no cryptographic check at all -- distinct from vulnerable-1.php's dead-$algs-parameter shape."
  notes: >
    Manufactured per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
    "Per-pair mechanics", as a third, distinct sub-variant of this cell's
    CWE-347/CWE-757 group (natural pair: vulnerable-1.php/idiomatic-1.php,
    real firebase/php-jwt dead-parameter history). This is a hand-rolled
    verifier where the header's own `alg` claim, not a caller-pinned
    expectation, decides how (or whether) to verify. Dynamic-execution
    differential (a forged alg:none token with an empty signature segment
    is accepted by verify_token() here) confirmed via `run_in_sandbox` --
    see CC-LAB-0227.
  validated: true
  validated_by: [manual-review, static-analysis, dynamic-sandbox]
  redacted: false
  cwe_shared: [CWE-347, CWE-757]
  cwe_unique: [CWE-345, CWE-306]
  cwe_rationale: >
    Shared (this pair's core class): CWE-347 (Improper Verification of
    Cryptographic Signature); CWE-757 (Selection of Less-Secure Algorithm
    During Negotiation) -- the attacker-supplied header directly selects
    a weaker (here, absent) verification path.
    Unique to this entry: CWE-345 (Insufficient Verification of Data
    Authenticity) -- the specific mechanism (a `switch ($header['alg'])`
    keyed directly on attacker-controlled JSON) is distinct enough from
    the shared class's general framing to warrant its own narrower ID;
    CWE-306 (Missing Authentication for Critical Function) -- the `case
    'none': break;` arm performs literally zero authentication for that
    code path, not merely a weak one, for what is otherwise this
    function's one job.
  suggested_op: jwt_alg_none_dispatch
  suggested_sink_family: jwt_signature_verification

- file: idiomatic-3-altered.php
  role: idiomatic
  license: N/A (manufactured)
  tutorial_or_course_project: false
  pattern: "manufactured: verify_token() pins EXPECTED_ALG='HS256' before ever inspecting the token, so a token's own alg claim (including 'none') can never select a weaker or absent check."
  notes: >
    Manufactured counterpart to vulnerable-3-altered.php -- differs only
    in the verification mechanism. Dynamic-execution differential
    confirmed via `run_in_sandbox` -- see CC-LAB-0227.
  validated: true
  validated_by: [manual-review, static-analysis, dynamic-sandbox]
  redacted: false
  cwe_shared: [CWE-347, CWE-757, CWE-613]
  cwe_unique: [CWE-1287, CWE-397]
  cwe_rationale: >
    Shared: CWE-347/CWE-757 as above; CWE-613 (Insufficient Session
    Expiration) added to this pair's shared set because `verify_token()`
    never inspects any expiry claim in the payload, so a token that
    passes the (now-correct) signature check is treated as valid
    indefinitely -- a property of this whole pair's design, not unique to
    one side.
    Unique to this entry: CWE-1287 (Improper Validation of Specified Type
    of Input) -- `explode('.', $token)` is destructured into exactly
    three variables via PHP list assignment with no check that exactly
    three segments were produced, so a malformed 1- or 2-part token
    yields silently-undefined offsets rather than a clean rejection;
    CWE-397 (Declaration of Throws for Generic Exception) -- every
    distinct failure reason (`unsupported alg`, `invalid signature`, the
    caller's own rejected-algorithm message) is raised as a bare
    `Exception`, giving calling code no way to distinguish a malformed
    request from a genuine forged-token attempt for security monitoring.
  suggested_op: jwt_alg_pinned
  suggested_sink_family: jwt_signature_verification

