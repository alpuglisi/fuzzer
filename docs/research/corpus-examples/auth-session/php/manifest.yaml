# auth-session / php -- Phase 2 corpus (docs/VULN_CORPUS_EXPANSION_PLAN.md)
#
# Cell status: fully populated (2 matched vulnerable/idiomatic pairs, 4 files; floor is 2,
# target 3-5). Covers two of the three vulnerability shapes named in this cell's assignment
# (JWT alg/key confusion; weak/predictable reset-token generation). No PHP example was
# collected for the third named shape (session-token generator using rand()/mt_rand() as
# the *session identifier* itself, as opposed to a password-reset token) -- real PHP
# candidates found during collection (see research notes) were either unlicensed or reused
# the same md5(uniqid(rand())) idiom already illustrated by the reset-token pair below, so
# collection stopped rather than padding with a near-duplicate shape (per the plan's
# "stop early... re-showing the same implementation shape" guidance).

- file: vulnerable-1.php
  role: vulnerable
  repo: firebase/php-jwt
  commit_sha: 10918f2a0181a53a2604c90b5904f9b33b0d3ba0
  license: BSD-3-Clause
  license_notice: "Copyright (c) 2011, Neuman Vong. All rights reserved."
  pattern: "JWT decode() accepts an $algs allow-list parameter but never checks the token header's alg against it -- only checks alg is *some* implemented algorithm. Enables algorithm/key confusion (RS256 public key replayed as an HS256 HMAC secret)."
  cve: CVE-2015-2965
  tutorial_or_course_code: false
  notes: "Commit immediately before the fix in idiomatic-1.php, same file's history. Verified via `git log --oneline -- Authentication/JWT.php` on a local clone of firebase/php-jwt."
  validated: false
  validated_by: []
  redacted: false
  cwe_shared: [CWE-347, CWE-757]
  cwe_unique: [CWE-1023, CWE-354]
  cwe_rationale: >
    Shared (this pair's core class, documented once for both entries):
    CWE-347 (Improper Verification of Cryptographic Signature) is the
    primary weakness; CWE-757 (Selection of Less-Secure Algorithm During
    Negotiation, 'Algorithm Downgrade') is the specific named CWE for an
    attacker forcing acceptance of a weaker algorithm -- exactly the
    RS256-replayed-as-HS256-secret shape.
    Unique to this entry, researched against the MITRE CWE index: CWE-1023
    (Incomplete Comparison with Missing Factors) -- the code checks that
    `alg` is *some* algorithm the library implements, but is missing the
    necessary second factor (that it's the algorithm the *caller* expects
    for this key) -- checking the wrong thing, not merely checking nothing;
    CWE-354 (Improper Validation of Integrity Check Value) -- the JWT
    signature is exactly an integrity check value, and this entry's
    validation of it is improperly implemented (it never confirms the
    check ran with the key/algorithm pairing the caller intended).
  suggested_op: jwt_alg_unchecked
  suggested_sink_family: jwt_signature_verification

- file: idiomatic-1.php
  role: idiomatic
  repo: firebase/php-jwt
  commit_sha: b2c2be6a45fda769c8c2ffe5ec4259a9d1e46e5b
  license: BSD-3-Clause
  license_notice: "Copyright (c) 2011, Neuman Vong. All rights reserved."
  pattern: "decode() now takes $allowed_algs and enforces in_array($header->alg, $allowed_algs) before verifying -- the token's claimed algorithm must be one the caller explicitly expects, not merely one the library knows how to implement."
  cve: CVE-2015-2965
  tutorial_or_course_code: false
  notes: "Direct successor commit to vulnerable-1.php in the same file's history (`git show b2c2be6a45fda769c8c2ffe5ec4259a9d1e46e5b^` == vulnerable-1.php's commit). Commit message: 'Update decode() to require allowed algorithms arg when verifying'."
  validated: false
  validated_by: []
  redacted: false
  cwe_shared: [CWE-347, CWE-757]
  cwe_unique: [CWE-284, CWE-754]
  cwe_rationale: >
    Shared: see vulnerable-1.php's cwe_rationale above.
    Unique to this entry: CWE-284 (Improper Access Control) -- the fix
    shifts responsibility to the *caller*, who must now supply a correctly-
    scoped `$allowed_algs`; the fix's real-world correctness now depends on
    every caller configuring this correctly, a distinct residual concern
    from the library-internal bug it closes; CWE-754 (Improper Check for
    Unusual or Exceptional Conditions) -- `decode()` throws typed
    exceptions on failure (e.g. a signature mismatch); a caller that
    doesn't catch and handle the specific exception type correctly can
    still fail open, a concern this fix's own design doesn't resolve on
    its own.
  suggested_op: jwt_alg_allowlist
  suggested_sink_family: jwt_signature_verification

- file: vulnerable-2.php
  role: vulnerable
  repo: InvoicePlane/InvoicePlane
  commit_sha: a479033943de0de61b62743fd6abb6d277b69f2d
  license: MIT
  license_notice: "Copyright (c) 2012-2014 InvoicePlane.com (LICENSE.txt; the InvoicePlane name/logo carry a separate, narrower trademark restriction not implicated by copying this source excerpt)."
  pattern: "Password-reset token is md5(time() . $email . salt()) -- built mostly from attacker-known/guessable inputs (the target's own email, a coarse timestamp) rather than a CSPRNG."
  cve: CVE-2021-29023
  tutorial_or_course_code: false
  notes: "Excerpted (not the full controller class) from Sessions::forgotPassword(); trimmed the bot-detection/rate-limiting/mail-sending branches as unrelated to the token weakness. Commit is the parent of aeddda43... (idiomatic-2.php) in the same file's history."
  validated: false
  validated_by: []
  redacted: false
  cwe_shared: [CWE-330, CWE-640]
  cwe_unique: [CWE-328, CWE-760]
  cwe_rationale: >
    Shared (this pair's core class): CWE-330 (Use of Insufficiently Random
    Values); CWE-640 (Weak Password Recovery Mechanism for Forgotten
    Password), since this is specifically a password-reset token.
    Unique to this entry, researched against the MITRE CWE index -- a
    distinct concern from the *predictability* of the inputs: CWE-328 (Use
    of Weak Hash) -- MD5 is a broken hash for any security purpose
    regardless of input quality, an independent weakness even if the
    inputs were random; CWE-760 (Use of a One-Way Hash with a Predictable
    Salt) -- `salt()` is called with no per-token/per-user variation shown;
    if it returns a static, application-wide value, one derived salt
    compromises every token's remaining entropy identically.
  suggested_op: predictable_token_source
  suggested_sink_family: session_token_generation

- file: idiomatic-2.php
  role: idiomatic
  repo: InvoicePlane/InvoicePlane
  commit_sha: aeddda4397395eb63b2636554976add2611ad0a8
  license: MIT
  license_notice: "Copyright (c) 2012-2014 InvoicePlane.com (LICENSE.txt)."
  pattern: "Password-reset token is bin2hex(random_bytes(32)) -- a 256-bit CSPRNG-derived value with no dependency on guessable inputs."
  cve: CVE-2021-29023
  tutorial_or_course_code: false
  notes: "New application/helpers/security_helper.php plus the updated Sessions.php caller, from the commit that fixes CVE-2021-29023 (direct successor to vulnerable-2.php's commit in the same file's history). Caller excerpt included as a trailing comment block rather than the full controller method, since only the helper is new code."
  validated: false
  validated_by: []
  redacted: false
  cwe_shared: [CWE-330, CWE-640]
  cwe_unique: [CWE-598, CWE-208]
  cwe_rationale: >
    Shared: see vulnerable-2.php's cwe_rationale above.
    Unique to this entry: CWE-598 (Use of GET Request Method With Sensitive
    Query Strings) -- a 256-bit reset token, however random, is typically
    delivered as a URL in a password-reset email; if that link is a GET
    request, the token can leak via Referer headers, browser history, or
    server access logs, a concern independent of the token's own
    randomness quality; CWE-208 (Observable Timing Discrepancy) -- this
    excerpt shows correct *generation* but not the later *comparison*
    step; a non-constant-time comparison at verification time can still
    leak the token character-by-character via timing, even though
    generation here is sound.
  suggested_op: csprng_token
  suggested_sink_family: session_token_generation

# --- added by docs/VULN_CORPUS_SITE_ARCHITECTURE_EXPANSION_PLAN.md wave 2,
# category 6 (fintech/payments), architecture: firefly-blocked-account-gate.
# The idiomatic side is verbatim Firefly III core (AGPL-3.0-or-later) --
# blocked-account status is re-validated by Authenticate middleware on
# every request, not just at login (handle() calls authenticate(), which
# reaches validateBlockedUser() on each request cycle). The vulnerable side
# is a manufactured login controller where the same check runs only once,
# at login time, with no per-request middleware re-validation -- a distinct
# mechanism from this cell's existing JWT-alg and token-entropy entries, so
# new op/sink_family names are proposed rather than reused. Commit pinned
# via `git ls-remote https://github.com/firefly-iii/firefly-iii.git HEAD`
# at collection time (2026-09-22).

- file: idiomatic-firefly-blocked-check-1.php
  role: idiomatic
  architecture: firefly-blocked-account-gate
  repo: firefly-iii/firefly-iii
  commit_sha: 24dba21e4c44ebd6e41929ad4f53cd8c92ce6152
  license: AGPL-3.0-or-later
  tutorial_or_course_project: false
  pattern: "validateBlockedUser(), called from the Authenticate middleware's handle() on every request (not just at login): logs the user out and throws AuthenticationException if their account is currently marked blocked"
  notes: >
    Verbatim excerpt (single method only, per the AGPL-3.0 copyleft-
    handling rule). Source file path in the origin repo:
    app/Http/Middleware/Authenticate.php.
    **License note: AGPL-3.0-or-later (copyleft) -- see this cell's other
    AGPL notes; Step 8 of the site-architecture plan stops at the proposal
    stage for exactly this reason.**
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe_shared: [CWE-613, CWE-287, CWE-863]
  cwe_unique: [CWE-390, CWE-476]
  cwe_rationale: >
    Shared (this pair's core class, documented once): CWE-613 (Insufficient
    Session Expiration) -- a blocked account's session should logically
    terminate the moment it is blocked; CWE-287 (Improper Authentication)
    -- the session no longer reflects a valid authentication decision once
    blocked; CWE-863 (Incorrect Authorization) -- a real check exists but
    is applied at the wrong point in the request lifecycle on the
    vulnerable side.
    Unique to this entry, and grounded in a real defect this specific
    excerpt has: CWE-390 (Detection of Error Condition Without Action) --
    when `$user` is null, the method logs a warning ("User is null, throw
    exception?" -- the comment's own uncertainty, left in as-collected) but
    does not return or throw, falling through instead; CWE-476 (NULL
    Pointer Dereference) -- because of that fall-through, the final,
    unconditional `Log::debug(sprintf('User #%d is not blocked.',
    $user->id))` dereferences `$user->id` even when `$user` is null (the
    method's own `?User $user` signature explicitly allows null), a real
    latent defect distinct from the per-request-revalidation property this
    entry was collected to illustrate.
  suggested_op: per_request_status_revalidation   # distinct mechanism from
                             # this cell's jwt_alg_*/csprng_token/
                             # weak_prng_token ops -- proposed as new
  suggested_sink_family: session_authorization_state   # proposed as new;
                             # none of this cell's existing families
                             # (jwt_signature_verification,
                             # session_token_generation) fit an
                             # authorization-state-recheck shape

- file: vulnerable-firefly-blocked-check-1.php
  role: vulnerable
  architecture: firefly-blocked-account-gate
  derived_from: idiomatic-firefly-blocked-check-1.php
  repo: firefly-iii/firefly-iii
  commit_sha: 24dba21e4c44ebd6e41929ad4f53cd8c92ce6152
  license: AGPL-3.0-or-later
  tutorial_or_course_project: false
  pattern: "manufactured: LoginController::login() checks blocked status once, inline, at login time only -- no equivalent check runs on later requests in the same session, so an account blocked mid-session stays fully authorized until the session naturally expires (CWE-287/CWE-613)"
  notes: >
    Manufactured per docs/VULN_CORPUS_EXPANSION_PLAN.md Phase 3's "Pair
    generation" methodology. No dynamic-execution validation available in
    this session's environment; validated at the structural/manual-review
    tier only.
    **License note: derived from AGPL-3.0-or-later code -- see the
    idiomatic entry's license note above; the same caution applies here.**
  validated: true
  validated_by: [manual-review]
  redacted: false
  cwe_shared: [CWE-613, CWE-287, CWE-863]
  cwe_unique: [CWE-672, CWE-664]
  cwe_rationale: >
    Shared: see idiomatic-firefly-blocked-check-1.php's cwe_rationale
    above.
    Unique to this entry: CWE-672 (Operation on a Resource after
    Expiration or Release) -- the session continues to be used
    (authorized requests keep succeeding) after the account's authorized
    status has effectively been released (blocked), with nothing in this
    controller acting on that; CWE-664 (Improper Control of a Resource
    Through its Lifetime) -- the session's authorization is only
    established once, at creation (`Auth::login($user)`), with no
    mechanism controlling it across the rest of its lifetime.
  suggested_op: login_time_only_check   # proposed as new, paired with
                             # per_request_status_revalidation above
  suggested_sink_family: session_authorization_state
