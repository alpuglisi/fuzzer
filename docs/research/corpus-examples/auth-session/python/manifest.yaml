- file: vulnerable-3-altered.py
  role: vulnerable
  derived_from: idiomatic-3-altered.py
  license: N/A (manufactured)
  tutorial_or_course_code: false
  pattern: "manufactured: verify_token() dispatches on the token's own header `alg` claim, including an 'alg: none' branch that performs no cryptographic check at all -- a hand-rolled verifier, distinct from vulnerable-1.py's real PyJWK-specific algorithm-inference bug."
  notes: >
    Manufactured per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
    "Per-pair mechanics", as a third, distinct sub-variant of this cell's
    CWE-347 group (natural pair: vulnerable-1.py/idiomatic-1.py, real
    PyJWT PyJWK algorithm-inference history). This is the same class of
    bug as php's vulnerable-3-altered.php (a hand-rolled verifier
    trusting the header's own alg claim, including 'none'), in a
    different language stack, per this cell's own assignment ("same
    class, different stack"). Dynamic-execution differential (a forged
    alg:none token accepted by verify_token() here, rejected by the
    idiomatic counterpart) confirmed via `run_in_sandbox` -- see
    CC-LAB-0227.
  validated: true
  validated_by: [manual-review, static-analysis, dynamic-sandbox]
  redacted: false
  cwe_shared: [CWE-347, CWE-757]
  cwe_unique: [CWE-693, CWE-1288]
  cwe_rationale: >
    Shared (this pair's core class): CWE-347 (Improper Verification of
    Cryptographic Signature); CWE-757 (Selection of Less-Secure Algorithm
    During Negotiation) -- the attacker-supplied header directly selects
    a weaker (here, absent) verification path.
    Unique to this entry: CWE-693 (Protection Mechanism Failure) -- the
    `if/elif/else` dispatch is the function's *only* protection
    mechanism, and it fails open specifically for the 'none' arm rather
    than for a coding accident elsewhere; CWE-1288 (Improper Validation
    of Consistency within Input) -- `verify_token()` has no parameter at
    all for a caller-supplied expected algorithm, so there is no
    independent value the token's own `alg` claim could ever be checked
    for consistency against.
  suggested_op: jwt_alg_none_dispatch
  suggested_sink_family: jwt_signature_verification

