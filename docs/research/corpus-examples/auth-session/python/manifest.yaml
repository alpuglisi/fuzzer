  notes: >
    Manufactured per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
    "Per-pair mechanics", as a third, distinct sub-variant of this cell's
    CWE-330/CWE-338 group (natural pair: vulnerable-2.py/idiomatic-2.py,
    real DOAJ login-code history). Dynamic-execution differential
    (seeding Python's module-level `random` PRNG to the same state
    before two calls reproduces the identical token; the idiomatic
    `secrets`-based token shows no such reproducibility) confirmed via
    `run_in_sandbox` -- see CC-LAB-0227.
  validated: true
  validated_by: [manual-review, static-analysis, dynamic-sandbox]
  redacted: false
  cwe_shared: [CWE-330, CWE-338]
  cwe_unique: [CWE-916, CWE-336]
  cwe_rationale: >
    Shared (this pair's core class): CWE-330; CWE-338 (Python's `random`
    module -- Mersenne Twister -- is explicitly named).
    Unique to this entry: CWE-916 (Use of Password Hash With Insufficient
    Computational Effort) -- a single fast SHA-256 hash is used to
    "launder" a low-entropy `random.random()` draw into a fixed-length
    token, the same insufficient-effort-over-weak-input shape CWE-916
