  notes: "Same file and commit as vulnerable-2.py (a few dozen lines away, in the account-update/re-verification flow). Excerpted the token-generation-and-storage step only, trimmed from the surrounding form-attribute handling and events/flash-message calls. See vulnerable-2.py's notes on why this is a same-repo adjacent-shape contrast rather than a same-function before/after diff."
  validated: false
  validated_by: []
  redacted: false
  cwe_shared: [CWE-330, CWE-338]
  cwe_unique: [CWE-696, CWE-664]
  cwe_rationale: >
    Shared: see vulnerable-2.py's cwe_rationale above.
    Unique to this entry, grounded in code specific to this excerpt (not
    present in vulnerable-2.py): CWE-696 (Incorrect Behavior Order) --
    `acc.clear_password()` executes first, unconditionally, before the
    reset token is generated, stored (`acc.set_reset_token(...)`), and
    saved -- if `acc.save()` or the (omitted) email-send step fails
    afterward, the account is left with no usable password and no
    delivered reset token; CWE-664 (Improper Control of a Resource
    Through its Lifetime) -- the account's password resource is put into
