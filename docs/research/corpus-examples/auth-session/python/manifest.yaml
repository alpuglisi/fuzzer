- file: vulnerable-1.py
  role: vulnerable
  repo: jpadilla/pyjwt
  commit_sha: dcc27a9d3182a2349c30b160758785c6ce7a6508
  license: MIT
  license_notice: "Copyright (c) 2015-2022 José Padilla (LICENSE file)."
  pattern: "PyJWS._verify_signature() infers `algorithms = [key.algorithm_name]` when verifying with a PyJWK and no explicit allow-list, then never checks the token header's alg against key.algorithm_name before using key.Algorithm to verify -- the allow-list check degenerates into comparing the key's algorithm against itself."
  ghsa: GHSA-jq35-7prp-9v3f
  tutorial_or_course_code: false
  notes: "Excerpted _verify_signature() plus the imports it needs, trimmed from the full api_jws.py module (encode()/decode_complete()/header-validation helpers omitted as unrelated). Commit is the parent of 95791b17... (idiomatic-1.py) in the same file's history."
  validated: false
  validated_by: []
  redacted: false
  cwe_shared: [CWE-347, CWE-1188]
  cwe_unique: [CWE-1023, CWE-706]
  cwe_rationale: >
    Shared (this pair's core class): CWE-347 (Improper Verification of
    Cryptographic Signature) is the primary weakness; CWE-1188 (Insecure
    Default Initialization of a Resource) applies to both entries because
    `key_length_msg` handling (`if self.options.get
    ("enforce_minimum_key_length", False): raise ... else: warnings.warn
    (...)`) defaults to a lenient, warn-only response to an insufficient
    key length and is unchanged by the fix.
    Unique to this entry: CWE-1023 (Incomplete Comparison with Missing
    Factors) -- `algorithms = [key.algorithm_name]` is inferred from the
    very key being verified two lines above the check
    `alg not in algorithms`, so that comparison is missing the one
    factor (an independently-sourced, caller-controlled expectation)
    that would make it meaningful; CWE-706 (Use of Incorrectly-Resolved
    Name or Reference) -- the algorithm actually used to verify
    (`alg_obj = key.Algorithm`) is resolved from the key object, while a
    separate, textually-identical-looking `alg` is resolved from the
    untrusted token header, and this function never confirms the two
    resolutions agree before using the former.
  suggested_op: jwt_alg_unchecked
  suggested_sink_family: jwt_signature_verification

- file: idiomatic-1.py
  role: idiomatic
  repo: jpadilla/pyjwt
  commit_sha: 95791b1759b8aa4f2203575d344d5c78564cdc81
  license: MIT
  license_notice: "Copyright (c) 2015-2022 José Padilla (LICENSE file)."
  pattern: "_verify_signature() now raises InvalidAlgorithmError when the token header's alg does not equal key.algorithm_name for a PyJWK, before falling through to key.Algorithm -- the key's own bound algorithm is authoritative, not just the (often key-derived) allow-list."
  ghsa: GHSA-jq35-7prp-9v3f
  tutorial_or_course_code: false
  notes: "Excerpted _verify_signature() with the same scope as vulnerable-1.py's excerpt. This commit ('Bundle security fixes and hardening into 2.13.0') also bundles unrelated fixes (JWKS-URI scheme allow-list, a detached-payload DoS fix, JWKS cache-preservation on fetch errors) -- omitted here as unrelated to the algorithm-confusion fix shown. Direct successor commit to vulnerable-1.py in the same file's history."
  validated: false
  validated_by: []
  redacted: false
  cwe_shared: [CWE-347, CWE-1188]
  cwe_unique: [CWE-668, CWE-665]
  cwe_rationale: >
    Shared: see vulnerable-1.py's cwe_rationale above -- the same
    lenient `enforce_minimum_key_length` default is unchanged in this
    fixed file.
    Unique to this entry, grounded in this fix's own new code: CWE-668
    (Exposure of Resource to Wrong Sphere) -- the new check's exception
    message, `f"Token algorithm {alg!r} does not match the key's
    algorithm {key.algorithm_name!r}"`, embeds the key's own configured
    algorithm identity directly into text that can propagate to a remote
    caller if this exception surfaces in an HTTP error response; CWE-665
    (Improper Initialization) -- the method signature's `key: ... = ""`
    default means a caller who forgets to pass `key` silently proceeds
    with an empty-string key rather than an explicit, fail-fast error at
    the call boundary.
  suggested_op: jwt_alg_allowlist
  suggested_sink_family: jwt_signature_verification

- file: vulnerable-2.py
  role: vulnerable
  repo: DOAJ/doaj
  commit_sha: db2511f61e9033d10a3ea6d9fc90fa122b9e068a
  license: Apache-2.0
  license_notice: "Apache License, Version 2.0 (LICENSE file)."
  pattern: "Passwordless-login code is ''.join(str(random.randint(0, 9)) for _ in range(6)) -- Python's `random` module (Mersenne Twister) used for a security-sensitive, emailed one-time code, rather than the `secrets` module or a CSPRNG."
  tutorial_or_course_code: false
  notes: "DOAJ (Directory of Open Access Journals) is a real, long-running, in-production nonprofit codebase, not a tutorial. Excerpted handle_login_code_request() only, trimmed from the full account.py view module. This is NOT the same code path as idiomatic-2.py's password-reset token (that one, in the same file, already uses uuid4()) -- it's DOAJ's separate passwordless-login-code feature, included here as the weak-PRNG-token contrast within the same file/commit rather than a literal before/after diff of one function. Flagged explicitly per the plan's pairing-requirement note: record honestly rather than force an artificial same-function pair."
  validated: false
  validated_by: []
  redacted: false
  cwe_shared: [CWE-330, CWE-338]
  cwe_unique: [CWE-307, CWE-311]
  cwe_rationale: >
    Shared (this pair's core class): CWE-330 (Use of Insufficiently
    Random Values); CWE-338 (Use of Cryptographically Weak PRNG), since
    Python's `random` module (Mersenne Twister) is explicitly named.
    Unique to this entry, grounded in this excerpt's own stated scope:
    CWE-307 (Improper Restriction of Excessive Authentication Attempts)
    -- this entry's own notes already flag "no visible rate-limit" on
    the verification endpoint for a 6-digit (1-in-a-million) code, so a
    weak code combined with no observed throttling in this excerpt is an
    online-brute-force path; CWE-311 (Missing Encryption of Sensitive
    Data) -- `user.set_login_code(code, timeout=LOGIN_CODE_TIMEOUT)`
    passes the raw 6-digit code straight to storage with no hashing step
    visible in this excerpt, unlike how a password would normally be
    persisted.
  suggested_op: weak_prng_token
  suggested_sink_family: session_token_generation

- file: idiomatic-2.py
  role: idiomatic
  repo: DOAJ/doaj
  commit_sha: db2511f61e9033d10a3ea6d9fc90fa122b9e068a
