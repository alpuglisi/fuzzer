# (CC-LAB-0227) for the "N of M" result.

- file: vulnerable-3-altered.js
  role: vulnerable
  derived_from: idiomatic-3-altered.js
  license: N/A (manufactured)
  tutorial_or_course_code: false
  pattern: "manufactured: verifyToken() dispatches on the token's own header `alg` claim -- when alg=HS256, it reuses the RSA *public* key (non-secret by design) as the HMAC *secret*, so anyone who knows the public key can forge an HS256-signed token this verifier accepts (CWE-347/CWE-757 algorithm confusion, RS256-vs-HS256 shape -- distinct from vulnerable-1.js's alg:none-by-default shape)."
  notes: >
    Manufactured per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
    "Per-pair mechanics", as a third, distinct sub-variant of this cell's
    CWE-347 group (natural pair: vulnerable-1.js/idiomatic-1.js, real
    node-jsonwebtoken alg:none-default history). Self-contained (Node
    `crypto` stdlib only). Dynamic-execution differential (real RSA
    keypair generated at runtime, legitimate RS256 token accepted by
    both, forged HS256-signed-with-public-key token accepted only by the
    vulnerable side) confirmed via `run_in_sandbox` -- see CC-LAB-0227.
  validated: true
  validated_by: [manual-review, static-analysis, dynamic-sandbox]
  redacted: false
  cwe_shared: [CWE-347, CWE-757]
  cwe_unique: [CWE-522, CWE-290]
  cwe_rationale: >
    Shared (this pair's core class): CWE-347 (Improper Verification of
    Cryptographic Signature); CWE-757 (Selection of Less-Secure Algorithm
    During Negotiation) -- the token's own header selects a weaker
    verification path (a symmetric HMAC check) than the asymmetric
    RS256 the key material was actually meant for.
    Unique to this entry: CWE-522 (Insufficiently Protected Credentials)
    -- the code treats `rsaPublicKeyPem` (explicitly a *public* key,
    handed to every relying party by design) as if it were a protected
    HMAC secret when `header.alg === 'HS256'`; CWE-290 (Authentication
    Bypass by Spoofing) -- the practical consequence is that an attacker
    who knows only the public key (never a secret) can spoof a validly-
    verified token for any identity/role, without ever learning any
    actual secret.
  suggested_op: jwt_rs256_hs256_confusion
  suggested_sink_family: jwt_signature_verification

- file: idiomatic-3-altered.js
  role: idiomatic
  license: N/A (manufactured)
  tutorial_or_course_code: false
  pattern: "manufactured: verifyToken() pins EXPECTED_ALG='RS256' before ever inspecting the token, so the token's own alg claim can never select which key material/algorithm family verifies it."
  notes: >
    Manufactured counterpart to vulnerable-3-altered.js -- differs only
    in the verification mechanism (algorithm pinned by the caller vs.
    read from the token). Dynamic-execution differential confirmed via
    `run_in_sandbox` -- see CC-LAB-0227.
  validated: true
  validated_by: [manual-review, static-analysis, dynamic-sandbox]
  redacted: false
  cwe_shared: [CWE-347, CWE-757]
  cwe_unique: [CWE-613, CWE-391]
  cwe_rationale: >
    Shared: see vulnerable-3-altered.js's cwe_rationale above.
    Unique to this entry, grounded in latent gaps this fix does not
    close: CWE-613 (Insufficient Session Expiration) -- `verifyToken()`
    never inspects `payload.exp`/`payload.nbf` at all, so a token that
    passes the (now-correct) signature check is treated as valid
    indefinitely; CWE-391 (Unchecked Error Condition) -- the malformed-token
    `TypeError`/`RangeError` a 1- or 2-part token produces from the later
    `Buffer.from` call (since `token.split('.')` is destructured into
    exactly three variables with no check that the split actually produced
    three segments) is never caught anywhere in `verifyToken()`, an
    unchecked error condition distinct from the shared signature-
    verification finding.
  suggested_op: jwt_alg_pinned
  suggested_sink_family: jwt_signature_verification

- file: vulnerable-4-altered.js
  role: vulnerable
  derived_from: idiomatic-4-altered.js
  license: N/A (manufactured)
  tutorial_or_course_code: false
  pattern: "manufactured: generateResetToken() returns Date.now().toString(36) + Math.random().toString(36).slice(2) -- a password-reset-token generator (distinct purpose from vulnerable-2.js's session-secret weakness) built from a coarse timestamp plus a non-cryptographic PRNG."
  notes: >
    Manufactured per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
    "Per-pair mechanics", as a third, distinct sub-variant of this cell's
    CWE-330/CWE-338 group (natural pair: vulnerable-2.js/idiomatic-2.js,
    a session *secret*). This targets a different token purpose (a
    password-reset token) with a different construction. Dynamic-
    execution differential (two tokens generated back-to-back share an
    8-character predictable prefix; idiomatic tokens share none) confirmed
    via `run_in_sandbox` -- see CC-LAB-0227.
  validated: true
  validated_by: [manual-review, static-analysis, dynamic-sandbox]
  redacted: false
  cwe_shared: [CWE-330, CWE-338]
  cwe_unique: [CWE-340, CWE-212]
  cwe_rationale: >
    Shared (this pair's core class): CWE-330; CWE-338 (Math.random() is
    explicitly Node's documented non-cryptographic PRNG).
    Unique to this entry: CWE-340 (Generation of Predictable Numbers or
    Identifiers) -- combining a coarse, externally-observable/
    approximable timestamp with a non-CSPRNG output is a textbook
    predictable-identifier construction; CWE-212 (Improper Removal of
    Sensitive Information Before Storage or Transfer) -- `Date.now().
    toString(36)` is concatenated as a literal, undisguised prefix of the
    token string itself, so the server-side timestamp it was minted at is
    embedded, unremoved, directly into the token value that is then
    transferred to and stored by the client.
  suggested_op: predictable_token_source
  suggested_sink_family: session_token_generation

- file: idiomatic-4-altered.js
  role: idiomatic
  license: N/A (manufactured)
  tutorial_or_course_code: false
  pattern: "manufactured: generateResetToken() returns crypto.randomBytes(32).toString('hex') -- Node's CSPRNG, with no timestamp or non-cryptographic PRNG involved."
  notes: >
    Manufactured counterpart to vulnerable-4-altered.js -- differs only
    in the token-generation mechanism. Dynamic-execution differential
    confirmed via `run_in_sandbox` -- see CC-LAB-0227.
  validated: true
  validated_by: [manual-review, static-analysis, dynamic-sandbox]
  redacted: false
  cwe_shared: [CWE-330, CWE-338]
  cwe_unique: [CWE-400, CWE-547]
  cwe_rationale: >
    Shared: see vulnerable-4-altered.js's cwe_rationale above.
    Unique to this entry: CWE-400 (Uncontrolled Resource Consumption) --
    `crypto.randomBytes()`'s synchronous form blocks Node's single event
    loop until enough OS entropy is available; calling it on a hot
    request path (e.g. many concurrent password-reset requests) can
    serialize/stall unrelated requests, a documented Node.js caveat for
    this exact API used this exact way; CWE-547 (Use of Hard-coded,
    Security-relevant Constant) -- the byte length `32` is embedded
    directly as a literal in the return statement rather than a named,
    centrally-configurable constant, so a future policy change (e.g. to
    48 bytes) requires finding and editing every call site individually.
  suggested_op: csprng_token
  suggested_sink_family: session_token_generation
