# auth-session / node -- Phase 2 corpus (docs/VULN_CORPUS_EXPANSION_PLAN.md)
#
# Cell status: 4 natural files (2 matched vulnerable/idiomatic pairs) plus, per
# docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's gap analysis (auth-session/node
# CWE-347: natural=1, floor=2, gap=1; auth-session/node CWE-330/CWE-338: natural=1,
# floor=2, gap=1), one manufactured pair added per group (vulnerable-3-altered.js/
# idiomatic-3-altered.js for CWE-347; vulnerable-4-altered.js/idiomatic-4-altered.js
# for CWE-330/CWE-338) -- see those entries' own notes for the distinct sub-variant
# each illustrates relative to this cell's natural pairs. Covers two of the three
# vulnerability shapes named in this cell's assignment (JWT alg:none acceptance;
# weak/predictable session-token/secret generation). No Node example was collected
# for the third named shape (password-reset-token flow not bound to session/expiry)
# -- collection stopped at 4 natural files once the two strongest, best-verified
# real pairs were in hand, per the plan's 3-5-with-floor-2 target; a reset-token-flow
# pair is a candidate for a follow-up pass rather than padding this cell with a
# weaker source.
#
# All entries below migrated from the legacy flat `cwe:` field to
# `cwe_shared:`/`cwe_unique:`/`cwe_rationale:` per PA-0033 /
# docs/VULN_CORPUS_SITE_ARCHITECTURE_EXPANSION_PLAN.md Step 6, at the same time the
# manufactured pairs were added (both new entries touched this manifest file, which
# is what the mechanical check aggregates over). CWE research for this migration was
# done from trained knowledge, not a live cwe.mitre.org lookup -- that domain is
# blocked by this environment's egress proxy (see ERROR_LOG.md, 2026-09-22 entry) --
# and should be spot-checked by a session with that access before being treated as
# authoritative.

- file: vulnerable-1.js
  role: vulnerable
  repo: auth0/node-jsonwebtoken
  commit_sha: 7e6a86b1c25e5fd05733c52c118848341aba1c4e
  license: MIT
  license_notice: "Copyright (c) 2015 Auth0, Inc. <support@auth0.com>"
  pattern: "verify() silently sets options.algorithms = ['none'] whenever the token has no signature segment and the caller passed no explicit algorithms allow-list, so an unsigned alg:none token is accepted as verified by default."
  ghsa: GHSA-8cf7-32gw-wr33
  tutorial_or_course_code: false
  notes: "Full, unmodified verify.js at the commit immediately before the fix in idiomatic-1.js, same file's history. This is the library's own module, not example/tutorial code -- it's the dependency millions of Node auth stacks import directly."
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review confirms lines 120-140: `if (!hasSignature &&
    !options.algorithms) { options.algorithms = ['none']; }` followed by
    `jws.verify(jwtString, decodedToken.header.alg, secretOrPublicKey)` --
    exactly the documented CVE-2015-9235/GHSA-8cf7-32gw-wr33 alg:none
    behavior. `node --check` parses clean. Semgrep (local custom rule
    `js-jwt-alg-none-default`; registry blocked -- semgrep.dev:443 CONNECT
    returns 403 via this environment's egress proxy, same restriction
    already documented for cwe.mitre.org elsewhere in this corpus) fires
    on line 123 exactly. eslint-plugin-security not installed (npm
    registry blocked) -- not needed here since the custom semgrep rule
    already gives concrete confirmation. No dynamic PoC run: this
    module's own `jws` dependency is not installed in this environment
    (npm install blocked), so the library cannot actually be exercised
    end-to-end here; the GHSA advisory ID already on this entry is
    independent, pre-existing confirmation of exploitability.
  redacted: false
  redacted: false
  cwe_shared: [CWE-347, CWE-1188]
  cwe_unique: [CWE-636, CWE-807]
  cwe_rationale: >
    Shared (this pair's core class): CWE-347 (Improper Verification of
    Cryptographic Signature) is the primary weakness; CWE-1188 (Insecure
    Default Initialization of a Resource) applies to both entries because
    the certificate/public-key-string heuristic at line ~127
    (`options.algorithms = secretOrPublicKey.toString().includes('BEGIN
    CERTIFICATE') ... : HS_ALGS`) that infers an allow-list when the
    caller passes none is unchanged by the fix and present in both files.
    Unique to this entry: CWE-636 (Not Failing Securely) -- the exact
    branch `if (!hasSignature && !options.algorithms) { options.algorithms
    = ['none']; }` treats a *missing* signature (which should fail
    closed) as a reason to succeed, rather than to reject; CWE-807
    (Reliance on Untrusted Inputs in a Security Decision) -- the allow-
    list this branch installs is derived from a property of the token
    itself (`hasSignature`), so the security-relevant allow-list a later
    check (`options.algorithms.indexOf(decodedToken.header.alg)`) relies
    on was populated using information already influenced by the
    untrusted token being verified, not purely from caller-supplied
    trusted configuration.
  suggested_op: jwt_alg_none_default
  suggested_sink_family: jwt_signature_verification

- file: idiomatic-1.js
  role: idiomatic
  repo: auth0/node-jsonwebtoken
  commit_sha: 834503079514b72264fd13023a3b8d648afd6a16
  license: MIT
  license_notice: "Copyright (c) 2015 Auth0, Inc. <support@auth0.com>"
  pattern: "The same branch now returns a JsonWebTokenError ('please specify \"none\" in \"algorithms\" to verify unsigned tokens') instead of defaulting to alg:none acceptance; the caller must opt in explicitly."
  ghsa: GHSA-8cf7-32gw-wr33
  tutorial_or_course_code: false
  notes: "Full, unmodified verify.js at the direct successor commit to vulnerable-1.js in the same file's history (`git show 834503...^` == vulnerable-1.js's commit). Diff between the two files is exactly one changed line (`git diff` confirmed locally)."
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review + `diff vulnerable-1.js idiomatic-1.js` confirms exactly
    one changed line, matching the entry's own claim: line 120-121 now
    `return done(new JsonWebTokenError('please specify "none" in
    "algorithms" to verify unsigned tokens'));` instead of the silent
    `options.algorithms = ['none']` assignment. `node --check` parses
    clean. Semgrep (local custom rule `js-jwt-alg-none-requires-optin`;
    registry blocked, see vulnerable-1.js's entry) fires on line 121
    exactly, and the vulnerable-side rule (`js-jwt-alg-none-default`) does
    NOT fire on this file -- confirming the fix removed exactly the
    claimed unsafe default. No dynamic run for the same `jws`-dependency-
    unavailable reason as vulnerable-1.js.
  redacted: false
  redacted: false
  cwe_shared: [CWE-347, CWE-1188]
  cwe_unique: [CWE-758, CWE-704]
  cwe_rationale: >
    Shared: see vulnerable-1.js's cwe_rationale above -- the same
    certificate/public-key-string heuristic (CWE-1188) is unchanged in
    this fixed file.
    Unique to this entry, grounded in code this fix leaves unchanged:
    CWE-758 (Reliance on Undefined, Unspecified, or Implementation-
    Defined Behavior) -- `options.algorithms` is still inferred by
    checking whether `secretOrPublicKey.toString()` merely *contains* the
    substring 'BEGIN CERTIFICATE'/'BEGIN PUBLIC KEY'/'BEGIN RSA PUBLIC
    KEY', a fragile textual heuristic rather than a robust key-type check;
    CWE-704 (Incorrect Type Conversion or Cast) -- that same line calls
    `.toString()` on `secretOrPublicKey` (whose declared type spans
    strings, Buffers, and KeyObjects) and then makes a security-relevant
    algorithm-family decision from the substring content of whatever that
    conversion happens to produce, with no check that the conversion
    actually yielded a meaningful PEM-like string.
  suggested_op: jwt_none_alg_opt_in
  suggested_sink_family: jwt_signature_verification

- file: vulnerable-2.js
  role: vulnerable
  repo: HubSpot/oauth-quickstart-nodejs
  commit_sha: 01d1b9a8c6e8144bc51edc6af0bcf2155831bda2
  license: MIT
  license_notice: "License declared as \"MIT\" in package.json; the repo has no separate LICENSE file."
  pattern: "express-session `secret` (the HMAC key that signs the session-ID cookie) is Math.random().toString(36).substring(2) -- a non-cryptographic PRNG output used as a security-critical secret."
  tutorial_or_course_code: true
  notes: "HubSpot's own official OAuth quickstart/reference sample (real README, actively maintained, last pushed within the plan's recency window). Excerpted the session middleware setup only; the surrounding OAuth token-exchange and HubSpot API-call code was omitted as unrelated to the session-secret weakness."
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review confirms line 26: `secret: Math.random().toString(36)
    .substring(2)` inside the `session({...})` config -- matches the
    pattern exactly. `node --check` parses clean. Semgrep (local custom
    rule `js-weak-random-secret`; registry blocked, see auth-session
    node/vulnerable-1.js's entry) fires on line 26 exactly. No dynamic
    run: `express-session`/`dotenv` are not installed (npm install
    blocked by egress policy), so this excerpt cannot be started as a
    live server; the CWE-330/338 claim itself does not depend on runtime
    behavior (Math.random()'s non-cryptographic nature is a
    library/language fact, not something that needs to be observed at
    runtime to confirm).
  redacted: false
  redacted: false
  cwe_shared: [CWE-330, CWE-338]
  cwe_unique: [CWE-1391, CWE-323]
  cwe_rationale: >
    Shared (this pair's core class): CWE-330 (Use of Insufficiently
    Random Values); CWE-338 (Use of Cryptographically Weak PRNG), since
    `Math.random()` is explicitly named.
    Unique to this entry: CWE-1391 (Use of Weak Credentials) -- this
    `secret` functions as the credential that authorizes every session-ID
    cookie `express-session` signs, generated with far less effective
    entropy than the HMAC scheme assumes; CWE-323 (Reusing a Nonce, Key
    or Key Pair in Encryption/Signing) -- the single value computed once,
    inline, at `session({ secret: Math.random()... })` is reused to sign
    every session for the entire process's uptime, so a single successful
    guess/recovery of this one weak value (not a per-session value)
    compromises every session the process ever issues.
  suggested_op: weak_prng_token
  suggested_sink_family: session_token_generation

- file: idiomatic-2.js
  role: idiomatic
  repo: auth0-blog/oidc-webapp
  commit_sha: d15aacb4a25bbfc1c3ac59c1e06bf4f80d36db70
  license: MIT
  license_notice: "LICENSE file present in repo (MIT)."
  pattern: "express-session `secret` (and the cookie-parser signing secret) is crypto.randomBytes(...).toString('hex') -- Node's CSPRNG -- instead of Math.random()."
  tutorial_or_course_code: true
  notes: "Auth0's own official blog-companion sample repo for an OIDC web-app walkthrough. Not the same repo as vulnerable-2.js (no naturally-occurring before/after commit pair was found for the HubSpot sample), so this is a cross-repo contrast of the same shape rather than a same-file before/after diff -- both sides are real, independently-published, currently-maintained code. Excerpted the session/cookie-parser setup only."
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review confirms lines 22/25: `cookieParser(crypto.randomBytes
    (16).toString('hex'))` and `secret: crypto.randomBytes(32)
    .toString('hex')` -- both CSPRNG-derived, matching the pattern. `node
    --check` parses clean. Semgrep (local custom rule `js-csprng-secret`;
    registry blocked, see vulnerable-1.js's entry) fires on both lines 22
    and 25, and the vulnerable-side `js-weak-random-secret` rule does NOT
    fire anywhere in this file. No dynamic run: `express-session`/
    `cookie-parser`/`body-parser` are not installed (npm blocked).
  redacted: false
  redacted: false
  cwe_shared: [CWE-330, CWE-338]
  cwe_unique: [CWE-614, CWE-1321]
  cwe_rationale: >
    Shared: see vulnerable-2.js's cwe_rationale above.
    Unique to this entry, grounded in code specific to this excerpt (not
    present in vulnerable-2.js): CWE-614 (Sensitive Cookie in HTTPS
    Session Without 'Secure' Attribute) -- `session({ secret: ...,
    resave: false, saveUninitialized: false })` passes no `cookie: {
    secure: true }` option, so express-session's own default (not
    Secure-flagged) applies to the session cookie this strong secret
    signs; CWE-1321 (Improperly Controlled Modification of Object
    Prototype Attributes ('Prototype Pollution')) -- this excerpt also
    configures `bodyParser.urlencoded({ extended: true })`, which routes
    parsing through the `qs` library's nested/bracket-notation parser, a
    well-documented historical prototype-pollution vector when unpatched
    versions are in the dependency tree.
  suggested_op: csprng_token
  suggested_sink_family: session_token_generation

