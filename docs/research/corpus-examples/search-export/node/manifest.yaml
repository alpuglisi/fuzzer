- file: vulnerable-1.js
  role: vulnerable
  repo: forcedotcom/package-manager
  commit_sha: 6373a3888566e8b7d0b841e44a4b2148ae3ba003
  license: Apache-2.0
  pattern: "ORM/query-builder MISUSE, not raw-concat-everywhere: `filterColumns` values are correctly parameter-bound ($1, $2, ... via a `values` array) into the WHERE clause, but `req.query.sort_field`/`req.query.sort_dir` are interpolated RAW into the ORDER BY clause with no allowlist check against the same QUERY_DICTIONARY the filter path already validates against -- a classic 'half the query is parameterized, the sort/order field is forgotten' real-world SQLi bug shape (ORDER-BY injection), exactly the 'beyond the trivial case' shape this cell's assignment note asked to prioritize."
  notes: "Salesforce's own open-source package-manager tool; large, real production codebase (not a tutorial). The same bug shape (safe WHERE param-binding + unsafe raw ORDER BY concat) recurs across sibling files in this repo (api/orggroups.js, api/packages.js, api/upgrades.js, api/licenses.js, api/filters.js) -- only orgs.js was collected as the representative example per the plan's 'stop early once additional candidates re-show the same shape' guidance."
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review confirms lines 81-133: `filterColumns` push
    `$${values.length}`-style bound placeholders into `whereParts` (real
    parameterization), while line 130's `sort = \`ORDER BY ${orderByField
    || "id"} ${orderByDir || "desc"}\`` interpolates the request-derived
    sort field/direction raw into the final query string with no
    allowlist check against `QUERY_DICTIONARY` -- matches the pattern
    exactly (half-parameterized query, ORDER BY forgotten). `node --check`
    parses clean. Semgrep (local custom rule `js-orderby-raw-interpolation`;
    registry blocked -- semgrep.dev:443 CONNECT returns 403 via this
    environment's egress proxy) fires on line 130, and the `values`-array
    WHERE-clause parameterization is separately confirmed by the
    `js-sqli-parameterized` INFO rule firing on the `db.query(...,
    values)` calls. No dynamic run: depends on a live PostgreSQL
    connection (`../util/pghelper`) and several sibling modules (`./
    filters`, `../api/orggroups`, `../api/sfdcconn`) not present in this
    excerpt.
  redacted: false
  # --- appended during Phase 3; migrated to cwe_shared/cwe_unique per
  # PA-0033's tightened standard. NOTE: researched from trained knowledge,
  # not a live MITRE lookup -- cwe.mitre.org is blocked by this
  # environment's egress proxy (confirmed via curl and WebFetch);
  # recorded honestly rather than fabricated. ---
  # NOTE: CWE-943 moved from cwe_unique to cwe_shared -- it was
  # independently also claimed by search-export/python's vulnerable-1.py
  # for the same "ORM escape-hatch, query-LOGIC manipulation" shape; per
  # the corpus-CWE-coverage hook, a CWE relevant to more than one entry
  # belongs in cwe_shared, not cwe_unique, on either. CWE-99 added to
  # keep this entry at >=2 genuinely entry-specific CWEs (an earlier
  # CWE-807 pick was itself found to collide with ssti/python's
  # idiomatic-4-altered.py once that manufactured entry landed in this
  # same batch, so it was swapped out here rather than reused).
  cwe_shared: [CWE-89, CWE-943]
  cwe_unique: [CWE-1109, CWE-610]
  cwe_rationale: >
    CWE-1109 (Use of Same Variable for Multiple Purposes) -- the same `params[]`
    binding array is used for both literal-value binding and (via string
    interpolation elsewhere in the same query) identifier substitution, conflating
    two encoding contexts the code never distinguishes. CWE-610 (Externally
    Controlled Reference to a Resource in Another Sphere) --
    `req.query.sort_field` names a database-column resource directly from external
    input with no allowlist, unlike the filter path's own QUERY_DICTIONARY-checked
    fields.
  suggested_op: orm_order_by_unvalidated   # new op: genuinely distinct from
                                            # raw_concat -- the surrounding
                                            # query IS parameterized elsewhere
                                            # in this same statement; the gap
                                            # is specifically an unvalidated
                                            # identifier reaching ORDER BY
  suggested_sink_family: sql_order_by_clause   # new family: existing
                                                # sql_identifier/sql_join_alias
                                                # families don't cover an
                                                # ORDER BY column/direction
                                                # position specifically

- file: vulnerable-2.js
  role: vulnerable
  repo: jeffreyPG/node-api
  commit_sha: 5183a88263859eff16980db1a1f0e446befef66a
  license: MIT
  pattern: "SSTI in a PDF/HTML report-generation pipeline (CWE-1336): user-authored report-editor content (`elementObj.content`) is compiled AS a Handlebars template via `extendedHandlebars.compile(content)` (with `@handlebars/allow-prototype-access` enabled, widening the blast radius) and then executed against the report's data object, rather than being treated as literal template data."
  notes: "File trimmed from the upstream ~3080-line api.report.server.controller.js to the imports plus the single `_getElement` function that contains the SSTI-relevant compile/execute call, per the source-quality bar (the full file is a real production report builder, not a disk dump, but copying all ~3000 lines for one illustrative sink would bloat this corpus well past its per-example intent). No license-clean idiomatic counterpart (e.g. the same app rendering user content as data into a FIXED precompiled template) was found in this repo within this collection pass -- recorded as the vulnerable-only half of this shape; see php/manifest.yaml's XXE entry for the same kind of one-sided coverage on a different CWE in this cell."
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review confirms lines 36/78-79: `extendedHandlebars =
    allowInsecurePrototypeAccess(Handlebars)` and `const template =
    extendedHandlebars.compile(content)` where `content` is
    `elementObj.content` (user-editor-authored, not a fixed template) --
    matches the pattern/CWE-1336 exactly; the imported `escapeHtml`/
    `sanitizeHtml` helper is indeed never called anywhere in
    `_getElement()`'s "p" branch (confirmed via
    `grep -n escapeHtml vulnerable-2.js`, only the definition and export
    lines match), confirming the CWE-79 unique claim. `node --check`
    parses clean. Semgrep (local custom rule
    `js-handlebars-compile-user-content`; registry blocked, see
    vulnerable-1.js's entry) fires on line 78. No dynamic run: `handlebars`/
    `@handlebars/allow-prototype-access`/`sanitize-html` are not installed
    in this environment (npm install blocked by egress policy), so this
    excerpt cannot actually be executed; this entry's own notes already
    record it as the vulnerable-only half of this shape (no idiomatic
    counterpart in this cell), so no comparative dynamic check applies
    either.
  redacted: false
  # --- appended during Phase 3; migrated to cwe_shared/cwe_unique per
  # PA-0033's tightened standard. ---
  cwe_shared: [CWE-1336]
  cwe_unique: [CWE-913, CWE-79]
  cwe_rationale: >
    CWE-913 (Improper Control of Dynamically-Managed Code Resources) -- explicitly widening Handlebars' own access to the object prototype via `allowInsecurePrototypeAccess` is an insufficiently controlled dynamically-managed code resource, granted once at module load for every subsequent template render. CWE-79 (Cross-site Scripting): the imported `sanitizeHtml`/`escapeHtml` helper is defined but never invoked in `_getElement()`'s "p" branch, and Handlebars' own default HTML-escaping only applies to `{{double-stash}}` output -- since the ENTIRE template source here is attacker content, an attacker can simply author `{{{triple-stash}}}` syntax themselves to bypass Handlebars' escaping too, giving a stored-XSS path independent of the SSTI/prototype-pollution angle.
  suggested_op: template_compile_user_content   # new op: user-authored
                                                 # content is compiled AS a
                                                 # Handlebars template rather
                                                 # than passed as template data
  suggested_sink_family: template_render_pipeline   # new family: a
                                                     # template-engine compile/
                                                     # execute step in a
                                                     # report/export pipeline
  # UPDATE: this gap is now closed. idiomatic-2-altered.js below (manufactured
  # per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md) supplies exactly the
  # secure counterpart this note originally said was missing: a FIXED,
  # developer-authored template compiled once, with user content passed only
  # as template *data*. Its `template_precompiled_fixed` op is now a real
  # `neutralises` row in `lab/safety_matrix.yaml`, paired against this
  # entry's own `template_compile_user_content` at `template_render_pipeline`.

- file: idiomatic-2-altered.js
  role: idiomatic
  derived_from: vulnerable-2.js
  manufactured: true
  license: n/a (manufactured, derived from vulnerable-2.js's real structure per the plan's methodology; no additional upstream source copied)
  notes: >
    MANUFACTURED per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
    "Per-pair mechanics" (Phase 3, worst-gap group 4 of 5). Missing
    idiomatic counterpart for vulnerable-2.js's CWE-1336 SSTI
    (jeffreyPG/node-api's _getElement(), which compiles user-authored
    report-editor content AS a Handlebars template). This cell's
    manifest.yaml note above records that no license-clean real-world
    counterpart of "the same app rendering user content as data into a
    FIXED precompiled template" was found in the original collection
    pass; this file supplies exactly that missing shape, closing the gap
    the note names (`template_precompiled_fixed`/
    `template_user_content_as_data`) rather than leaving it merely
    noted. Minimal-pair discipline: identical imports, identical `list`
    helper, identical formatEditorText(), identical overall
    _getElement() control flow/exports. The ONLY mechanism difference is
    in the "p" branch: a single FIXED, developer-authored template
    ({{content}}) is compiled ONCE at module load and the user's
    formatted content is passed into it purely as template DATA, instead
    of compiling the user content itself as the template source.
  pattern: "A module-level FIXED_PARAGRAPH_TEMPLATE = extendedHandlebars.compile(\"{{content}}\") is compiled once at load time; _getElement()'s 'p' branch calls FIXED_PARAGRAPH_TEMPLATE({ content, ...data }) instead of compiling elementObj.content itself, so user-authored Handlebars syntax in the report text renders as inert literal text (HTML-escaped) rather than executing server-side."
  validated: true
  validated_by: [semgrep-custom-rule, node-syntax-check, manual-review]
  redacted: false
  cwe_shared: [CWE-1336]
  cwe_unique: [CWE-398, CWE-1108]
  cwe_rationale: >
    CWE-398 (Poor Code Quality) -- a named sanitizer helper (`escapeHtml()`) left
    defined-but-never-invoked, whose own configuration would additionally be a
    no-op if it ever were invoked, is exactly the kind of poor-code-quality defect
    that leaves a misleading impression of protection. CWE-1108 (Excessive
    Reliance on Global Variables) -- the auto-escaped `{{content}}` placeholder
    sits in one shared, module-scope `FIXED_PARAGRAPH_TEMPLATE` constant reused
    for every render, making a future format-vs-safety tradeoff a single
    centralized risk rather than an isolated per-call one.
  suggested_op: template_precompiled_fixed   # new op, per this cell's own
                                              # manifest note above naming
                                              # exactly this as the gap --
                                              # user content passed as
                                              # template DATA into a FIXED,
                                              # precompiled template rather
                                              # than compiled as template
                                              # source itself
  suggested_sink_family: template_render_pipeline   # existing family, reused
                                                     # (see vulnerable-2.js)

- file: idiomatic-1.js
  role: idiomatic
  repo: emailparaojp/bibliotecaBrasil
  commit_sha: 24ed639f3947c60a4147cf2f403cc966572f28c6
  license: "MIT (declared explicitly in the repository's own README under a 'Licença' section: 'Distribuído sob a licença MIT'; no separate LICENSE file is present in the repo, so this is a declared-in-documentation license rather than a GitHub-detected LICENSE file, per the plan's 'no LICENSE file AND no license declared' skip condition -- a license IS declared here, so this repo was not skipped)"
  pattern: "multi-field book-search endpoint (title/author/category/publisher/language/year/availability) builds a `where[]` array of `knex.raw()`-compatible placeholder fragments ('col LIKE ?', 'col = ?') with a parallel `params[]` array, joined with ' AND ' and passed through knex.raw(sql, params) -- every user-controlled value stays a bound parameter even though the WHERE clause itself is assembled dynamically from up to 6 optional filters."
  notes: "Directly contrasts with vulnerable-1.js's mixed pattern: this file parameterizes EVERY dynamic piece of the query (filters AND the LIMIT/OFFSET values), including no unparameterized sort/order field (ordering is fixed: `ORDER BY l.titulo`), avoiding the exact gap vulnerable-1.js has."
  validated: true
  validated_by: [semgrep, manual-review]
  validation_notes: >
    Manual review confirms lines 15-59: every `where.push(...)` fragment
    uses a `?` placeholder with the matching value pushed onto `params[]`
    (never string-interpolated into the SQL text), `ORDER BY l.titulo` is
    a fixed literal (no field/direction taken from the request at all),
    and `LIMIT ? OFFSET ?` is also parameter-bound -- matches the pattern
    exactly, and directly avoids vulnerable-1.js's own gap. `node --check`
    parses clean. Semgrep (local custom rule set; registry blocked, see
    vulnerable-1.js's entry) found NO `js-orderby-raw-interpolation` hit
    anywhere in this file (the vulnerable-side rule), confirming the
    absence of the flaw; the file's `?`-placeholder style isn't matched
    by the JS `js-sqli-parameterized` INFO rule (which targets a
    different driver-call shape), so that rule is not claimed here --
    manual line-by-line confirmation of every dynamic value's binding is
    the controlling evidence. No dynamic run: depends on a live
    `../database`/knex DB connection not present in this excerpt.
  redacted: false
  # --- appended during Phase 3; migrated to cwe_shared/cwe_unique per
  # PA-0033's tightened standard. ---
  cwe_shared: [CWE-89]
  cwe_unique: [CWE-707, CWE-193]
  cwe_rationale: >
    CWE-707 (Improper Neutralization): the LIMIT/OFFSET values arrive as
    query-string parameters (strings) and are pushed into the same `params[]`
    array bound via knex.raw(sql, params) as the other filter values, with no
    explicit integer cast/parse shown before binding -- relying on the driver's
    implicit coercion for a numeric position rather than validating/normalizing
    the value itself before it reaches the query. CWE-193 (Off-by-one Error) --
    the LIMIT/OFFSET pagination values are pushed into the bound-params array with
    no boundary check of their own, the same class of off-by-one-prone
    pagination-boundary math this corpus elsewhere treats as a distinct defect
    from raw overflow.
  suggested_op: param_bind   # existing op; reused -- every dynamic WHERE/
                              # LIMIT/OFFSET value is bound via knex.raw(sql,
                              # params), same shape as the matrix's existing
                              # (param_bind, sql_string_literal) neutralises
                              # row, just in knex/JS
  suggested_sink_family: sql_string_literal   # existing family; reused for
                                               # the LIKE/`=` WHERE bindings
                                               # (the LIMIT/OFFSET/`ano`
                                               # bindings are the numeric
                                               # counterpart -- would map to
                                               # the existing sql_numeric_literal
                                               # family, noted here rather than
                                               # duplicating this entry)

