- file: vulnerable-1.js
  role: vulnerable
  repo: forcedotcom/package-manager
  commit_sha: 6373a3888566e8b7d0b841e44a4b2148ae3ba003
  license: Apache-2.0
  pattern: "ORM/query-builder MISUSE, not raw-concat-everywhere: `filterColumns` values are correctly parameter-bound ($1, $2, ... via a `values` array) into the WHERE clause, but `req.query.sort_field`/`req.query.sort_dir` are interpolated RAW into the ORDER BY clause with no allowlist check against the same QUERY_DICTIONARY the filter path already validates against -- a classic 'half the query is parameterized, the sort/order field is forgotten' real-world SQLi bug shape (ORDER-BY injection), exactly the 'beyond the trivial case' shape this cell's assignment note asked to prioritize."
  notes: "Salesforce's own open-source package-manager tool; large, real production codebase (not a tutorial). The same bug shape (safe WHERE param-binding + unsafe raw ORDER BY concat) recurs across sibling files in this repo (api/orggroups.js, api/packages.js, api/upgrades.js, api/licenses.js, api/filters.js) -- only orgs.js was collected as the representative example per the plan's 'stop early once additional candidates re-show the same shape' guidance."
  validated: false
  validated_by: []
  redacted: false
  # --- appended during Phase 3; migrated to cwe_shared/cwe_unique per
  # PA-0033's tightened standard. NOTE: researched from trained knowledge,
  # not a live MITRE lookup -- cwe.mitre.org is blocked by this
  # environment's egress proxy (confirmed via curl and WebFetch);
  # recorded honestly rather than fabricated. ---
  cwe_shared: [CWE-89]
  cwe_unique: [CWE-943, CWE-116]
  cwe_rationale: >
    CWE-943 (Improper Neutralization of Special Elements in Data Query
    Logic): this is specifically an ORM/query-builder MISUSE, not a
    raw-concat-everywhere shape -- the surrounding query's WHERE values
    are correctly parameter-bound, and only the sort_field/sort_dir
    identifiers escape that discipline, matching CWE-943's own framing of
    query-LOGIC manipulation distinct from a literal-value SQLi. CWE-116
    (Improper Encoding or Escaping of Output): SQL identifiers (column
    names) require different quoting/escaping than SQL literal values;
    the code correctly parameter-binds VALUES but has no equivalent
    identifier-quoting or allowlist mechanism for the ORDER BY column
    name it interpolates raw, an encoding-context confusion between the
    two positions.
  suggested_op: orm_order_by_unvalidated   # new op: genuinely distinct from
                                            # raw_concat -- the surrounding
                                            # query IS parameterized elsewhere
                                            # in this same statement; the gap
                                            # is specifically an unvalidated
                                            # identifier reaching ORDER BY
  suggested_sink_family: sql_order_by_clause   # new family: existing
                                                # sql_identifier/sql_join_alias
                                                # families don't cover an
                                                # ORDER BY column/direction
                                                # position specifically

- file: vulnerable-2.js
  role: vulnerable
  repo: jeffreyPG/node-api
  commit_sha: 5183a88263859eff16980db1a1f0e446befef66a
  license: MIT
  pattern: "SSTI in a PDF/HTML report-generation pipeline (CWE-1336): user-authored report-editor content (`elementObj.content`) is compiled AS a Handlebars template via `extendedHandlebars.compile(content)` (with `@handlebars/allow-prototype-access` enabled, widening the blast radius) and then executed against the report's data object, rather than being treated as literal template data."
  notes: "File trimmed from the upstream ~3080-line api.report.server.controller.js to the imports plus the single `_getElement` function that contains the SSTI-relevant compile/execute call, per the source-quality bar (the full file is a real production report builder, not a disk dump, but copying all ~3000 lines for one illustrative sink would bloat this corpus well past its per-example intent). No license-clean idiomatic counterpart (e.g. the same app rendering user content as data into a FIXED precompiled template) was found in this repo within this collection pass -- recorded as the vulnerable-only half of this shape; see php/manifest.yaml's XXE entry for the same kind of one-sided coverage on a different CWE in this cell."
  validated: false
  validated_by: []
  redacted: false
  # --- appended during Phase 3; migrated to cwe_shared/cwe_unique per
  # PA-0033's tightened standard. ---
  cwe_shared: [CWE-1336]
  cwe_unique: [CWE-1321, CWE-79]
  cwe_rationale: >
    CWE-1321 (Improperly Controlled Modification of Object Prototype
    Attributes / 'Prototype Pollution'): this file explicitly widens
    Handlebars via `@handlebars/allow-prototype-access`
    (`allowInsecurePrototypeAccess`), enabling template expressions to
    reach object-prototype properties -- a specific, independent
    escalation beyond generic SSTI, distinct from the base
    compile-user-content mechanism. CWE-79 (Cross-site Scripting): the
    imported `sanitizeHtml`/`escapeHtml` helper is defined but never
    invoked in `_getElement()`'s "p" branch, and Handlebars' own
    default HTML-escaping only applies to `{{double-stash}}` output --
    since the ENTIRE template source here is attacker content, an
    attacker can simply author `{{{triple-stash}}}` syntax themselves to
    bypass Handlebars' escaping too, giving a stored-XSS path independent
    of the SSTI/prototype-pollution angle.
  suggested_op: template_compile_user_content   # new op: user-authored
                                                 # content is compiled AS a
                                                 # Handlebars template rather
                                                 # than passed as template data
  suggested_sink_family: template_render_pipeline   # new family: a
                                                     # template-engine compile/
                                                     # execute step in a
                                                     # report/export pipeline
  # No idiomatic/secure counterpart was collected for this shape (see this
  # entry's own notes above) -- there is currently no safe-twin row to pair
  # against template_compile_user_content at template_render_pipeline; a
  # future secure counterpart would compile a FIXED, developer-authored
  # template once and pass user content only as template *data* (e.g. an
  # op like `template_precompiled_fixed` / `template_user_content_as_data`),
  # but that shape was not found in this collection pass, so no
  # suggested_op is proposed for it here -- noted as a gap, not invented.

- file: idiomatic-2-altered.js
  role: idiomatic
  derived_from: vulnerable-2.js
  manufactured: true
  license: n/a (manufactured, derived from vulnerable-2.js's real structure per the plan's methodology; no additional upstream source copied)
  notes: >
    MANUFACTURED per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
    "Per-pair mechanics" (Phase 3, worst-gap group 4 of 5). Missing
    idiomatic counterpart for vulnerable-2.js's CWE-1336 SSTI
    (jeffreyPG/node-api's _getElement(), which compiles user-authored
    report-editor content AS a Handlebars template). This cell's
    manifest.yaml note above records that no license-clean real-world
    counterpart of "the same app rendering user content as data into a
    FIXED precompiled template" was found in the original collection
    pass; this file supplies exactly that missing shape, closing the gap
    the note names (`template_precompiled_fixed`/
    `template_user_content_as_data`) rather than leaving it merely
    noted. Minimal-pair discipline: identical imports, identical `list`
    helper, identical formatEditorText(), identical overall
    _getElement() control flow/exports. The ONLY mechanism difference is
    in the "p" branch: a single FIXED, developer-authored template
    ({{content}}) is compiled ONCE at module load and the user's
    formatted content is passed into it purely as template DATA, instead
    of compiling the user content itself as the template source.
  pattern: "A module-level FIXED_PARAGRAPH_TEMPLATE = extendedHandlebars.compile(\"{{content}}\") is compiled once at load time; _getElement()'s 'p' branch calls FIXED_PARAGRAPH_TEMPLATE({ content, ...data }) instead of compiling elementObj.content itself, so user-authored Handlebars syntax in the report text renders as inert literal text (HTML-escaped) rather than executing server-side."
  validated: true
  validated_by: [semgrep-custom-rule, node-syntax-check, manual-review]
  redacted: false
  cwe_shared: [CWE-1336]
  cwe_unique: [CWE-693, CWE-838]
  cwe_rationale: >
    CWE-693 (Protection Mechanism Failure): the `escapeHtml()` helper
    (carried over unmodified from vulnerable-2.js) is still defined in
    this file and still never invoked in the "p" branch; even if it were
    invoked, its `sanitizeHtml(html, { allowedAttributes: false,
    allowedTags: false })` configuration disables tag/attribute
    filtering rather than restricting it (sanitize-html treats `false`
    as "no restriction"), so this named protection mechanism would not
    actually neutralize anything even if called -- a dead, misleadingly-
    named no-op sitting in the file. CWE-838 (Inappropriate Encoding for
    Output Context): FIXED_PARAGRAPH_TEMPLATE's `{{content}}` placeholder
    is Handlebars' auto-escaped (double-stash) form, so the literal
    `<br>` tags formatEditorText() deliberately reintroduces (to render
    line breaks as HTML) are re-escaped back to inert `&lt;br&gt;` text
    by this fix -- a real formatting regression traded for safety, since
    the escaping context (plain-text-safe HTML entity encoding) doesn't
    match formatEditorText()'s own intended output context (raw HTML).
  suggested_op: template_precompiled_fixed   # new op, per this cell's own
                                              # manifest note above naming
                                              # exactly this as the gap --
                                              # user content passed as
                                              # template DATA into a FIXED,
                                              # precompiled template rather
                                              # than compiled as template
                                              # source itself
  suggested_sink_family: template_render_pipeline   # existing family, reused
                                                     # (see vulnerable-2.js)

- file: idiomatic-1.js
  role: idiomatic
  repo: emailparaojp/bibliotecaBrasil
  commit_sha: 24ed639f3947c60a4147cf2f403cc966572f28c6
  license: "MIT (declared explicitly in the repository's own README under a 'Licença' section: 'Distribuído sob a licença MIT'; no separate LICENSE file is present in the repo, so this is a declared-in-documentation license rather than a GitHub-detected LICENSE file, per the plan's 'no LICENSE file AND no license declared' skip condition -- a license IS declared here, so this repo was not skipped)"
  pattern: "multi-field book-search endpoint (title/author/category/publisher/language/year/availability) builds a `where[]` array of `knex.raw()`-compatible placeholder fragments ('col LIKE ?', 'col = ?') with a parallel `params[]` array, joined with ' AND ' and passed through knex.raw(sql, params) -- every user-controlled value stays a bound parameter even though the WHERE clause itself is assembled dynamically from up to 6 optional filters."
  notes: "Directly contrasts with vulnerable-1.js's mixed pattern: this file parameterizes EVERY dynamic piece of the query (filters AND the LIMIT/OFFSET values), including no unparameterized sort/order field (ordering is fixed: `ORDER BY l.titulo`), avoiding the exact gap vulnerable-1.js has."
  validated: false
  validated_by: []
  redacted: false
  # --- appended during Phase 3; migrated to cwe_shared/cwe_unique per
  # PA-0033's tightened standard. ---
  cwe_shared: [CWE-89]
  cwe_unique: [CWE-704, CWE-190]
  cwe_rationale: >
    CWE-704 (Incorrect Type Conversion or Cast): the LIMIT/OFFSET values
    arrive as query-string parameters (strings) and are pushed into the
    same `params[]` array bound via knex.raw(sql, params) as the other
    filter values, with no explicit integer cast/parse shown before
    binding -- relying on the driver's implicit coercion for a numeric
    position rather than validating the type itself. CWE-190 (Integer
    Overflow or Wraparound): with no explicit bounds check on the parsed
    OFFSET value, an extremely large client-supplied offset could
    overflow/wrap in the underlying driver or database engine's own
    integer handling for that position.
  suggested_op: param_bind   # existing op; reused -- every dynamic WHERE/
                              # LIMIT/OFFSET value is bound via knex.raw(sql,
                              # params), same shape as the matrix's existing
                              # (param_bind, sql_string_literal) neutralises
                              # row, just in knex/JS
  suggested_sink_family: sql_string_literal   # existing family; reused for
                                               # the LIKE/`=` WHERE bindings
                                               # (the LIMIT/OFFSET/`ano`
                                               # bindings are the numeric
                                               # counterpart -- would map to
                                               # the existing sql_numeric_literal
                                               # family, noted here rather than
                                               # duplicating this entry)
