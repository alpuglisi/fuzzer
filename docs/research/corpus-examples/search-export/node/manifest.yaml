- file: vulnerable-3-altered.js
  role: vulnerable
  derived_from: vulnerable-1.js
  manufactured: true
  license: n/a (manufactured, derived from vulnerable-1.js's real ORM-misuse structure per the plan's methodology; no additional upstream source copied)
  notes: >
    MANUFACTURED per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
    "Per-pair mechanics" (Phase 3, final batch, group 2 of 10). Same
    underlying shape as vulnerable-1.js (WHERE clause safely parameterized,
    ORDER BY built from raw unvalidated input) but in a different,
    independently common Node ORM (Sequelize via sequelize.literal())
    rather than raw pg/knex.raw(), and a different feature (product search,
    not org listing).
  pattern: "Sequelize product-search endpoint: WHERE filters use Op.like/equality (parameterized), but `order: [[sequelize.literal(\\`${sort_field} ${sort_dir}\\`)]]` builds the ORDER BY clause from raw, unvalidated request input."
  validated: true
  validated_by: [node-syntax-check, manual-review]
  redacted: false
  cwe_shared: [CWE-89]
  cwe_unique: [CWE-606, CWE-95]
  cwe_rationale: >
    Shared (this cell's core class, see vulnerable-1.js above): CWE-89. Unique: CWE-606 (Unchecked Input for Loop Condition) -- `sort_dir` feeds directly into the ORDER BY clause with no check on the token itself against the only two valid SQL directions, an unchecked-input gap on the value steering this query-building control flow; CWE-95 (Improper Neutralization of Directives in Dynamically Evaluated Code, 'Eval Injection') -- sequelize.literal() is Sequelize's own documented escape hatch for injecting a raw SQL fragment that the query builder will NOT quote or validate in any way, functionally equivalent to eval()-ing a string into the query's structure, which is exactly what happens here with unvalidated request data.
  suggested_op: orm_order_by_unvalidated   # reused from vulnerable-1.js --
                                            # same shape (WHERE parameterized
                                            # elsewhere, ORDER BY raw), now in
                                            # Sequelize via sequelize.literal()
                                            # instead of knex/raw pg
  suggested_sink_family: sql_order_by_clause   # reused from vulnerable-1.js

