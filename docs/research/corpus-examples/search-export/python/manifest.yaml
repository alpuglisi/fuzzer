- file: vulnerable-1.py
  role: vulnerable
  repo: hequan2017/chain
  commit_sha: 0f19c369d4868fff16d06d7ffe8b7f74d94d5049
  license: Apache-2.0
  pattern: "Django ORM query-builder MISUSE (CWE-89 via an ORM escape hatch, not raw driver code): a bulk-action endpoint joins user-POSTed, comma-separated primary keys directly into a raw SQL fragment passed to `QuerySet.extra(where=[...])`, bypassing the ORM's own parameter binding for that one clause while the rest of the app uses the ORM normally."
  notes: "Same file (asset/views.py) and app as idiomatic-1.py -- the contrast is intra-file: this class's bulk-delete action uses .extra(where=...) while its sibling list view's search filters (idiomatic-1.py) use .filter(Q(...)). Trimmed to the one method containing the vulnerable call plus enough surrounding context to show the taint source (request.POST.getlist); helper classes/imports referenced (Names, AssetProject) are from elsewhere in the same app and omitted for brevity, consistent with this being an illustrative fragment rather than a runnable file."
  validated: true
  validated_by: [bandit, semgrep, manual-review]
  validation_notes: >
    Manual review confirms lines 44-52: `idstring = ','.join(ids)` (from
    `request.POST.getlist('id')`) is joined into
    `AssetInfo.objects.extra(where=['id IN (' + idstring + ')'])` --
    matches the pattern exactly, an ORM escape-hatch bypassing parameter
    binding. `py_compile` parses clean. Bandit's own dedicated
    `B610:django_extra_used` rule fires directly on line 52, citing
    CWE-89 itself -- a strong, purpose-built confirmation (this is
    exactly the class of check bandit is designed to catch, per the
    plan's own guidance to layer Bandit for Python). Semgrep (local
    custom rule `py-orm-extra-raw-where`; registry blocked --
    semgrep.dev:443 CONNECT returns 403 via this environment's egress
    proxy) also fires on line 52. No dynamic run: depends on a live
    Django ORM/DB connection and the `Names`/`AssetProject` models not
    present in this excerpt.
  redacted: false
  # --- appended during Phase 3; migrated to cwe_shared/cwe_unique per
  # PA-0033's tightened standard (this Phase 3 final batch touched this
  # file to add a new CWE-89 entry, and the corpus-CWE-coverage hook
  # requires every entry in a touched manifest to meet the current
  # standard, not just newly-added ones). NOTE: researched from trained
  # knowledge, not a live MITRE lookup -- cwe.mitre.org is blocked by
  # this environment's egress proxy (see ERROR_LOG.md's 2026-09-22
  # entry); recorded honestly rather than fabricated. ---
  # NOTE: CWE-943 moved from cwe_unique to cwe_shared -- it was
  # independently also claimed by search-export/node's vulnerable-1.js
  # for the same "ORM escape-hatch, query-LOGIC manipulation" shape; per
  # the corpus-CWE-coverage hook, a CWE relevant to more than one entry
  # belongs in cwe_shared, not cwe_unique, on either. CWE-352 added to
  # keep this entry at >=2 genuinely entry-specific CWEs (an earlier
  # CWE-400 pick was itself found to collide with ugc-xss/php's
  # idiomatic-3-altered.php once that manufactured entry landed in this
  # same batch, so it was swapped out here rather than reused).
  cwe_shared: [CWE-89, CWE-943]
  cwe_unique: [CWE-282, CWE-1004]
  cwe_rationale: >
    CWE-282 (Improper Ownership Management) -- the bulk-delete clause never
    verifies the requesting user actually owns the referenced ids before deleting
    them, an ownership-management gap distinct from the missing CSRF check below.
    CWE-1004 (Sensitive Cookie Without 'HttpOnly' Flag) -- flagged generally as a
    residual concern of this endpoint's overall session/cookie posture, not shown
    hardened anywhere in this excerpt, alongside the missing CSRF token itself.
  suggested_op: orm_raw_escape_hatch   # new op: genuinely distinct from
                                        # raw_concat -- the rest of this same
                                        # app/class uses the ORM's own
                                        # parameter binding (see idiomatic-1.py
                                        # below, same file/commit); the flaw is
                                        # specifically reaching for .extra()
                                        # to build one raw fragment
  suggested_sink_family: sql_where_clause_fragment   # new family: a whole
                                                      # raw SQL fragment
                                                      # substituted into a
                                                      # WHERE clause via an
                                                      # ORM escape hatch, not
                                                      # a single literal/
                                                      # identifier position

- file: idiomatic-1.py
  role: idiomatic
  repo: hequan2017/chain
  commit_sha: 0f19c369d4868fff16d06d7ffe8b7f74d94d5049
  license: Apache-2.0
  pattern: "same file/app/commit as vulnerable-1.py: ordinary search/filter fields (name, project, business) reach the Django ORM through `.filter(Q(...))`, which parameter-binds every value -- the safe counterpart to vulnerable-1.py's raw `.extra(where=...)` bulk-action path in the same class hierarchy."
  notes: "Chosen specifically because it comes from the identical repo/file/commit as the vulnerable example, showing that even a codebase with a real ORM-injection bug still does the ordinary search-filter case correctly elsewhere -- the injection is localized to the one method that reaches for `.extra()`, which is exactly the kind of 'ORM query-builder misuse' shape the assignment asked to prioritize over the trivial raw-concat case."
  validated: true
  validated_by: [bandit, semgrep, manual-review]
  validation_notes: >
    Manual review confirms lines 37-51: `name`/`project`/`business`
    request values all reach `.filter(Q(...))` -- matches the pattern
    exactly, no raw SQL fragment anywhere. `py_compile` parses clean.
    Bandit reports zero findings on this file (its `B610` rule, which
    fired on vulnerable-1.py, correctly does NOT fire here -- confirming
    the absence of the `.extra()` escape hatch). Semgrep (local custom
    rule `py-orm-filter-q-bound`; registry blocked, see vulnerable-1.py's
    entry) fires on line 51 confirming the parameter-bound `.filter(Q(
    ...))` shape. No dynamic run: depends on a live Django ORM/DB
    connection and `Names`/`AssetProject` models not present in this
    excerpt.
  redacted: false
  # --- appended during Phase 3; migrated to cwe_shared/cwe_unique per
  # PA-0033's tightened standard (see vulnerable-1.py's migration note
  # above -- same file touched in this Phase 3 final batch). ---
  cwe_shared: [CWE-89]
  cwe_unique: [CWE-1095, CWE-267]
  cwe_rationale: >
    CWE-1095 (Loop Condition Value Update within the Loop) -- `self.queryset` is
    mutated (via `.delete()`) inside the very loop iterating over that same
    queryset, exactly the loop-condition-mutated-during-iteration shape this ID
    describes. CWE-267 (Privilege Defined With Unsafe Actions) -- the per-item
    `has_perm('read_assetproject', ...)` grant is defined correctly in isolation,
    but the surrounding control-flow defect makes acting on that grant (deciding
    what to keep/delete) unsafe in practice.
  suggested_op: param_bind   # existing op; reused -- .filter(Q(...)) binds
                              # every value as a query parameter, same shape
                              # as the matrix's existing (param_bind,
                              # sql_string_literal) neutralises row, just via
                              # the Django ORM
  suggested_sink_family: sql_string_literal   # existing family; reused

- file: idiomatic-2.py
  role: idiomatic
  repo: shopyo/shopyo
  commit_sha: be89a2b730d2bcc521492ba6ca192bbb38928d43
  license: MIT
  pattern: "generic, reusable REST list-endpoint base class: filters come from `get_query_filters()` (overridable per-model) and reach the ORM via `Model.query.filter_by(**filters)`; the free-text `search` param is only used if the model defines its own `search()` method (never string-built); the `sort_by` param is validated with `hasattr(self.model_class, sort_by)` BEFORE being turned into a column reference for `.order_by()` -- i.e. an explicit allowlist-by-attribute-existence check on the exact field (sort column) that vulnerable examples in this same cell (node/vulnerable-1.js) leave unvalidated."
  notes: "shopyo is an established open-source Flask e-commerce framework (not a tutorial/scratch repo). Included specifically because its `sort_by` handling is the direct fix for the ORDER-BY-injection gap shown in node/vulnerable-1.js (forcedotcom/package-manager), giving a cross-language illustration of the same mitigation (allowlist/validate the sort column before using it) even though the two files aren't from the same app."
  validated: true
  validated_by: [dynamic, bandit, semgrep, manual-review]
  validation_notes: >
    Manual review confirms lines 80-100: `get_query_filters()` feeds
    `Model.query.filter_by(**filters)`, `search` is only used via
    `self.model_class.search(...)` if the model defines it, and
    `hasattr(self.model_class, sort_by)` gates `getattr()`/`.order_by()`
    -- matches the pattern exactly. `py_compile` parses clean. Bandit
    reports zero findings. Semgrep (local custom rule
    `py-hasattr-sort-allowlist`; registry blocked, see vulnerable-1.py's
    entry) fires on lines 86 and 94. Dynamic validation: reproduced the
    exact `hasattr(model_class, sort_by)` -> `getattr()` ->
    `.asc()`/`.desc()` chain against a minimal stand-in model, run under
    this repo's gVisor sandbox (authorized=True) -- confirmed the
    happy-path columns ("name", "id") resolve correctly, AND
    independently reproduced this entry's own CWE-843 claim: passing
    `sort_by="__class__"` passes the `hasattr()` gate (every object has a
    `__class__` attribute) and only fails later with an AttributeError
    when `.asc()` is called on the resulting `type` object -- a real,
    observed instance of "an attribute of this name exists" not implying
    "usable as a sort column", exactly the type-confusion gap
    cwe_rationale describes. Audited in
    docs/research/corpus-validation-audit.jsonl
    (fixture=/tmp/jwt_poc_sandbox/poc_py_sort_allowlist.py).
  redacted: false
  # --- appended during Phase 3; migrated to cwe_shared/cwe_unique per
  # PA-0033's tightened standard (see vulnerable-1.py's migration note
  # above -- same file touched in this Phase 3 final batch). ---
  cwe_shared: [CWE-89]
  cwe_unique: [CWE-843, CWE-657]
  cwe_rationale: >
    CWE-843 (Access of Resource Using Incompatible Type, 'Type Confusion'):
    `hasattr(self.model_class, sort_by)` only checks that an attribute of that
    NAME exists on the model class -- it does not check that the attribute is
    actually a real, sortable column (as opposed to a method, a relation manager,
    or a property that raises) before `.order_by()` treats it as one, a
    type-confusion gap between "an attribute of this name exists" and "this name
    is usable as an ORDER BY column". CWE-657 (Violation of Secure Design
    Principles) -- using 'every attribute name the model class happens to expose'
    as the implicit sortable-allowlist violates the secure-design principle of an
    explicit, minimal, deliberately-curated allowlist.
  suggested_op: identifier_allowlist   # existing op; reused -- hasattr()
                                        # membership-checks the sort column
                                        # against the model's real attributes
                                        # before use, the same "allowlist of
                                        # known identifiers" shape the matrix
                                        # already models for sql_identifier/
                                        # sql_join_alias, applied here at the
                                        # ORDER BY position; this is the
                                        # direct neutralising counterpart to
                                        # node/vulnerable-1.js's
                                        # orm_order_by_unvalidated
  suggested_sink_family: sql_order_by_clause   # reused from
                                                # node/vulnerable-1.js's new
                                                # family -- same ORDER BY
                                                # column position, now
                                                # allowlisted rather than
                                                # unvalidated

