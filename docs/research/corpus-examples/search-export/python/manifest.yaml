- file: vulnerable-3-altered.py
  role: vulnerable
  derived_from: vulnerable-1.py
  manufactured: true
  license: n/a (manufactured, derived from vulnerable-1.py's real "unsafe raw SQL fragment" shape per the plan's methodology, applied to a driver-level rather than ORM context; no additional upstream source copied)
  notes: >
    MANUFACTURED per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
    "Per-pair mechanics" (Phase 3, final batch, group 4 of 10). A raw
    psycopg2 driver-level order-export endpoint (no Django ORM at all) --
    both the WHERE value and the ORDER BY column arrive via f-string
    interpolation directly into the SQL text.
  pattern: "`cursor.execute(f\"...WHERE customer_name LIKE '%{search}%' ORDER BY {sort_by}\")` -- both dynamic values interpolated via an f-string before reaching cursor.execute()."
  validated: true
  validated_by: [python-syntax-check, manual-review]
  redacted: false
  cwe_shared: [CWE-89]
  cwe_unique: [CWE-625, CWE-138]
  cwe_rationale: >
    Shared (this cell's core class, see vulnerable-1.py above): CWE-89. Unique:
    CWE-625 (Permissive Regular Expression) -- `sort_by` is accepted as a bare
    identifier with no shape check (not even a loose pattern match) constraining
    it to plausible column-name characters; CWE-138 (Improper Neutralization of
    Special Elements) -- the `search` value is embedded between literal single
    quotes with no neutralization of that string-literal delimiter special element
    before use, the general special-element gap this specific SQL-string-breakout
    instance falls under.
  suggested_op: raw_concat   # f-string interpolation directly into SQL
                              # text at the driver level -- the "no
                              # transform at all" shape, but here at raw
                              # psycopg2 level rather than an ORM escape
                              # hatch (vulnerable-1.py) or PHP mysqli
                              # concat (search-export/php)
  suggested_sink_family: sql_string_literal   # existing family; reused
                                               # for the LIKE value position
                                               # (sort_by is the identifier/
                                               # ORDER BY counterpart, see
                                               # sql_order_by_clause below)

- file: idiomatic-3-altered.py
  role: idiomatic
  derived_from: vulnerable-3-altered.py
  manufactured: true
  license: n/a (manufactured, derived from vulnerable-3-altered.py's real structure per the plan's methodology; no additional upstream source copied)
  notes: >
    MANUFACTURED per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
    "Per-pair mechanics" (Phase 3, final batch, group 4 of 10).
    Minimal-pair discipline: identical function signature, identical
    query shape and column list. The ONLY mechanism difference: `search`
    is bound via psycopg2's own `%s` placeholder, and `sort_by` (an
    identifier, which no driver-level placeholder can bind) is checked
    against SORTABLE_COLUMNS before being placed in the query text.
  pattern: "`column = sort_by if sort_by in SORTABLE_COLUMNS else \"id\"` gates the ORDER BY column; `cursor.execute(query, (f\"%{search}%\",))` binds the LIKE value through psycopg2's own parameter substitution."
  validated: true
  validated_by: [python-syntax-check, manual-review]
  redacted: false
  cwe_shared: [CWE-89]
  cwe_unique: [CWE-394, CWE-1106]
  cwe_rationale: >
    Shared: see vulnerable-3-altered.py above. Unique: CWE-394 (Unexpected Status
    Code or Return Value) -- silently substituting a default `'id'` return value
    for an invalid `sort_by` is an unsignaled, undocumented return-value
    substitution rather than a detected-and-reported error condition. CWE-1106
    (Insufficient Use of Symbolic Constants) -- `SORTABLE_COLUMNS` is a raw
    hardcoded literal set kept independently of the `orders` table's real schema
    rather than derived from a single symbolic source of truth.
  suggested_op: param_bind   # existing op; reused for the LIKE value --
                              # psycopg2's own %s placeholder substitution,
                              # the driver-level counterpart to
                              # vulnerable-1.py's/idiomatic-1.py's ORM-level
                              # param_bind
  suggested_sink_family: sql_string_literal   # existing family; reused
                                               # for the LIKE value (the
                                               # ORDER BY identifier position
                                               # maps to sql_order_by_clause,
                                               # reused below)
