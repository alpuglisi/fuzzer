# Corpus cell: search/filtering + reporting/exports/dashboards (merged
# feature row, per docs/VULN_CORPUS_EXPANSION_PLAN.md Phase 1 row 5) -- Python.
#
# Pairing status: matched pair present (vulnerable-1.py / idiomatic-1.py
# are from the SAME file of the SAME app -- an ORM `.extra(where=...)`
# escape-hatch misuse next to that class's own safe `.filter(Q(...))`
# search path), plus one additional idiomatic example (idiomatic-2.py)
# showing a generic, reusable safe-filter pattern. This cell is HALF-
# POPULATED for the SSTI/XXE half of the assignment's CWE list
# (CWE-611/1336): no license-clean, real (non-tutorial, non-disk-dump)
# Python report/export pipeline reaching a template engine or XML
# parser with untrusted input was found within this collection pass --
# recorded honestly per the plan's half-populated-cell handling rather
# than padded with an unrelated shape. Candidates found (afirmeplay-edu/
# afirmeplay_backend's report_routes.py imports render_template_string
# but never calls it -- 6265-line single file, looked like a disk-dump-
# style export and was excluded on the source-quality bar; several
# other render_template_string/weasyprint report generators found in
# this pass had no declared license and were skipped) are not included.
#
# gitleaks: available (`which gitleaks` -> /usr/bin/gitleaks). Every file
