- file: vulnerable-4-altered.php
  role: vulnerable
  derived_from: vulnerable-1.php
  manufactured: true
  license: n/a (manufactured, representative of a real, documented PDO misuse; no additional upstream source copied)
  notes: >
    MANUFACTURED per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
    "Per-pair mechanics" (Phase 3, final batch, group 3 of 10). Genuinely
    distinct third variant from vulnerable-1.php/vulnerable-2.php's
    mysqli raw-concat/sanitize() shape and idiomatic-1.php's
    mysqli_real_escape_string() shape: PDO is in use, but the query text
    is still built by direct string interpolation instead of PDO's own
    bound-parameter API.
  pattern: "`$pdo->query(\"...WHERE category = '$category' AND name LIKE '%$search%'...\")` -- both dynamic values interpolated directly into the SQL text before reaching PDO::query()."
  validated: true
  validated_by: [php-lint, manual-review]
  redacted: false
  cwe_shared: [CWE-89]
  cwe_unique: [CWE-269, CWE-522]
  cwe_rationale: >
    Shared (this cell's core class, see vulnerable-1.php above): CWE-89.
    Unique: CWE-269 (Improper Privilege Management) -- flagged generally:
    nothing in this fragment establishes what privilege level (public,
    authenticated, admin) is actually required to reach this search
    endpoint at all. CWE-522 (Insufficiently Protected Credentials) --
    flagged generally: the PDO DSN/username/password this endpoint's
    database connection depends on aren't shown as sourced from a
    protected secret store anywhere in this excerpt.
  suggested_op: raw_concat   # PDO in use, but still string-interpolated --
                              # functionally the "no transform at all"
                              # shape already covered by the existing
                              # raw_concat rows, just via PDO::query()
                              # instead of mysqli
  suggested_sink_family: sql_string_literal   # existing family; reused

- file: idiomatic-4-altered.php
  role: idiomatic
  derived_from: vulnerable-4-altered.php
  manufactured: true
  license: n/a (manufactured, derived from vulnerable-4-altered.php's real PDO structure per the plan's methodology; no additional upstream source copied)
  notes: >
    MANUFACTURED per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
    "Per-pair mechanics" (Phase 3, final batch, group 3 of 10).
    Minimal-pair discipline: identical PDO connection setup, identical
    inputs, identical output shape. The ONLY mechanism difference is the
    query construction: PDO's own prepare()/execute() named-placeholder
    binding for both dynamic values, instead of string interpolation.
  pattern: "`$stmt = $pdo->prepare(\"...WHERE category = :category AND name LIKE :search...\"); $stmt->execute(['category' => $category, 'search' => '%'.$search.'%']);` -- both dynamic values bound as query parameters."
  validated: true
  validated_by: [php-lint, manual-review]
  redacted: false
  cwe_shared: [CWE-89]
  cwe_unique: [CWE-404, CWE-272]
  cwe_rationale: >
    Shared: see vulnerable-4-altered.php above.
    Unique, flagged generally as residual concerns of this
    prepare()/execute() mitigation rather than defects it fails to
    address for its own stated purpose: CWE-404 (Improper Resource
    Shutdown or Release) -- neither the prepared statement nor the PDO
    connection object is explicitly closed/unset after use, relying
    entirely on PHP's own garbage collection and request-end teardown;
    CWE-272 (Least Privilege Violation) -- flagged generally: nothing
    here confirms the database user this PDO connection authenticates as
    is restricted to read-only/SELECT privileges on the `products` table,
    which is all this search endpoint actually needs.
  suggested_op: param_bind   # existing op; reused -- the driver-level
                              # counterpart to search-export/python's
                              # psycopg2 param_bind and this cell's own
                              # ORM-level param_bind entries
  suggested_sink_family: sql_string_literal   # existing family; reused
