# Corpus cell: search/filtering + reporting/exports/dashboards (merged
# feature row, per docs/VULN_CORPUS_EXPANSION_PLAN.md Phase 1 row 5) -- PHP.
#
# Pairing status: matched pair present (raw-concat vulnerable vs.
# escaped-concat idiomatic search-filter WHERE building), plus two
# additional vulnerable-shape examples (CSV export reusing the same
# raw WHERE, and a standalone XXE-in-XML-parsing example) that broaden
# coverage beyond the single-parameter trivial case, per this cell's
# assignment note to prioritize shapes beyond fuzzlab's existing
# raw-concat/param-bind SQLi modeling.
#
# gitleaks: available (`which gitleaks` -> /usr/bin/gitleaks). Every file
# in this directory was scanned with `gitleaks detect --source <file>
# --no-git` before being committed; idiomatic-1.php's hardcoded DB
# credentials were the one hit and are redacted below (redacted: true).
# All other files scanned clean and were also skimmed manually for PII
# per the plan's manual-read requirement; none found.

- file: vulnerable-1.php
  role: vulnerable
  repo: Shadowss/TravianZ
  commit_sha: 3dbe9c71ecf345e533dfc6381d67760d8de8d415
  license: "GPL-3.0 (copyleft -- smallest illustrative fragment kept per the plan's copyleft handling rule, not a full-file copy; upstream file is a2b2.php)"
  pattern: "multi-branch $_GET-driven filter builds a raw-concat WHERE clause reused unparameterized across 3 separate queries (count, page listing, running-balance subquery) in the same request"
  notes: "Beyond-trivial shape: one tainted filter value threaded through multiple sinks, not a single one-shot concat. Fragment extracted from a much larger page (a2b2.php); trimmed to the filter-building + 3 query sites only, consistent with GPLv3's 'smallest fragment' handling."
  validated: false
  validated_by: []
  redacted: false
  # --- appended during Phase 3; migrated to cwe_shared/cwe_unique per
  # PA-0033's tightened standard. NOTE: researched from trained knowledge,
  # not a live MITRE lookup -- cwe.mitre.org is blocked by this
  # environment's egress proxy (confirmed via curl and WebFetch);
  # recorded honestly rather than fabricated. ---
  cwe_shared: [CWE-89]
  cwe_unique: [CWE-840, CWE-682]
  cwe_rationale: >
    CWE-840 (Business Logic Errors): the same tainted filter value is
    reused in a "running-balance subquery", so a manipulated filter can
    directly alter a financial balance CALCULATION, a business-logic
    consequence distinct from simple data disclosure elsewhere in this
    file's other two query sites. CWE-682 (Incorrect Calculation): that
    running-balance subquery folds the injected/unvalidated filter
    condition directly into an aggregate computation, so injection there
    doesn't just change which rows match -- it can distort the computed
    value itself.
  suggested_op: raw_concat   # same shape lab/safety_matrix.yaml already
                              # covers -- a string-built WHERE clause with
                              # no transform at all, just reused across 3
                              # queries in one request; reuse, don't invent
  suggested_sink_family: sql_string_literal   # existing family; reused

- file: vulnerable-2.php
  role: vulnerable
  repo: sn123686-dev/student-management-system
  commit_sha: 3d9c8dcd26a032c9aeb360ba5ea80676acc6d424
  license: "MIT (LICENSE file present; repo also states MIT in its README)"
  pattern: "search+filter+course params concatenated into a WHERE clause via `sanitize()` (htmlspecialchars/strip_tags only -- an XSS mitigation, NOT SQL escaping), then reused for both the paginated listing AND a CSV export ($_GET['export']=csv) -- exactly the search+export combined shape this cell targets. A separate bulk-delete path in the same file also concatenates raw POSTed IDs into a `WHERE id IN (...)` clause."
  notes: "Confirmed sanitize() (config.php) is `htmlspecialchars(strip_tags(trim($data)))` -- does not escape SQL metacharacters, so the WHERE-clause concatenation is genuinely SQLi-vulnerable despite the app calling a 'sanitize' function on every input. Full file copied (small, single-purpose page)."
  validated: false
  validated_by: []
  redacted: false
  # --- appended during Phase 3; migrated to cwe_shared/cwe_unique per
  # PA-0033's tightened standard. ---
  cwe_shared: [CWE-89]
  cwe_unique: [CWE-1236, CWE-862]
  cwe_rationale: >
    CWE-1236 (Improper Neutralization of Formula Elements in a CSV File):
    the same unescaped filter/search values feed directly into a CSV
    export (`$_GET['export']=csv`) alongside the paginated listing, with
    nothing shown neutralizing leading `=`/`+`/`-`/`@` characters that a
    spreadsheet application (Excel/Sheets) would interpret as a formula
    on open -- this is this cell's own literal "search+export" shape.
    CWE-862 (Missing Authorization): the separate bulk-delete path
    concatenates raw POSTed IDs into a `WHERE id IN (...)` clause with no
    check that the requesting user owns/may-delete those specific
    records, a second, independent sink in this same file distinct from
    the search/CSV path's SQLi.
  suggested_op: raw_concat   # sanitize() is an XSS mitigation
                              # (htmlspecialchars/strip_tags), not SQL
                              # escaping -- for the SQL sink this is
                              # indistinguishable from no transform at all,
                              # same shape lab/safety_matrix.yaml already
                              # has; reuse, don't invent
  suggested_sink_family: sql_string_literal   # existing family; reused

- file: vulnerable-3.php
  role: vulnerable
  repo: rubennati/vulnerable-php-code-examples
  commit_sha: e2af893e32fb8efa2d8a8dc952efa0b1f92c5709
  license: MIT
  pattern: "DOMDocument::loadXML() on raw user-supplied XML body ($_POST['xml']) with LIBXML_NOENT set, enabling external entity resolution (XXE, CWE-611) -- representative of the XML-report/import-parsing sink the assignment calls out (XXE in report/export template or import pipelines), kept generic since this cell did not turn up a real, permissively-licensed production report/export pipeline reaching this exact sink."
  notes: "Repo is a small, purpose-built collection of individually-licensed vulnerable-PHP teaching snippets (MIT), not a report-export application itself -- labeled here as a tutorial/reference example per the plan's tutorial-code labeling requirement, illustrating the XXE half of this cell's CWE list (CWE-89/943/611/1336) since a real, license-clean XXE-in-report-generation example was not found within this collection pass."
  validated: false
  validated_by: []
  redacted: false
  # --- appended during Phase 3; migrated to cwe_shared/cwe_unique per
  # PA-0033's tightened standard. ---
  cwe_shared: [CWE-611]
  cwe_unique: [CWE-213, CWE-776]
  cwe_rationale: >
    CWE-213 (Exposure of Sensitive Information Due to Incompatible
    Policies): `echo $doc->saveXML();` reflects the FULLY
    entity-substituted document straight back to the client, so any
    successfully-resolved external entity (e.g. local file content) is
    directly returned in the HTTP response -- the exfiltration channel
    itself. CWE-776 (Improper Restriction of Recursive Entity References
    in DTDs / XML Entity Expansion): with LIBXML_NOENT set and no
    libxml_disable_entity_loader()/entity-count or size limit configured,
    nested internal entity definitions (a "billion laughs" payload) can
    cause catastrophic memory/CPU consumption -- a distinct DoS vector
    from the data-exfiltration angle CWE-213 covers.
  suggested_op: xml_external_entities_enabled   # new op: DOMDocument::loadXML()
                                                  # called with LIBXML_NOENT,
                                                  # no libxml_disable_entity_loader
                                                  # / no LIBXML_NONET -- genuinely
                                                  # new transform-absent shape,
                                                  # not an SQL op
  suggested_sink_family: xml_parse_input   # new family: an XML parser fed
                                            # raw untrusted document text

- file: idiomatic-3-altered.php
  role: idiomatic
  derived_from: vulnerable-3.php
  manufactured: true
  license: n/a (manufactured, derived from vulnerable-3.php's real structure per the plan's methodology; no additional upstream source copied)
  notes: >
    MANUFACTURED per docs/VULN_CORPUS_PAIR_MANUFACTURING_PLAN.md's
    "Per-pair mechanics" (Phase 3, worst-gap group 5 of 5). Missing
    idiomatic counterpart for vulnerable-3.php's CWE-611 XXE
    (DOMDocument::loadXML() called with LIBXML_NOENT on raw
    $_POST['xml']). Minimal-pair discipline: identical input source
    ($_POST['xml']), identical DOMDocument/loadXML/saveXML shape. The
    ONLY mechanism difference is that LIBXML_NOENT (the flag telling
    libxml to substitute entity references, including external ones,
    inline) is omitted, and LIBXML_NONET is passed instead (blocks any
    network-based entity resolution as defense in depth).
  pattern: "$doc->loadXML($xml, LIBXML_NONET) -- no LIBXML_NOENT flag, so external entity references in the input are never substituted/resolved."
  validated: true
  validated_by: [semgrep-custom-rule, php-lint, gvisor-sandbox-dynamic, manual-review]
  redacted: false
  cwe_shared: [CWE-611]
  cwe_unique: [CWE-665, CWE-918]
  cwe_rationale: >
    CWE-665 (Improper Initialization): this fix's safety rests entirely
    on the ABSENCE of the LIBXML_NOENT flag rather than an affirmative,
    explicit disable of entity loading -- the DOMDocument's entity
    handling is left at its implementation default instead of being
    positively configured, so a future edit that adds LIBXML_NOENT back
    (e.g. "why isn't my entity substituting") would silently reopen the
    hole with no test catching it. CWE-918 (Server-Side Request Forgery):
    LIBXML_NONET specifically defends against the SSRF-flavored variant
    of this bug, where the XML parser itself is made to act as a proxy
    fetching internal/network resources on the attacker's behalf via a
    network-scheme SYSTEM entity.
    (Originally recorded as CWE-441 -- Unintended Proxy or Intermediary,
    'Confused Deputy' -- until this Phase 3 final batch's own cross-file
    run of `check-corpus-cwe-coverage.sh` surfaced a pre-existing
    collision with insecure-deserialization/python's
    vulnerable-job-cache-pickle-3.py entry, which also claimed CWE-441 as
    unique; reassigned here to CWE-918, which fits this entry's own
    described mechanism -- an XML parser forced to fetch a
    network-scheme SYSTEM entity on the attacker's behalf -- at least as
    precisely as CWE-441 did, per the same collision-fix class already
    applied once before in CC-LAB-0228 for ecommerce-logic's
    CWE-841/CWE-1339 collision.)
  suggested_op: xml_external_entities_disabled   # new op: the direct fix
                                                  # counterpart to
                                                  # vulnerable-3.php's
                                                  # xml_external_entities_enabled
  suggested_sink_family: xml_parse_input   # existing family, reused (see
                                            # vulnerable-3.php)
  validation_note: >
    Dynamically validated end-to-end in the gVisor sandbox
    (`fuzzlab/tools/corpus_validation_sandbox.py`, `run_in_sandbox`,
    authorized=True): a crafted payload declaring `<!ENTITY x SYSTEM
    "file:///.../secret.txt">` and referencing `&x;` in the document body
    was run against both this file and vulnerable-3.php with identical
    $_POST['xml'] input. vulnerable-3.php's output substitutes the
    entity and leaks the local file's contents into the response;
    this file's output leaves the literal, unresolved `&x;` in place --
    proving the fix actually closes the entity-resolution channel, not
    just that the flag differs syntactically.

- file: idiomatic-1.php
  role: idiomatic
  repo: dusova/wallst-consulting-website
  commit_sha: 05aedad430180949869deca9d66439c34e9d3618
  license: Apache-2.0
  pattern: "category+search filters run through mysqli_real_escape_string() before being concatenated into a WHERE clause -- the 'escaped concat' idiom, contrasted with vulnerable-1.php/vulnerable-2.php's raw (unescaped) concat of the same shape."
  notes: "Same code shape as the vulnerable pair (string-built WHERE clause, not a query-builder/ORM) but with the values escaped before concatenation -- illustrates the idiomatic-but-still-fragile intermediate step real codebases take before adopting parameter binding, rather than a fully parameterized ideal. redacted: true -- this file hardcoded a live-looking DB host/username/password (mysqli_connect(...)); gitleaks flagged it and the three constants were replaced with REDACTED_DB_* placeholders before first commit, per the plan's 'scrub before first commit, not after' rule."
  validated: false
  validated_by: []
  redacted: true
  # --- appended during Phase 3; migrated to cwe_shared/cwe_unique per
  # PA-0033's tightened standard. ---
  cwe_shared: [CWE-89]
  cwe_unique: [CWE-176, CWE-798]
  cwe_rationale: >
    CWE-176 (Improper Handling of Unicode Encoding): mysqli_real_escape_
    string()'s correctness depends on the DB connection's character set
    being configured correctly; on a connection using a vulnerable
    multi-byte charset (e.g. GBK) this escaping-based defense has a
    well-documented bypass class distinct from the parameter-binding
    approach idiomatic-1.js/etc. use elsewhere in this corpus. CWE-798
    (Use of Hard-coded Credentials): this file's own `mysqli_connect(...)`
    call originally hardcoded a live-looking DB host/username/password
    (per this manifest's own note above); the three REDACTED_DB_*
    placeholders mark exactly where those credentials were scrubbed
    before first commit.
  suggested_op: driver_escape_string   # new op (not a reuse): mysqli_real_
                                        # escape_string() is a real driver-level
                                        # escaping call -- stronger than the
                                        # existing strip_quotes_naive (which only
                                        # strips a literal quote char) but still
                                        # not param_bind; distinct transform,
                                        # not yet in the matrix's vocabulary
  suggested_sink_family: sql_string_literal   # existing family; reused --
                                               # same quoted-literal WHERE
                                               # position as the vulnerable
                                               # pair above

