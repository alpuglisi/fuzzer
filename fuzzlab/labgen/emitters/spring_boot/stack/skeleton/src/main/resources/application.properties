# TrackerNest lab skeleton -- overridden at boot time by
# fuzzlab.labgen.conformance.live_boot_spring_boot (SERVER_PORT env var), same
# convention php_laravel's .env / node_express's PORT env var use. Debug
# features left at Spring Boot's own defaults (off) -- no actuator/devtools
# dependency is declared in pom.xml, so there is no debug-endpoint
# information-disclosure surface to disable here, unlike php_laravel's
# APP_DEBUG=false requirement (see php_laravel/stack_env.py for that one).
spring.application.name=trackernest
server.port=8000
# CC-LAB-0191: an explicit 5 MiB multipart cap -- Netflix's profile-avatar
# upload cell's own fixed lab-only bound, the same "fixed demo value"
# convention webhookSecret/jwtSecret already use, and the same magnitude
# go_net_http's own ReadUploadedFileSource (CC-LAB-0186) enforces via
# io.LimitReader. Spring Boot's own multipart auto-configuration is what
# lets the raw Servlet Part API (request.getPart) parse multipart bodies
# at all -- these two properties only tighten its size defaults, they do
# not turn multipart support on (it is already on by default).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
