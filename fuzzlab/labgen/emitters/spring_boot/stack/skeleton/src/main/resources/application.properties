# TrackerNest lab skeleton -- overridden at boot time by
# fuzzlab.labgen.conformance.live_boot_spring_boot (SERVER_PORT env var), same
# convention php_laravel's .env / node_express's PORT env var use. Debug
# features left at Spring Boot's own defaults (off) -- no actuator/devtools
# dependency is declared in pom.xml, so there is no debug-endpoint
# information-disclosure surface to disable here, unlike php_laravel's
# APP_DEBUG=false requirement (see php_laravel/stack_env.py for that one).
spring.application.name=trackernest
server.port=8000
