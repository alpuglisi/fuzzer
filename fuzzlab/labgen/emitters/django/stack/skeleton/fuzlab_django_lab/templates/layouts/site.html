<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}PicTrail{% endblock %}</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #fafafa; color: #262626; }
        header { background: #fff; border-bottom: 1px solid #dbdbdb; padding: 14px 24px; }
        header h1 { margin: 0 0 8px 0; font-size: 22px; font-style: italic; }
        header h1 a { color: #262626; text-decoration: none; }
        header nav a { color: #0095f6; margin-right: 14px; text-decoration: none; font-size: 13px; }
        header nav a:hover { text-decoration: underline; }
        main { max-width: 760px; margin: 24px auto; background: #fff; padding: 24px; border: 1px solid #dbdbdb; }
        footer { text-align: center; color: #8e8e8e; font-size: 12px; padding: 16px; }
        form label { display: block; margin-top: 10px; font-size: 13px; }
        form input, form textarea, form select { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 2px; }
        form button { margin-top: 14px; padding: 8px 16px; }
        .site-list a { display: block; margin: 4px 0; }
        .photo { background: #efefef; border: 1px solid #dbdbdb; height: 180px; display: flex; align-items: center; justify-content: center; color: #8e8e8e; }
        .empty { color: #8e8e8e; }
    </style>
</head>
<body>
<header>
    <h1><a href="/">PicTrail</a></h1>
    <nav>
        <a href="/">Home</a>
        <a href="/explore">Explore</a>
        <a href="/post">Post</a>
        <a href="/post/comments">Comments</a>
        <a href="/upload">Share a link</a>
        <a href="/inbox">Inbox</a>
        <a href="/settings">Settings</a>
        <a href="/catalog">Catalog</a>
    </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>PicTrail &mdash; lab-only, authorized-testing target.</footer>
</body>
</html>
